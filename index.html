<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 720;
const H = 420;


/* =====================================================
   UI
===================================================== */

const bestEl = document.getElementById("best");

/* =====================================================
   ÂM THANH — Web Audio, không cần file ngoài
===================================================== */

const soundToggle = document.getElementById("soundToggle");

let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;
let musicTimer = null;
let musicStep = 0;
let soundEnabled = true;

function ensureAudio(){
    if(!soundEnabled) return false;

    try{
        if(!audioCtx){
            const AC = window.AudioContext || window.webkitAudioContext;
            if(!AC) return false;

            audioCtx = new AC();

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.0;
            masterGain.connect(audioCtx.destination);

            musicGain = audioCtx.createGain();
            musicGain.gain.value = 0.16;
            musicGain.connect(masterGain);

            sfxGain = audioCtx.createGain();
            sfxGain.gain.value = 0.55;
            sfxGain.connect(masterGain);
        }

        if(audioCtx.state !== "running") audioCtx.resume().catch(()=>{});
        return true;
    }catch(e){
        return false;
    }
}

/* Mở khóa Web Audio chắc chắn bằng đúng thao tác click/chạm của người chơi. */
function unlockAudio(){
    if(!soundEnabled) return false;
    if(!ensureAudio()) return false;

    try{
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        osc.connect(gain);
        gain.connect(sfxGain);
        osc.start(t);
        osc.stop(t + 0.2);

        if(!musicTimer) startMusic();
        return true;
    }catch(e){
        return false;
    }
}

function tone(freq, duration=.08, type="sine", volume=.12, when=0){
    if(!ensureAudio()) return;

    const t = audioCtx.currentTime + when;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(
        Math.max(0.0001, volume),
        t + 0.008
    );
    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        t + duration
    );

    osc.connect(gain);
    gain.connect(sfxGain);

    osc.start(t);
    osc.stop(t + duration + 0.02);
}

function noise(duration=.12, volume=.12, filterFreq=1200){
    if(!ensureAudio()) return;

    const length = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
    const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);

    for(let i=0;i<length;i++){
        data[i] = (Math.random()*2-1) * (1-i/length);
    }

    const source = audioCtx.createBufferSource();
    const filter = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();

    filter.type = "lowpass";
    filter.frequency.value = filterFreq;

    gain.gain.setValueAtTime(Math.max(0.0001, volume), audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
    );

    source.buffer = buffer;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(sfxGain);

    source.start();
}

function playSfx(name){
    if(!soundEnabled) return;

    switch(name){
        case "pickup":
            tone(660,.06,"triangle",.16);
            tone(990,.10,"triangle",.13,.055);
            break;

        case "skill":
            tone(440,.08,"sine",.12);
            tone(660,.08,"sine",.13,.07);
            tone(880,.14,"sine",.14,.14);
            break;

        case "enemy":
            tone(150,.07,"square",.10);
            tone(90,.12,"sawtooth",.07,.045);
            noise(.08,.06,900);
            break;

        case "hurt":
            tone(120,.16,"sawtooth",.13);
            tone(75,.20,"square",.08,.06);
            break;

        case "fire":
            noise(.16,.10,1700);
            tone(180,.10,"sawtooth",.08);
            break;

        case "electric":
            tone(950,.055,"square",.10);
            tone(1450,.045,"square",.08,.045);
            tone(1900,.06,"square",.06,.09);
            break;

        case "ice":
            tone(1200,.10,"sine",.08);
            tone(1750,.16,"triangle",.09,.07);
            break;

        case "laser":
            tone(520,.08,"sawtooth",.08);
            tone(1100,.14,"sine",.09,.035);
            break;

        case "vortex":
            tone(220,.20,"sine",.08);
            tone(140,.25,"sine",.06,.08);
            break;

        case "bomb":
            noise(.22,.16,700);
            tone(75,.20,"square",.10);
            break;

        case "heal":
            tone(523,.08,"sine",.10);
            tone(784,.10,"sine",.11,.08);
            tone(1047,.16,"sine",.12,.16);
            break;

        case "shield":
            tone(330,.10,"triangle",.08);
            tone(495,.14,"triangle",.09,.07);
            break;

        case "gameover":
            tone(392,.13,"sine",.10);
            tone(294,.16,"sine",.09,.12);
            tone(196,.30,"sine",.10,.27);
            break;

        case "start":
            tone(392,.07,"triangle",.10);
            tone(523,.09,"triangle",.12,.07);
            tone(784,.16,"triangle",.14,.16);
            break;

        case "move":
            tone(180,.035,"square",.035);
            break;

        case "spawn":
            tone(95,.06,"sine",.035);
            break;

        case "fruit":
            tone(520,.05,"triangle",.07);
            tone(700,.08,"triangle",.08,.045);
            break;

        case "rainbow":
            tone(523,.06,"sine",.08);
            tone(659,.06,"sine",.08,.055);
            tone(784,.10,"sine",.10,.11);
            tone(1047,.16,"sine",.12,.19);
            break;

        case "skillEnd":
            tone(440,.08,"sine",.07);
            tone(330,.12,"sine",.06,.08);
            break;

        case "score":
            tone(660,.045,"triangle",.06);
            tone(880,.07,"triangle",.07,.05);
            break;

        case "button":
            tone(500,.05,"triangle",.055);
            break;

        case "milestone":
            tone(523,.06,"triangle",.08);
            tone(659,.06,"triangle",.08,.06);
            tone(784,.12,"triangle",.10,.12);
            tone(1047,.20,"triangle",.11,.20);
            break;

        case "shieldHit":
            tone(700,.05,"triangle",.08);
            tone(980,.08,"triangle",.07,.045);
            break;
    }
}

function musicTick(){
    if(!soundEnabled || !audioCtx || audioCtx.state !== "running") return;

    const notes = [261.63,329.63,392,329.63,293.66,349.23,440,349.23];
    const bass  = [130.81,164.81,196,164.81];

    const n = notes[musicStep % notes.length];
    const b = bass[musicStep % bass.length];

    const t = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.value = n;
    gain.gain.setValueAtTime(0.0001,t);
    gain.gain.exponentialRampToValueAtTime(0.07,t+.02);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+.27);
    osc.connect(gain);
    gain.connect(musicGain);
    osc.start(t);
    osc.stop(t+.3);

    if(musicStep % 2 === 0){
        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = "sine";
        bassOsc.frequency.value = b;
        bassGain.gain.setValueAtTime(0.0001,t);
        bassGain.gain.exponentialRampToValueAtTime(0.045,t+.02);
        bassGain.gain.exponentialRampToValueAtTime(0.0001,t+.42);
        bassOsc.connect(bassGain);
        bassGain.connect(musicGain);
        bassOsc.start(t);
        bassOsc.stop(t+.45);
    }

    musicStep++;
}

/* =====================================================
   NHẠC GAME — đổi bài mỗi 100 điểm + hết playlist thì lặp lại
   Các file nhạc nằm cùng thư mục với file HTML.
===================================================== */

const gameMusicTracks = [
    "astronaut12-victory-awaits-in-the-gaming-universe_astronaut-265184.mp3",
    "kiravale-gaming-music-593659.mp3",
    "alex-morgan-gaming-rock-545508 (1).mp3"
];

const gameMusic = new Audio();
gameMusic.preload = "auto";
gameMusic.volume = 0.35;

let gameMusicIndex = 0;
let gameMusicRunning = false;
let gameMusicEndedStage = -1;

function playGameMusic(index, resetPosition=true){
    if(!soundEnabled) return;
    if(!gameMusicTracks.length) return;

    gameMusicIndex = ((index % gameMusicTracks.length) + gameMusicTracks.length) % gameMusicTracks.length;

    const src = gameMusicTracks[gameMusicIndex];
    if(gameMusic.src.endsWith("/" + src) && !gameMusic.paused && !resetPosition){
        return;
    }

    gameMusic.src = src;
    if(resetPosition){
        try{ gameMusic.currentTime = 0; }catch(e){}
    }

    gameMusic.play().catch(()=>{});
    gameMusicRunning = true;
}

/* Khi một bài hát hết, tự chuyển sang bài kế tiếp. Hết danh sách thì quay lại bài đầu. */
gameMusic.addEventListener("ended", function(){
    if(!soundEnabled) return;
    gameMusicIndex = (gameMusicIndex + 1) % gameMusicTracks.length;
    gameMusicEndedStage = Math.floor(Math.max(0, score) / 100);
    playGameMusic(gameMusicIndex, true);
});

function updateGameMusicByScore(){
    if(!soundEnabled) return;

    const scoreStage = Math.floor(Math.max(0, score) / 100);
    const scoreTrackIndex = scoreStage % gameMusicTracks.length;

    /* Nếu bài vừa hết giữa một mốc 100 điểm, cho bài kế tiếp chạy đến mốc kế tiếp. */
    if(scoreStage === gameMusicEndedStage){
        return;
    }

    if(!gameMusicRunning){
        playGameMusic(scoreTrackIndex, true);
        return;
    }

    if(scoreTrackIndex !== gameMusicIndex){
        playGameMusic(scoreTrackIndex, true);
        showMessage("🎵 Đổi bài hát!");
    }

    gameMusicEndedStage = -1;
}

function startMusic(){
    if(!ensureAudio()) return;

    /* Nhạc MP3 mới thay cho nhạc Web Audio cũ. */
    playGameMusic(Math.floor(Math.max(0, score) / 100) % gameMusicTracks.length, true);
}

function stopMusic(){
    if(musicTimer){
        clearInterval(musicTimer);
        musicTimer = null;
    }

    gameMusic.pause();
    gameMusicRunning = false;
}

soundToggle.addEventListener("click", function(e){
    e.preventDefault();

    if(!soundEnabled){
        soundEnabled = true;
        soundToggle.textContent = "🔊 Âm thanh";
        unlockAudio();
        playSfx("pickup");
        return;
    }

    /* Nếu âm thanh đang bật nhưng chưa được trình duyệt mở khóa, click này sẽ mở khóa. */
    if(!audioCtx || audioCtx.state !== "running") {
        unlockAudio();
        soundToggle.textContent = "🔊 Âm thanh";
        return;
    }

    soundEnabled = false;
    soundToggle.textContent = "🔇 Tắt tiếng";
    stopMusic();
    if(audioCtx) audioCtx.suspend().catch(()=>{});
});

/* Trình duyệt chỉ cho phát âm thanh sau thao tác của người dùng. */
document.addEventListener("pointerdown", function(){
    if(soundEnabled){
        ensureAudio();
        if(!musicTimer) startMusic();
    }
}, {passive:true});

document.addEventListener("touchstart", function(){
    if(soundEnabled){
        ensureAudio();
        if(!musicTimer) startMusic();
    }
}, {passive:true});

document.addEventListener("keydown", function(){
    if(soundEnabled) ensureAudio();
}, {once:false});

const startButton = document.getElementById("start");

===================================================== */

        const value =
            Number(
                localStorage.getItem("neQuaiBest")
            );

        return Number.isFinite(value)
            ? value
            : 0;

    }catch(error){

        return 0;
    }
}


function saveBest(value){

    try{

        localStorage.setItem(
            "neQuaiBest",
            String(value)
        );

    }catch(error){

        /*
           Nếu trình duyệt chặn localStorage
           game vẫn tiếp tục chạy bình thường.
        */
    }
}

const SKINS = [

    {id:"fire", name:"Đỏ Rực Lửa", price:1000, icon:"🔥", desc:"Nhân vật lửa · đạn lửa · băng lửa"},
    {id:"ice", name:"Băng Tuyết", price:2000, icon:"❄️", desc:"Nhân vật băng · tia băng pha lê"},
    {id:"leaf", name:"Lá", price:5000, icon:"🍃", desc:"Nhân vật lá · đạn lá · tia băng xanh"},
    {id:"octopus", name:"Bạch Tuộc", price:7000, icon:"🐙", desc:"Nhân vật bạch tuộc · bắn tia mực"},
    {id:"devil", name:"Quỷ", price:70000, icon:"😈", desc:"Nhân vật quỷ · đạn địa ngục · hào quang bóng tối"}
];

function loadCoins(){
    try{
        const value = Number(localStorage.getItem("neQuaiCoins"));
        return Number.isFinite(value) && value >= 0 ? Math.floor(value) : 0;
    }catch(error){ return 0; }
}

function saveCoins(){
    try{ localStorage.setItem("neQuaiCoins", String(coins)); }catch(error){}
}

function loadOwnedSkins(){
    try{
        const raw = JSON.parse(localStorage.getItem("neQuaiOwnedSkins") || '["neon"]');
        return Array.isArray(raw) && raw.includes("neon") ? raw : ["neon"];
    }catch(error){ return ["neon"]; }
}

function saveOwnedSkins(){
    try{ localStorage.setItem("neQuaiOwnedSkins", JSON.stringify(ownedSkins)); }catch(error){}
}

function loadSelectedSkin(){
    try{
        const id = localStorage.getItem("neQuaiSelectedSkin") || "neon";
        return SKINS.some(s => s.id === id) ? id : "neon";
    }catch(error){ return "neon"; }
}

function saveSelectedSkin(){
    try{ localStorage.setItem("neQuaiSelectedSkin", selectedSkin); }catch(error){}
}

let coins = loadCoins();
let ownedSkins = loadOwnedSkins();
let selectedSkin = loadSelectedSkin();

function skinById(id){
    return SKINS.find(s => s.id === id) || SKINS[0];
}

function updateCoinsUI(){
    coinsEl.textContent = coins;
    shopCoinsEl.textContent = coins;
    skinNameTopEl.textContent = skinById(selectedSkin).name;
}

function renderShop(){
    shopListEl.innerHTML = "";

    for(const skin of SKINS){
        const owned = ownedSkins.includes(skin.id);
        const equipped = selectedSkin === skin.id;

        const card = document.createElement("div");
        card.className = "skinCard";
        card.innerHTML = `
            <div class="skinPreview">${skin.icon}</div>
            <div class="skinName">${skin.name}</div>
            <div class="skinPrice">${skin.desc}<br>${skin.price === 0 ? "Miễn phí" : "🪙 " + skin.price + " Xu"}</div>
        `;

        const button = document.createElement("button");
        button.className = "skinAction" + (equipped ? " equipped" : owned ? " owned" : "");
        button.textContent = equipped ? "✓ Đang dùng" : owned ? "Trang bị" : `Mua · 🪙 ${skin.price}`;

        button.addEventListener("click", () => {
            if(owned){
                selectedSkin = skin.id;
                saveSelectedSkin();
                updateCoinsUI();
                renderShop();
                draw();
                showMessage("🎨 " + skin.name);
                return;
            }

            if(coins < skin.price){
                showMessage("❌ Không đủ Xu!");
                return;
            }

            coins -= skin.price;
            ownedSkins.push(skin.id);
            selectedSkin = skin.id;
            saveCoins();
            saveOwnedSkins();
            saveSelectedSkin();
            updateCoinsUI();
            renderShop();
            draw();
            showMessage("🎉 Mở khóa " + skin.name + "!");
        });

        card.appendChild(button);
        shopListEl.appendChild(card);
    }

    updateCoinsUI();
}

function openShop(){
    renderShop();
    shopPanel.classList.add("open");
    shopPanel.setAttribute("aria-hidden", "false");
}

function closeShop(){
    shopPanel.classList.remove("open");
    shopPanel.setAttribute("aria-hidden", "true");
}

shopButton.addEventListener("click", openShop);
closeShopButton.addEventListener("click", closeShop);
shopPanel.addEventListener("click", e => {
    if(e.target === shopPanel) closeShop();
});

window.addEventListener("keydown", e => {
    if(e.key === "Escape") closeShop();
});

/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    amount = 8
){

    const available =
        MAX_PARTICLES -
        particles.length;

    const count =
        Math.min(
            amount,
            Math.max(0,available)
        );


    for(let i=0;i<count;i++){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*180,

            vy:
                (Math.random()-.5)*180,

            life:
                .25 +
                Math.random()*.35
        });
    }
}


/* =====================================================
   PLAYER - ENEMY COLLISION
===================================================== */

function enemyHitsPlayer(e){

    return (

        Math.abs(
            player.x - e.x
        )

        <

        (
            player.width/2 +
            e.size/2
        )

    )

    &&

    (

        Math.abs(
            player.y - e.y
        )

        <

        (
            player.height/2 +
            e.size/2
        )
    );
}

   SPAWN ENEMY

    }

        {

        },

        {
            size:26,

        },
        {
            size:34,

            hp:2
        },
        {
            size:43,

            hp:3
        }
    ];


    const type =
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];

        x:

        y: initialSpawn

        speed:

            Math.min(

            ),

/* =====================================================
   KILL ENEMY
===================================================== */

function killEnemy(index){

    if(
        index < 0 ||
        index >= enemies.length
    ){

        return;
    }


    const e = enemies[index];


    if(e.dying){
        return;
    }

    // Quái không biến mất ngay: nhạt màu dần rồi mới tan biến.
    e.dying = true;
    e.deathFade = 1;
    e.frozen = 0;

    createParticles(
        e.x,
        e.y,
        7
    );

    score += 3;
    coins += 1;
    saveCoins();
    updateCoinsUI();
    playSfx("enemy");
}

        currentSkill === "🛡️ Khiên"

/* =====================================================
   PLAYER
   CHỈ TRÁI / PHẢI
===================================================== */

function updatePlayer(dt){

    if(keys.left){

        player.x -=
            player.speed * dt;
    }


    if(keys.right){

        player.x +=
            player.speed * dt;
    }


    player.x =
        Math.max(

            player.width/2,

            Math.min(

                W -
                player.width/2,

                player.x
            )
        );
}


/* =====================================================
   ENEMY UPDATE
===================================================== */

function updateEnemies(dt){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e =
            enemies[i];

        // Đang chết: đứng lại và nhạt dần trước khi biến mất.
        if(e.dying){
            e.deathFade -= dt * 2.8;
            if(e.deathFade <= 0){
                enemies.splice(i,1);
            }
            continue;
        }

        /*
           🍔 QUÁI ĐÃ BIẾN THÀNH ĐỒ ĂN
           Cho món ăn rơi thẳng xuống để người chơi có thể ăn.
           Không quay trở lại thành quái; nếu không ăn thì rơi khỏi màn hình.
        */
        if(e.foodType){
            e.y += e.speed * dt * 1.18;
        }else{
            /*
               🧊 ĐÓNG BĂNG TOÀN MÀN
               Mỗi con quái rơi vào màn trong lúc skill đang hoạt động
               sẽ bị đóng băng ngay tại vị trí hiện tại, rồi tự bể.
            */
            if(currentSkill === "🧊 Đóng Băng Toàn Màn" && e.frozen <= 0 && e.freezeKillTimer <= 0){
                e.frozen = 0.75;
                e.freezeKillTimer = 0.65;
                e.shatter = 0;
            }

            if(e.frozen > 0){
                e.frozen -= dt;
            }else if(e.freezeKillTimer <= 0){
                e.y +=
                    e.speed * dt * (currentSkill === "🕒 Làm Chậm Thời Gian" ? 0.32 : 1);
            }
        }


        /*
           ĐỤNG PLAYER
        */

        if(
            enemyHitsPlayer(e)
        ){

            if(e.foodType){
                const eatenFood = e.foodType;
                killEnemy(i);
                showMessage("😋 Ăn " + eatenFood + "! ");
                continue;
            }

            /*
               🌀 LỐC XOÁY:
               Quái bị hút chạm người chơi thì chết,
               không được gây mất máu — kể cả khi người chơi đang di chuyển.
            */
            if(
                currentSkill ===
                "🌀 Lốc Xoáy"
            ){
                killEnemy(i);
                continue;
            }

            if(
                currentSkill ===
                "🛡️ Khiên"
            ){

                killEnemy(i);

                continue;
            }


            enemies.splice(i,1);

            damagePlayer();


            if(!running){
                return;
            }


            continue;
        }


        /*
           RA KHỎI MÀN
        */

        if(
            e.y + e.size >= 395
        ){

            enemies.splice(i,1);
        }
    }
}


/* =====================================================
   BOM
   CHỈ GÂY DAMAGE PLAYER
===================================================== */

function updateBombs(dt){

    for(
        let i=bombs.length-1;
        i>=0;
        i--
    ){

        const b =
            bombs[i];


        b.y +=
            b.speed*dt;


        /*
           QUAN TRỌNG:

           KHÔNG KIỂM TRA BOM - QUÁI

           => BOM KHÔNG ẢNH HƯỞNG QUÁI
        */


        const distance =
            Math.hypot(

                b.x-player.x,

                b.y-player.y
            );


        /*
           CHỈ PLAYER
        */

        if(
            distance <
            b.radius+20
        ){

            createParticles(
                b.x,
                b.y,
                12
            );


            damagePlayer();


            bombs.splice(i,1);


            if(!running){
                return;
            }


            continue;
        }


        if(
            b.y + b.radius >= 395
        ){

            bombs.splice(i,1);
        }
    }
}


/* =====================================================
   FRUIT UPDATE
===================================================== */

function updateFruits(dt){

    for(
        let i=fruits.length-1;
        i>=0;
        i--
    ){

        const f =
            fruits[i];


        f.y +=
            f.speed*dt;


        /*
           ĂN TRÁI
        */

        if(

            Math.hypot(

                f.x-player.x,

                f.y-player.y

            ) < 35

        ){

            /*
               🌈
            */

            if(
                f.type ===
                "rainbow"
            ){
                playSfx("rainbow");

                const rainbowRoll = Math.random();

                if(rainbowRoll < 0.34){
                    currentSkill = "🌈 Khiên Lửa";
                    skillTime = 25;
                    skillAux = 0;
                }else if(rainbowRoll < 0.67){
                    currentSkill = "🌈 Song Hỏa";
                    skillTime = 25;
                    skillAux = 0;
                }else{
                    // 🍔 Đại Tiệc Đồ Ăn chỉ được xử lý trong useSkill()
                    // để hoàn toàn độc lập với lúc nhặt trái 7 màu.
                    currentSkill = "🍔 Đại Tiệc Đồ Ăn";
                    skillTime = 12;
                    skillAux = 0;
                }

                // Cầu vồng chỉ trao 1 skill đặc biệt, không tự thực hiện hiệu ứng của skill.
                // Không hồi HP và không biến quái ngay tại đây.
                hpTextUpdate();
            }


            /*
               ❤️
            */

            else if(
                f.type ===
                "heal"
            ){

                playSfx("heal");

                hp =
                    Math.min(
                        3,
                        hp+1
                    );

                hpTextUpdate();

                showMessage(
                    "❤️ +1 HP!"
                );
            }


            /*
               🍎
            */

            else{

                giveRandomSkill();
            }


            fruits.splice(i,1);

            continue;
        }


        if(
            f.y + 18 >= 395
        ){

            fruits.splice(i,1);
        }
    }
}


/* =====================================================
   HP
===================================================== */

function hpTextUpdate(){

    hpEl.textContent = hp;
}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(
        bullets.length >=
        MAX_BULLETS
    ){

        return;
    }


    bullets.push({

        x:player.x,

        y:player.y-22,

        speed:440,

        radius:5
    });
}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];


        b.y -=
            b.speed*dt;


        if(
            b.y < -30
        ){

            bullets.splice(i,1);

            continue;
        }


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const e =
                enemies[j];

            if(e.dying){
                continue;
            }


            if(

                Math.hypot(

                    b.x-e.x,

                    b.y-e.y

                )

                <

                b.radius+
                e.size/2

            ){

                e.hp--;


                createParticles(
                    e.x,
                    e.y,
                    3
                );


                bullets.splice(i,1);


                if(
                    e.hp<=0
                ){

                    killEnemy(j);
                }


                break;
            }
        }
    }
}


/* =====================================================
   SKILL ATTACK
===================================================== */

function useSkill(dt){

    if(
        currentSkill ===
        "Không"
    ){

        return;
    }


    /*
       🔥 PHUN LỬA
    */

    if(
        currentSkill ===
        "🔥 Phun lửa"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 120 &&

                player.y-e.y < 230

            ){

                killEnemy(i);
            }
        }
    }


    /*
       ⚡ ĐIỆN
    */

    if(
        currentSkill ===
        "⚡ Tia điện"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 95

            ){

                killEnemy(i);
            }
        }
    }


    /*
       ❄️ BĂNG

       Đầu tiên đóng băng.

       Sau đó đếm ngược.

       Cuối cùng tiêu diệt.
    */

    if(
        currentSkill ===
        "❄️ Tia băng"
    ){

        for(
            const e of enemies
        ){

            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 90 &&

                e.frozen <= 0 &&

                e.freezeKillTimer <= 0

            ){

                e.frozen = 1.2;

                e.freezeKillTimer = .65;
            }
        }


        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(
                e.freezeKillTimer > 0
            ){

                e.freezeKillTimer -= dt;


                if(
                    e.freezeKillTimer <= 0
                ){

                    killEnemy(i);
                }
            }
        }
    }


    /*
       🌈 SONG HỎA — 2 TIA LỬA
    */

    if(
        currentSkill ===
        "🌈 Song Hỏa"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e = enemies[i];
            const dy = player.y - e.y;

            if(
                dy > 0 &&
                dy < 420
            ){
                const p = dy / Math.max(1, player.y);
                const wave = Math.sin(performance.now()/105*1.8 + p*11) * (10 + p*24);
                const drift = p*p*105 + Math.sin(performance.now()/105 + p*7)*8;
                const leftPath  = player.x - drift - wave;
                const rightPath = player.x + drift + wave;

                if(
                    Math.abs(e.x-leftPath) < 38 + p*10 ||
                    Math.abs(e.x-rightPath) < 38 + p*10
                ){
                    killEnemy(i);
                }
            }
        }
    }


    /*
       🌀 LỐC XOÁY — hút quái gần người và quái bị hút sẽ chết
    */
    if(currentSkill === "🌀 Lốc Xoáy"){
        for(let i=enemies.length-1;i>=0;i--){
            const e=enemies[i];
            const d=Math.hypot(e.x-player.x,e.y-player.y);
            if(d<190 && !e.dying){
                const pull=Math.max(.04, Math.min(.18, (1-d/190)*.24))*dt*60;
                e.x += (player.x-e.x)*pull;
                e.y += (player.y-e.y)*pull;

                // Khi bị hút vào tâm lốc, quái sẽ chết.
                if(d<42) killEnemy(i);
            }
        }
    }

    /* ⚡⚡ SÉT LAN — đánh mục tiêu và lan sang quái gần */
    if(currentSkill === "⚡⚡ Sét Lan"){
        let hits=0;
        for(let i=enemies.length-1;i>=0 && hits<4;i--){
            const e=enemies[i];
            if(e.y<player.y && Math.hypot(e.x-player.x,e.y-player.y)<260){ killEnemy(i); hits++; }
        }
    }

    /*
       🧊 ĐÓNG BĂNG TOÀN MÀN
       Đóng băng tất cả quái -> chờ một nhịp -> quái tự nứt/bể hết.
       Không tạo món ăn và không tác động tới các object thức ăn.
    */
    if(currentSkill === "🧊 Đóng Băng Toàn Màn"){
        if(skillAux === 0){
            skillAux = 1;
            for(const e of enemies){
                if(!e.foodType){
                    e.frozen = 0.75;
                    e.freezeKillTimer = 0.65;
                    e.shatter = 0;
                }
            }
        }

        for(let i=enemies.length-1;i>=0;i--){
            const e = enemies[i];
            if(e.foodType) continue;

            if(e.freezeKillTimer > 0){
                e.freezeKillTimer -= dt;
                e.shatter = Math.max(0, 0.65 - e.freezeKillTimer);

                if(e.freezeKillTimer <= 0){
                    killEnemy(i);
                }
            }
        }
    }

    /* 💥 SÓNG XUNG KÍCH */
    if(currentSkill === "💥 Sóng Xung Kích"){
        const radius=90+(15-skillTime)*18;
        for(let i=enemies.length-1;i>=0;i--){
            const e=enemies[i];
            if(Math.hypot(e.x-player.x,e.y-player.y)<radius) killEnemy(i);
        }
    }


    /* ☄️ MƯA THIÊN THẠCH — quét ngẫu nhiên từ trên xuống */
    if(currentSkill === "☄️ Mưa Thiên Thạch"){
        skillAux -= dt;
        if(skillAux<=0){
            skillAux=.12;
            const target=enemies.length ? Math.floor(Math.random()*enemies.length) : -1;
            if(target>=0) killEnemy(target);
        }
    }

    /*
       🍔 ĐẠI TIỆC ĐỒ ĂN
       Biến toàn bộ quái thành món ăn và cho chúng rơi xuống.
       Người chơi chạm vào món ăn sẽ ăn món đó.
    */
    if(currentSkill === "🍔 Đại Tiệc Đồ Ăn"){
        const foods = ["🍔","🍕","🍗","🍩","🍟","🍣","🌮","🍰"];
        for(const e of enemies){
            if(!e.foodType){
                e.foodType = foods[Math.floor(Math.random()*foods.length)];
            }
            e.foodTimer = 0;
            e.frozen = 0;
        }
    }


    /* 🛡️ KHIÊN PHẢN ĐÒN — quái chạm người sẽ bị xóa bởi damagePlayer */

    /*
       🔆 LASER
    */

    if(

        currentSkill ===
        "🔆 Laser"

        ||

        currentSkill ===
        "🌈 Khiên Lửa"

    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 22

            ){

                killEnemy(i);
            }
        }
    }
}


/* =====================================================
   PARTICLES UPDATE
===================================================== */

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx*dt;

        p.y +=
            p.vy*dt;

        p.life -= dt;


        if(
            p.life <= 0
        ){

            particles.splice(i,1);
        }
    }
}



/* =====================================================
   DỌN RÁC - XÓA MỌI OBJECT RA KHỎI MÀN HÌNH
===================================================== */
function cleanupOffscreen(){
    // THANH XANH bắt đầu ở y=395. Vật thể rơi chạm thanh này thì xóa ngay.
    const groundY = 395;

    enemies = enemies.filter(e =>
        e.y + e.size < groundY &&
        e.x >= -e.size - 20 &&
        e.x <= W + e.size + 20
    );

    bombs = bombs.filter(b =>
        b.y + b.radius < groundY &&
        b.x >= -b.radius - 20 &&
        b.x <= W + b.radius + 20
    );

    fruits = fruits.filter(f =>
        f.y + 18 < groundY &&
        f.x >= -25 &&
        f.x <= W + 25
    );

    // Đạn bay lên: xóa khi ra khỏi mép trên hoặc hai mép ngang.
    bullets = bullets.filter(b =>
        b.y >= -b.radius - 20 &&
        b.x >= -b.radius - 20 &&
        b.x <= W + b.radius + 20
    );

    particles = particles.filter(p =>
        p.life > 0 &&
        p.x >= -40 && p.x <= W + 40 &&
        p.y >= -40 && p.y <= groundY + 10
    );
}

            ink.addColorStop(0,"#f2c9ff"); ink.addColorStop(.35,"#9b45e8"); ink.addColorStop(1,"#26063f");
            ctx.fillStyle=ink; ctx.beginPath(); ctx.arc(b.x,b.y,9,0,Math.PI*2); ctx.fill();
            ctx.strokeStyle="#e6a8ff"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(b.x,b.y,11+Math.sin(t)*2,0,Math.PI*2); ctx.stroke();
            for(let i=0;i<5;i++){ const a=t+i*Math.PI*2/5; ctx.fillStyle="#d47cff"; ctx.beginPath(); ctx.arc(b.x+Math.cos(a)*11,b.y+Math.sin(a)*11,2,0,Math.PI*2); ctx.fill(); }
        }else if(selectedSkin === "devil"){
            ctx.shadowBlur=22; ctx.shadowColor="#ff173d";
            const g=ctx.createLinearGradient(b.x,b.y-14,b.x,b.y+10);
            g.addColorStop(0,"#fff0c2"); g.addColorStop(.35,"#ff7a32"); g.addColorStop(.7,"#ff183d"); g.addColorStop(1,"#5a0015");
            ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(b.x,b.y-15); ctx.lineTo(b.x+6,b.y-4); ctx.lineTo(b.x+3,b.y+9); ctx.lineTo(b.x,b.y+13); ctx.lineTo(b.x-3,b.y+9); ctx.lineTo(b.x-6,b.y-4); ctx.closePath(); ctx.fill();
            ctx.fillStyle="#ffd76a"; ctx.beginPath(); ctx.arc(b.x,b.y-5,2,0,Math.PI*2); ctx.fill();
        }else if(selectedSkin === "leaf"){
            ctx.shadowBlur=16; ctx.shadowColor="#6dff8c"; ctx.fillStyle="#9be85b";
            ctx.translate(b.x,b.y); ctx.rotate(Math.sin(t)*.2);
            ctx.beginPath(); ctx.ellipse(0,-2,5,12,-.35,0,Math.PI*2); ctx.fill();
            ctx.strokeStyle="#e4ffc1"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(0,9); ctx.stroke();
        }else{
            const bg=ctx.createLinearGradient(b.x-4,b.y-10,b.x+4,b.y+10);
            bg.addColorStop(0,"#fffbd0"); bg.addColorStop(.45,"#ffe66b"); bg.addColorStop(1,"#ff9f1c");
            ctx.fillStyle=bg; ctx.shadowBlur=10; ctx.shadowColor="#ffe66b"; ctx.beginPath(); ctx.roundRect(b.x-4,b.y-10,8,20,4); ctx.fill();
            ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(b.x,b.y-3,2.2,0,Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }

    /*
       ENEMIES
    */

    for(
        const e of enemies
    ){

        if(e.foodType){
            ctx.save();
            ctx.textAlign = "center";
            ctx.font = "34px Arial";
            ctx.shadowColor = "#ffd166";
            ctx.shadowBlur = 16;
            ctx.fillText(e.foodType, e.x, e.y + 11);
            ctx.restore();
            continue;
        }

        let enemyColor;


        /*
           KHÔNG DÙNG MÀU ĐỎ
        */

        if(e.frozen > 0){
            enemyColor = "#66ddff";
        }else{
            const palette = [
                "#58d9ff", "#ff5d8f", "#a46cff",
                "#52df8a", "#ffc857", "#ff7a45"
            ];
            enemyColor = palette[Math.floor((e.x + e.size) / 35) % palette.length];
        }


        ctx.save();

        // Khi bị hạ, quái nhạt màu dần như đang tan biến.
        const fade = e.dying ? Math.max(0, e.deathFade) : 1;
        ctx.globalAlpha = fade;

        // Quái nhiều hình dáng: tròn, vuông bo góc, tam giác, sao, lục giác
        const eg = ctx.createRadialGradient(
            e.x-e.size*.18, e.y-e.size*.25, 2,
            e.x, e.y, e.size*.62
        );
        eg.addColorStop(0, "#ffffff");
        eg.addColorStop(.12, enemyColor);
        eg.addColorStop(1, enemyColor);
        ctx.shadowBlur = 14;
        ctx.shadowColor = enemyColor;
        ctx.fillStyle = eg;
        ctx.strokeStyle = "rgba(255,255,255,.55)";
        ctx.lineWidth = 2;

        ctx.beginPath();
        if(e.shape === 0){
            ctx.arc(e.x, e.y, e.size/2, 0, Math.PI*2);
        }else if(e.shape === 1){
            const r=e.size*.38;
            ctx.roundRect(e.x-r,e.y-r,r*2,r*2,7);
        }else if(e.shape === 2){
            const r=e.size*.52;
            for(let i=0;i<3;i++){
                const a=-Math.PI/2+i*Math.PI*2/3;
                const x=e.x+Math.cos(a)*r, y=e.y+Math.sin(a)*r;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.closePath();
        }else if(e.shape === 3){
            const r=e.size*.5, inner=r*.45;
            for(let i=0;i<10;i++){
                const a=-Math.PI/2+i*Math.PI/5;
                const rr=i%2===0?r:inner;
                const x=e.x+Math.cos(a)*rr, y=e.y+Math.sin(a)*rr;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.closePath();
        }else{
            const r=e.size*.48;
            for(let i=0;i<6;i++){
                const a=Math.PI/6+i*Math.PI/3;
                const x=e.x+Math.cos(a)*r, y=e.y+Math.sin(a)*r;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.closePath();
        }
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Highlight 3D
        ctx.fillStyle = "rgba(255,255,255,.38)";
        ctx.beginPath();
        ctx.ellipse(e.x-e.size*.18,e.y-e.size*.22,e.size*.16,e.size*.09,-.45,0,Math.PI*2);
        ctx.fill();

        // Mắt và miệng
        ctx.fillStyle = "#10131a";
        ctx.beginPath();
        ctx.arc(e.x-e.size*.18,e.y-e.size*.08,Math.max(2.5,e.size*.10),0,Math.PI*2);
        ctx.arc(e.x+e.size*.18,e.y-e.size*.08,Math.max(2.5,e.size*.10),0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = "#10131a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x,e.y+e.size*.08,e.size*.18,0.15,Math.PI-0.15);
        ctx.stroke();

        ctx.restore();


        /*
           🧊 BĂNG + HIỆU ỨNG NỨT/BỂ
        */

        if(e.frozen > 0){
            const crack = e.shatter || 0;

            ctx.save();
            ctx.strokeStyle = "rgba(235,255,255,.95)";
            ctx.shadowBlur = 18;
            ctx.shadowColor = "#74e8ff";
            ctx.lineWidth = 2.5;

            // Các đường nứt lan ra trước khi quái vỡ.
            for(let k=0;k<5;k++){
                const a = k*Math.PI*2/5 + Math.sin(k*7.1)*.18;
                const len = e.size*.25 + crack*e.size*1.15;
                ctx.beginPath();
                ctx.moveTo(e.x,e.y);
                ctx.lineTo(e.x+Math.cos(a)*len,e.y+Math.sin(a)*len);
                ctx.stroke();
            }

            // Mảnh băng sáng quanh quái.
            if(crack > .28){
                for(let k=0;k<6;k++){
                    const a = k*Math.PI/3 + performance.now()/900;
                    const rr = e.size*.55 + crack*e.size*.45;
                    ctx.fillStyle = "rgba(220,250,255,.9)";
                    ctx.beginPath();
                    ctx.moveTo(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr);
                    ctx.lineTo(e.x+Math.cos(a+.16)*rr*.72,e.y+Math.sin(a+.16)*rr*.72);
                    ctx.lineTo(e.x+Math.cos(a-.16)*rr*.72,e.y+Math.sin(a-.16)*rr*.72);
                    ctx.closePath();
                    ctx.fill();
                }
            }
            ctx.restore();


            ctx.strokeStyle =
                "#e8fbff";

            ctx.lineWidth = 4;


            ctx.strokeRect(

                e.x-
                e.size/2-5,

                e.y-
                e.size/2-5,

                e.size+10,

                e.size+10
            );
        }
    }


    /*
       BOM
    */

    for(
        const b of bombs
    ){

        ctx.fillStyle =
            "#242424";


        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#ffb52e";


        ctx.fillRect(

            b.x-2,

            b.y-
            b.radius-
            7,

            4,

            7
        );
    }


    /*
       FRUIT
    */

    for(
        const f of fruits
    ){

        ctx.textAlign =
            "center";

        ctx.font =
            "27px Arial";


        let icon = "🍎";


        if(
            f.type ===
            "rainbow"
        ){

            icon = "🌈";

        }else if(
            f.type ===
            "heal"
        ){
            const ht = performance.now()/260;
            const pulse = 25 + Math.sin(ht)*3;
            const hg = ctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, pulse);
            hg.addColorStop(0, "rgba(255,255,255,.98)");
            hg.addColorStop(.22, "rgba(255,100,145,.95)");
            hg.addColorStop(.55, "rgba(255,30,90,.45)");
            hg.addColorStop(1, "rgba(255,0,70,0)");

            ctx.beginPath();

        }


        if(f.type === "rainbow") {
            const rt = performance.now()/180;
            const rg = ctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, 24);
            rg.addColorStop(0, "rgba(255,255,255,.95)");
            rg.addColorStop(.35, "rgba(255,210,80,.55)");
            rg.addColorStop(1, "rgba(255,80,220,0)");
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.arc(f.x, f.y, 24 + Math.sin(rt)*3, 0, Math.PI*2);

            ctx.shadowBlur = 18;
            ctx.shadowColor = "#ff8cff";

        ctx.fillText(
            icon,
            f.x,
            f.y+9
        );
        ctx.shadowBlur = 0;
    }


    /*
       PARTICLES
    */

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life/.65
            );


        const particleGradient =
            ctx.createRadialGradient(
                p.x,
                p.y,
                0,
                p.x,
                p.y,
                5
            );

        particleGradient.addColorStop(
            0,
            "#ffffff"
        );

        particleGradient.addColorStop(
            .45,
            "#ffd166"
        );

        particleGradient.addColorStop(
            1,
            "rgba(255,120,30,0)"
        );

        ctx.fillStyle =
            particleGradient;

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            4.5,
            0,
            Math.PI*2
        );
        ctx.fill();
    }


    ctx.globalAlpha = 1;


    /*
       HƯỚNG DẪN
    */

    ctx.fillStyle =
        "rgba(255,255,255,.8)";

    ctx.font =
        "15px Arial";

    ctx.textAlign =
        "left";


    ctx.fillText(
        "Né quái càng lâu càng nhiều điểm!",
        15,
        25
    );
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(now){

    if(!running){
        return;
    }


    /*
       CHỐNG DT QUÁ LỚN
    */

    const dt =
        Math.min(
            .033,
            Math.max(
                0,
                (now-lastTime)/1000
            )
        );


    lastTime = now;


    /*
       PLAYER
    */

    updatePlayer(dt);


    /*
       SCORE
    */

    score += dt;

    updateScore();
    updateGameMusicByScore();


    /*
       TIMERS
    */

    enemyTimer -= dt;
    bombTimer -= dt;
    fruitTimer -= dt;
    healTimer -= dt;
    rainbowTimer -= dt;
    shootTimer -= dt;


    /*
       SKILL TIMER
    */

    if(
        currentSkill !==
        "Không"
    ){

        skillTime -= dt;
        soundSkillCooldown -= dt;
        soundMoveCooldown -= dt;


        if(
            skillTime <= 0
        ){

            currentSkill =
                "Không";

            skillTime = 0;
            skillAux = 0;
        }
    }


    /*
       QUÁI
    */

    if(
        enemyTimer <= 0
    ){

        // Càng chơi lâu càng có nhiều quái xuất hiện cùng lúc.
        spawnEnemy();

        if(
            score >= 10 &&
            Math.random() < .60
        ){
            spawnEnemy();
        }

        if(
            score >= 30 &&
            Math.random() < .50
        ){
            spawnEnemy();
        }

        if(
            score >= 70 &&
            Math.random() < .35
        ){
            spawnEnemy();
        }

        enemyTimer =
            Math.max(
                .18,
                .48 -
                Math.min(
                    score/500,
                    .28
                )
            );
    }


    /*
       BOM
    */

    if(
        bombTimer <= 0
    ){

        spawnBomb();


        bombTimer =
            6 +
            Math.random()*5;
    }


    /*
       FRUIT
    */

    if(
        fruitTimer <= 0
    ){

        spawnFruit();


        /* 🍎 Táo vẫn rơi bình thường */
        fruitTimer =
            7 +
            Math.random()*6;
    }


    /*
       ❤️ CỤC HP
       Cứ đúng 20 giây xuất hiện 1 lần.
    */
    if(
        healTimer <= 0
    ){

        if(fruits.length < MAX_FRUITS){

            fruits.push({
                x:25 + Math.random()*(W-50),
                y:-25,
                speed:65,
                type:"heal"
            });

            healTimer = 20;

        }else{

            /* Nếu đang đầy trái, thử lại sau 1 giây */
            healTimer = 1;
        }
    }


    /*
       🌈 TRÁI 7 MÀU
       Cứ đúng 30 giây rơi 1 lần,
       không phụ thuộc tỉ lệ ngẫu nhiên.
    */
    if(
        rainbowTimer <= 0
    ){

        if(fruits.length < MAX_FRUITS){

            fruits.push({
                x:25 + Math.random()*(W-50),
                y:-25,
                speed:65,
                type:"rainbow"
            });

            rainbowTimer = 30;

        }else{

            /* Nếu đang đầy trái, thử lại sau 1 giây */
            rainbowTimer = 1;
        }
    }


    /*
       BẮN
       Đạn thường sẽ dừng khi đang dùng skill.
       Riêng 🔫 Bắn nhanh có hệ thống đạn riêng,
       nên skill vẫn bắn nhanh mà không bị xem là đạn thường.
    */
    if(
        currentSkill === "🔫 Bắn nhanh" &&
        shootTimer <= 0
    ){

        shoot();

        shootTimer = .10;

    }else if(
        currentSkill === "Không" &&
        shootTimer <= 0
    ){

        shoot();

        shootTimer = .42;
    }


    /*
       ÂM THANH SKILL
    */
    if(currentSkill !== "Không" && soundSkillCooldown <= 0){
        if(currentSkill === "🔥 Phun lửa") playSfx("fire");
        else if(currentSkill === "⚡ Tia điện" || currentSkill === "⚡⚡ Sét Lan") playSfx("electric");
        else if(currentSkill === "❄️ Tia băng" || currentSkill === "🧊 Đóng Băng Toàn Màn") playSfx("ice");
        else if(currentSkill === "🔆 Laser") playSfx("laser");
        else if(currentSkill === "🌀 Lốc Xoáy") playSfx("vortex");
        else if(currentSkill === "🛡️ Khiên" || currentSkill === "🌈 Khiên Lửa") playSfx("shield");

        soundSkillCooldown = 0.55;
    }

    /*
       SKILL
    */

    useSkill(dt);


    /*
       UPDATE
    */

    updateEnemies(dt);

    if(!running){
        return;
    }


    updateBombs(dt);

    if(!running){
        return;
    }


    updateFruits(dt);

    updateBullets(dt);

    updateParticles(dt);
    cleanupOffscreen();


    /*
       DỌN RÁC LẦN CUỐI TRƯỚC KHI VẼ
    */
    cleanupOffscreen();

    /*
       DRAW
    */

    draw();

    updateUI();


    /*
       FRAME
    */

    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    if(soundEnabled) unlockAudio();
    playSfx("start");

    cancelAnimationFrame(
        animationId
    );


    running = false;


    resetGame();


    running = true;


    lastTime =
        performance.now();


    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =====================================================
   NÚT CHƠI LẠI
===================================================== */

startButton.addEventListener(
    "click",
    function(){

        unlockAudio();
        startGame();

    }
);


/* =====================================================
   MOBILE BUTTON
===================================================== */

function setupMoveButton(
    id,
    direction
){

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            keys[direction] = true;


            try{

                button.setPointerCapture(
                    e.pointerId
                );

            }catch(error){}
        }
    );


    button.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "lostpointercapture",
        function(){

            keys[direction] = false;
        }
    );
}


setupMoveButton(
    "left",
    "left"
);


setupMoveButton(
    "right",
    "right"
);


/* =====================================================
   PC KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "ArrowLeft"
        ){

            e.preventDefault();

            keys.left = true;
        }


        if(
            e.key === "ArrowRight"
        ){

            e.preventDefault();

            keys.right = true;
        }
    }
);


window.addEventListener(
    "keyup",
    function(e){

        if(
            e.key === "ArrowLeft" ||
            e.key === "a"
        ){

            keys.left = false;
        }


        if(
            e.key === "ArrowRight" ||
            e.key === "d"
        ){

            keys.right = false;
        }
    }
);


/* =====================================================
   CHỐNG SCROLL MOBILE
===================================================== */

document
.querySelectorAll(".move")
.forEach(button => {

    button.addEventListener(
        "touchstart",
        e => e.preventDefault(),
        {passive:false}
    );

    button.addEventListener(
        "touchmove",
        e => e.preventDefault(),
        {passive:false}
    );

    button.addEventListener(
        "touchend",
        e => e.preventDefault(),
        {passive:false}
    );
});


/* =====================================================
   KHỞI TẠO
===================================================== */

resetGame();


/*
   TỰ ĐỘNG BẮT ĐẦU
   => Mở GitHub Pages là chơi ngay
*/

setTimeout(
    () => {

        startGame();

    },
    300
);

</script>
