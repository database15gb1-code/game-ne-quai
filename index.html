<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Né Quái</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#101827;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow:hidden;
}

h1{
    margin:8px 0;
}

#info{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:8px;
}

canvas{
    width:min(95vw,720px);
    height:auto;
    border:3px solid #405070;
    border-radius:12px;
    background:#172238;
    touch-action:none;
}

button{
    border:0;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

#start{
    padding:12px 25px;
    margin:8px;
    background:#54d66a;
    font-size:18px;
}

.move{
    width:80px;
    height:65px;
    margin:5px;
    background:#dbe7f5;
    font-size:30px;
}

#message{
    position:fixed;
    left:50%;
    top:43%;
    transform:translate(-50%,-50%) scale(.5);
    font-size:clamp(30px,7vw,60px);
    font-weight:900;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    z-index:100;
    text-shadow:
        0 4px 0 #000,
        0 0 20px white;
}

#message.show{
    animation:pop 2.3s ease forwards;
}

@keyframes pop{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.5);
    }
    15%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.15);
    }
    30%{
        transform:translate(-50%,-50%) scale(1);
    }
    75%{opacity:1}
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.9);
    }
}
</style>
</head>

<body>

<h1>🎮 Né Quái</h1>

<div id="info">
    <b>⭐ Điểm: <span id="score">0</span></b>
    <b>🏆 Kỷ lục: <span id="best">0</span></b>
    <b>❤️ HP: <span id="hp">3</span></b>
    <b>✨ Skill: <span id="skill">Không</span></b>
</div>

<canvas id="game" width="720" height="420"></canvas>

<br>

<button id="start">▶ Bắt đầu</button>

<div>
    <button class="move" id="left">⬅️</button>
    <button class="move" id="right">➡️</button>
</div>

<div id="message"></div>

<script>
"use strict";

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=720;
const H=420;


/* =========================
   UI
========================= */

const scoreText=document.getElementById("score");
const bestText=document.getElementById("best");
const hpText=document.getElementById("hp");
const skillText=document.getElementById("skill");
const message=document.getElementById("message");

let bestScore=
    Number(localStorage.getItem("neQuaiBest")||0);

bestText.textContent=bestScore;


/* =========================
   GAME
========================= */

let player;

let enemies=[];
let bombs=[];
let fruits=[];
let bullets=[];
let particles=[];

let score=0;
let hp=3;

let running=false;
let lastTime=0;

let enemyTimer=0;
let bombTimer=0;
let fruitTimer=0;

let currentSkill=null;
let skillTime=0;

let keys={
    left:false,
    right:false
};

let reached200=false;
let reached500=false;


/* =========================
   GIỚI HẠN
========================= */

const MAX_ENEMIES=20;
const MAX_BOMBS=3;
const MAX_FRUITS=3;
const MAX_BULLETS=25;
const MAX_PARTICLES=80;


/* =========================
   RESET
========================= */

function resetGame(){

    player={
        x:W/2,
        y:H-45,
        width:42,
        height:25,
        speed:330
    };

    enemies=[];
    bombs=[];
    fruits=[];
    bullets=[];
    particles=[];

    score=0;
    hp=3;

    enemyTimer=.5;
    bombTimer=5;
    fruitTimer=5;

    currentSkill=null;
    skillTime=0;

    reached200=false;
    reached500=false;

    updateUI();
}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    message.classList.remove("show");

    void message.offsetWidth;

    message.textContent=text;

    message.classList.add("show");
}


/* =========================
   SCORE
========================= */

function updateScore(){

    scoreText.textContent=Math.floor(score);

    if(score>bestScore){

        bestScore=Math.floor(score);

        localStorage.setItem(
            "neQuaiBest",
            bestScore
        );

        bestText.textContent=bestScore;
    }

    /*
       ĐÚNG YÊU CẦU:
       200 điểm
    */

    if(score>=200 && !reached200){

        reached200=true;

        showMessage("🐔 ÔI GÀ THẾ!");
    }

    /*
       500 điểm
    */

    if(score>=500 && !reached500){

        reached500=true;

        showMessage(
            "😳 Ơ HAY, THẰNG NÀY GIỎI THẾ!"
        );
    }
}


/* =========================
   PLAYER
========================= */

function updatePlayer(dt){

    if(keys.left){

        player.x-=player.speed*dt;
    }

    if(keys.right){

        player.x+=player.speed*dt;
    }

    player.x=Math.max(
        player.width/2,
        Math.min(
            W-player.width/2,
            player.x
        )
    );
}


/* =========================
   ENEMY
   QUÁI RƠI TỪ TRÊN XUỐNG
========================= */

function spawnEnemy(){

    if(enemies.length>=MAX_ENEMIES)
        return;

    const types=[
        {
            size:28,
            speed:110,
            hp:1
        },
        {
            size:34,
            speed:85,
            hp:2
        },
        {
            size:22,
            speed:155,
            hp:1
        }
    ];

    const type=
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];

    enemies.push({

        x:30+Math.random()*(W-60),

        y:-30,

        size:type.size,

        speed:
            type.speed+
            Math.min(score*.5,100),

        hp:type.hp,

        frozen:0
    });
}


/* =========================
   BOM
   CHỈ GÂY DAMAGE PLAYER
========================= */

function spawnBomb(){

    if(bombs.length>=MAX_BOMBS)
        return;

    bombs.push({

        x:30+Math.random()*(W-60),

        y:-30,

        radius:16,

        speed:180+Math.random()*60
    });
}


/* =========================
   FRUIT
========================= */

function spawnFruit(){

    if(fruits.length>=MAX_FRUITS)
        return;

    /*
       0.1% CẦU VỒNG
    */

    if(Math.random()<0.001){

        fruits.push({

            x:30+Math.random()*(W-60),
            y:-25,
            type:"rainbow",
            speed:70
        });

        return;
    }

    /*
       0.1% HP
    */

    if(Math.random()<0.001){

        fruits.push({

            x:30+Math.random()*(W-60),
            y:-25,
            type:"heal",
            speed:70
        });

        return;
    }

    fruits.push({

        x:30+Math.random()*(W-60),
        y:-25,
        type:"normal",
        speed:70
    });
}


/* =========================
   SKILL
========================= */

const skillList=[

    "🔥 Phun lửa",

    "⚡ Tia điện",

    "❄️ Tia băng",

    "🔫 Bắn nhanh",

    "🛡️ Khiên",

    "🔆 Laser"
];


function giveSkill(){

    currentSkill=
        skillList[
            Math.floor(
                Math.random()*skillList.length
            )
        ];

    skillTime=15;

    showMessage(currentSkill);
}


/* =========================
   COLLISION
========================= */

function playerEnemyCollision(e){

    return (

        Math.abs(
            player.x-e.x
        ) <
        player.width/2+
        e.size/2

    ) && (

        Math.abs(
            player.y-e.y
        ) <
        player.height/2+
        e.size/2

    );
}


/* =========================
   DAMAGE PLAYER
========================= */

function damagePlayer(){

    /*
       KHIÊN
    */

    if(currentSkill==="🛡️ Khiên")
        return;

    hp--;

    hpText.textContent=hp;

    if(hp<=0){

        gameOver();
    }
}


/* =========================
   KILL ENEMY
========================= */

function killEnemy(index){

    const e=enemies[index];

    if(!e)
        return;

    createParticles(
        e.x,
        e.y,
        5
    );

    enemies.splice(index,1);

    score+=2;
}


/* =========================
   BULLET
========================= */

function shoot(){

    if(bullets.length>=MAX_BULLETS)
        return;

    bullets.push({

        x:player.x,

        y:player.y-20,

        speed:450,

        type:"normal"
    });
}


/* =========================
   PARTICLES
========================= */

function createParticles(
    px,
    py,
    count
){

    for(let i=0;i<count;i++){

        if(
            particles.length>=
            MAX_PARTICLES
        )
            break;

        particles.push({

            x:px,

            y:py,

            vx:(Math.random()-.5)*180,

            vy:(Math.random()-.5)*180,

            life:.5
        });
    }
}


/* =========================
   UPDATE ENEMIES
========================= */

function updateEnemies(dt){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e=enemies[i];

        /*
           BĂNG
        */

        if(e.frozen>0){

            e.frozen-=dt;

        }else{

            /*
               QUÁI CHỈ ĐI XUỐNG
            */

            e.y+=e.speed*dt;
        }


        /*
           ĐỤNG PLAYER
        */

        if(
            playerEnemyCollision(e)
        ){

            if(
                currentSkill===
                "🛡️ Khiên"
            ){

                killEnemy(i);

            }else{

                enemies.splice(i,1);

                damagePlayer();

                if(!running)
                    return;
            }

            continue;
        }


        /*
           QUÁI RA KHỎI MÀN HÌNH
        */

        if(e.y>H+50){

            enemies.splice(i,1);
        }
    }
}


/* =========================
   UPDATE BOM
========================= */

function updateBombs(dt){

    for(
        let i=bombs.length-1;
        i>=0;
        i--
    ){

        const b=bombs[i];

        b.y+=b.speed*dt;


        /*
           QUAN TRỌNG:
           BOM KHÔNG KIỂM TRA QUÁI
        */


        const distance=Math.hypot(

            b.x-player.x,

            b.y-player.y
        );


        /*
           CHỈ PLAYER BỊ DAMAGE
        */

        if(
            distance<
            b.radius+20
        ){

            damagePlayer();

            createParticles(
                b.x,
                b.y,
                10
            );

            bombs.splice(i,1);

            if(!running)
                return;

            continue;
        }


        if(b.y>H+50){

            bombs.splice(i,1);
        }
    }
}


/* =========================
   UPDATE FRUITS
========================= */

function updateFruits(dt){

    for(
        let i=fruits.length-1;
        i>=0;
        i--
    ){

        const f=fruits[i];

        f.y+=f.speed*dt;


        if(
            Math.hypot(
                f.x-player.x,
                f.y-player.y
            )<35
        ){

            /*
               CẦU VỒNG
            */

            if(
                f.type==="rainbow"
            ){

                currentSkill="🔆 Laser";
                skillTime=25;

                showMessage(
                    "🌈 SIÊU SKILL!"
                );
            }


            /*
               HP
            */

            else if(
                f.type==="heal"
            ){

                hp=Math.min(
                    3,
                    hp+1
                );

                showMessage(
                    "❤️ +1 HP!"
                );
            }


            /*
               FRUIT THƯỜNG
            */

            else{

                giveSkill();
            }

            fruits.splice(i,1);

            continue;
        }


        if(f.y>H+40){

            fruits.splice(i,1);
        }
    }
}


/* =========================
   UPDATE BULLETS
========================= */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=bullets[i];

        b.y-=b.speed*dt;


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const e=enemies[j];

            if(
                Math.hypot(
                    b.x-e.x,
                    b.y-e.y
                ) <
                e.size/2+5
            ){

                e.hp--;

                createParticles(
                    e.x,
                    e.y,
                    3
                );

                bullets.splice(i,1);


                if(e.hp<=0){

                    killEnemy(j);
                }

                break;
            }
        }


        if(b.y<-20){

            bullets.splice(i,1);
        }
    }
}


/* =========================
   SKILL ATTACKS
========================= */

function useSkill(){

    if(!currentSkill)
        return;


    /*
       PHUN LỬA
    */

    if(
        currentSkill===
        "🔥 Phun lửa"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e=enemies[i];

            if(

                e.y<player.y &&

                Math.abs(
                    e.x-player.x
                )<120 &&

                player.y-e.y<230

            ){

                killEnemy(i);
            }
        }
    }


    /*
       TIA ĐIỆN
    */

    if(
        currentSkill===
        "⚡ Tia điện"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e=enemies[i];

            if(
                e.y<player.y &&
                Math.abs(
                    e.x-player.x
                )<100
            ){

                killEnemy(i);
            }
        }
    }


    /*
       TIA BĂNG

       ĐÓNG BĂNG
       NHƯNG VẪN GIẾT ĐƯỢC
    */

    if(
        currentSkill===
        "❄️ Tia băng"
    ){

        for(
            const e of enemies
        ){

            if(
                e.y<player.y &&
                Math.abs(
                    e.x-player.x
                )<100
            ){

                e.frozen=2;

                /*
                   Sau khi đóng băng
                   vẫn bị tiêu diệt
                */

                setTimeout(()=>{

                    const index=
                        enemies.indexOf(e);

                    if(index!==-1){

                        killEnemy(index);
                    }

                },500);
            }
        }
    }


    /*
       LASER
    */

    if(
        currentSkill===
        "🔆 Laser"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e=enemies[i];

            if(
                e.y<player.y &&
                Math.abs(
                    e.x-player.x
                )<25
            ){

                killEnemy(i);
            }
        }
    }
}


/* =========================
   UPDATE PARTICLES
========================= */

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const q=particles[i];

        q.x+=q.vx*dt;
        q.y+=q.vy*dt;

        q.life-=dt;

        if(q.life<=0){

            particles.splice(i,1);
        }
    }
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       BACKGROUND
    */

    ctx.fillStyle="#172238";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       GRID
    */

    ctx.strokeStyle="#22324c";

    for(
        let y=0;
        y<H;
        y+=40
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(W,y);

        ctx.stroke();
    }


    /*
       PLAYER
    */

    ctx.fillStyle="#54d66a";

    ctx.fillRect(

        player.x-
        player.width/2,

        player.y-
        player.height/2,

        player.width,

        player.height
    );


    /*
       QUÁI
    */

    enemies.forEach(e=>{

        ctx.fillStyle=
            e.frozen>0
            ?"#6ee7ff"
            :"#55c85a";

        ctx.beginPath();

        ctx.arc(
            e.x,
            e.y,
            e.size/2,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
           mắt
        */

        ctx.fillStyle="#111";

        ctx.fillRect(
            e.x-8,
            e.y-5,
            5,
            5
        );

        ctx.fillRect(
            e.x+3,
            e.y-5,
            5,
            5
        );


        /*
           BĂNG
        */

        if(e.frozen>0){

            ctx.strokeStyle="#d9faff";

            ctx.lineWidth=4;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.size/2+6,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }
    });


    /*
       BOM
    */

    bombs.forEach(b=>{

        ctx.fillStyle="#222";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#ffbd32";

        ctx.fillRect(
            b.x-2,
            b.y-b.radius-7,
            4,
            7
        );
    });


    /*
       FRUIT
    */

    fruits.forEach(f=>{

        ctx.font=
            f.type==="rainbow"
            ?"28px Arial"
            :"25px Arial";

        ctx.textAlign="center";

        ctx.fillText(

            f.type==="rainbow"
            ?"🌈"
            :
            f.type==="heal"
            ?"❤️"
            :"🍎",

            f.x,
            f.y+8
        );
    });


    /*
       BULLETS
    */

    bullets.forEach(b=>{

        ctx.fillStyle="#ffe45c";

        ctx.fillRect(
            b.x-3,
            b.y-8,
            6,
            12
        );
    });


    /*
       SKILL EFFECT
    */

    if(
        currentSkill===
        "🔥 Phun lửa"
    ){

        ctx.fillStyle="#ff762f88";

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y-110,
            100,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    if(
        currentSkill===
        "⚡ Tia điện"
    ){

        ctx.strokeStyle="#c084fc";

        ctx.lineWidth=6;

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            0
        );

        ctx.lineTo(
            player.x,
            player.y
        );

        ctx.stroke();
    }


    if(
        currentSkill===
        "❄️ Tia băng"
    ){

        ctx.strokeStyle="#75e8ff";

        ctx.lineWidth=7;

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            0
        );

        ctx.lineTo(
            player.x,
            player.y
        );

        ctx.stroke();
    }


    if(
        currentSkill===
        "🔆 Laser"
    ){

        ctx.strokeStyle="#ff8cff";

        ctx.lineWidth=15;

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            0
        );

        ctx.lineTo(
            player.x,
            player.y
        );

        ctx.stroke();

        ctx.strokeStyle="#fff";

        ctx.lineWidth=4;

        ctx.stroke();
    }


    /*
       KHIÊN
    */

    if(
        currentSkill===
        "🛡️ Khiên"
    ){

        ctx.strokeStyle="#6de8ff";

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            35,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    /*
       PARTICLES
    */

    particles.forEach(q=>{

        ctx.globalAlpha=
            Math.max(
                0,
                q.life/.5
            );

        ctx.fillStyle="#ffd166";

        ctx.fillRect(
            q.x,
            q.y,
            4,
            4
        );
    });

    ctx.globalAlpha=1;
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;

    updateScore();

    showMessage(
        score>=500
        ?
        "😳 Ơ HAY, THẰNG NÀY GIỎI THẾ!"
        :
        "💀 HẾT MÁU!"
    );


    /*
       TỰ ĐỘNG CHƠI LẠI
    */

    setTimeout(()=>{

        startGame();

    },1800);
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time){

    if(!running)
        return;

    /*
       Giới hạn dt
       chống game bị đứng
    */

    let dt=
        Math.min(
            (time-lastTime)/1000,
            .033
        );

    lastTime=time;


    updatePlayer(dt);


    /*
       SPAWN QUÁI
    */

    enemyTimer-=dt;

    if(enemyTimer<=0){

        spawnEnemy();

        enemyTimer=
            Math.max(
                .25,
                .8-score/1000
            );
    }


    /*
       BOM
    */

    bombTimer-=dt;

    if(bombTimer<=0){

        spawnBomb();

        bombTimer=
            5+
            Math.random()*4;
    }


    /*
       FRUIT
    */

    fruitTimer-=dt;

    if(fruitTimer<=0){

        spawnFruit();

        fruitTimer=
            5+
            Math.random()*5;
    }


    /*
       SCORE
    */

    score+=dt*2;

    updateScore();


    /*
       SKILL
    */

    if(skillTime>0){

        skillTime-=dt;

        skillText.textContent=
            currentSkill+
            " "+
            Math.ceil(skillTime)+"s";

        /*
           Skill tự kích hoạt liên tục
        */

        useSkill();


        /*
           Bắn nhanh
        */

        if(
            currentSkill===
            "🔫 Bắn nhanh"
        ){

            if(
                Math.random()<dt*8
            ){

                shoot();
            }
        }

    }else{

        currentSkill=null;

        skillText.textContent="Không";
    }


    /*
       UPDATE
    */

    updateEnemies(dt);

    if(!running)
        return;

    updateBombs(dt);

    if(!running)
        return;

    updateFruits(dt);

    updateBullets(dt);

    updateParticles(dt);


    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   START
========================= */

function startGame(){

    resetGame();

    running=true;

    lastTime=
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}


document
.getElementById("start")
.addEventListener(
    "click",
    startGame
);


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key.toLowerCase()==="a"
        ){

            keys.left=true;
        }

        if(
            e.key==="ArrowRight" ||
            e.key.toLowerCase()==="d"
        ){

            keys.right=true;
        }
    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key.toLowerCase()==="a"
        ){

            keys.left=false;
        }

        if(
            e.key==="ArrowRight" ||
            e.key.toLowerCase()==="d"
        ){

            keys.right=false;
        }
    }
);


/* =========================
   MOBILE BUTTON
========================= */

function holdButton(
    id,
    direction
){

    const btn=
        document.getElementById(id);


    btn.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            keys[direction]=true;
        }
    );


    btn.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            keys[direction]=false;
        }
    );


    btn.addEventListener(
        "pointerleave",
        ()=>{

            keys[direction]=false;
        }
    );


    btn.addEventListener(
        "pointercancel",
        ()=>{

            keys[direction]=false;
        }
    );
}


holdButton(
    "left",
    "left"
);

holdButton(
    "right",
    "right"
);


/* =========================
   INIT
========================= */

resetGame();

draw();

</script>
