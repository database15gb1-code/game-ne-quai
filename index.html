<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Né Quái</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#101827;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow-x:hidden;
    touch-action:manipulation;
}

.wrap{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:8px;
}

h1{
    margin:5px 0 8px;
    font-size:28px;
}

.top{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:8px;
    font-size:15px;
}

.info{
    background:#1d2a42;
    border-radius:8px;
    padding:6px 10px;
}

canvas{
    display:block;
    width:100%;
    max-width:720px;
    height:auto;
    margin:auto;

    border:3px solid #394968;
    border-radius:12px;

    background:#18243a;

    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

button{
    border:0;
    border-radius:14px;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

#start{
    background:#62d86d;
    color:#07110a;
    font-size:18px;
    font-weight:bold;
    padding:12px 28px;
    margin:8px 0;
}

#start:active{
    transform:scale(.96);
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    margin-top:3px;
}

.move{
    width:100px;
    height:72px;
    background:#e1e9f5;
    color:#172238;
    font-size:38px;
    font-weight:bold;
    box-shadow:0 4px 0 #9eacbf;
}

.move:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #9eacbf;
}

.small{
    margin:7px 0;
    opacity:.7;
    font-size:13px;
}

#message{
    position:fixed;

    left:50%;
    top:43%;

    transform:
        translate(-50%,-50%)
        scale(.45);

    width:95%;

    font-size:clamp(27px,7vw,60px);

    font-weight:900;

    text-align:center;

    white-space:normal;

    opacity:0;

    pointer-events:none;

    z-index:999;

    text-shadow:
        0 4px 0 #000,
        0 0 15px #fff,
        0 0 30px #fff;
}

#message.show{
    animation:messagePop 2.5s ease forwards;
}

@keyframes messagePop{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.45);
    }

    12%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.12);
    }

    25%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.92);
    }
}

@media(max-width:500px){

    h1{
        font-size:23px;
    }

    .top{
        font-size:13px;
        gap:5px;
    }

    .info{
        padding:5px 7px;
    }

    .move{
        width:105px;
        height:75px;
        font-size:40px;
    }
}
</style>
</head>


<body>

<div class="wrap">

<h1>🎮 Né Quái</h1>

<div class="top">

    <div class="info">
        ⭐ Điểm:
        <span id="score">0</span>
    </div>

    <div class="info">
        🏆 Kỷ lục:
        <span id="best">0</span>
    </div>

    <div class="info">
        ❤️ HP:
        <span id="hp">3</span>
    </div>

    <div class="info">
        ✨ Skill:
        <span id="skill">Không</span>
    </div>

</div>


<canvas
    id="game"
    width="720"
    height="420">
</canvas>


<button id="start">
    ▶ Bắt đầu
</button>


<div class="controls">

    <button
        class="move"
        id="left">
        ⬅️
    </button>

    <button
        class="move"
        id="right">
        ➡️
    </button>

</div>


<p class="small">
    📱 Điện thoại: giữ ⬅️ ➡️ để di chuyển<br>
    🖥️ PC: dùng ← → hoặc A / D
</p>

</div>


<div id="message"></div>


<script>

"use strict";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


const W = 720;
const H = 420;


/* =========================================================
   UI
========================================================= */

const scoreEl =
    document.getElementById("score");

const bestEl =
    document.getElementById("best");

const hpEl =
    document.getElementById("hp");

const skillEl =
    document.getElementById("skill");

const messageEl =
    document.getElementById("message");


/* =========================================================
   KỶ LỤC
========================================================= */

let bestScore =
    Number(
        localStorage.getItem("neQuaiBest") || 0
    );

bestEl.textContent =
    bestScore;


/* =========================================================
   GAME VARIABLES
========================================================= */

let player;

let enemies = [];
let bombs = [];
let fruits = [];
let bullets = [];
let particles = [];


/* =========================================================
   GAME STATE
========================================================= */

let score = 0;
let hp = 3;

let running = false;

let lastTime = 0;

let animationId = 0;


/* =========================================================
   SPAWN TIMER
========================================================= */

let enemyTimer = 0.5;
let bombTimer = 5;
let fruitTimer = 6;
let shootTimer = 0;


/* =========================================================
   SKILL
========================================================= */

let currentSkill = "Không";

let skillTime = 0;


/* =========================================================
   MỐC ĐIỂM
========================================================= */

let reached200 = false;
let reached500 = false;


/* =========================================================
   ĐIỀU KHIỂN
========================================================= */

const keys = {

    left:false,

    right:false
};


/* =========================================================
   GIỚI HẠN ĐỂ CHỐNG LAG
========================================================= */

const MAX_ENEMIES = 18;

const MAX_BOMBS = 3;

const MAX_FRUITS = 3;

const MAX_BULLETS = 24;

const MAX_PARTICLES = 75;


/* =========================================================
   RESET
========================================================= */

function resetGame(){

    player = {

        x:W / 2,

        y:H - 45,

        width:42,

        height:25,

        speed:330

    };


    enemies.length = 0;

    bombs.length = 0;

    fruits.length = 0;

    bullets.length = 0;

    particles.length = 0;


    score = 0;

    hp = 3;


    enemyTimer = .5;

    bombTimer = 5;

    fruitTimer = 6;

    shootTimer = .3;


    currentSkill = "Không";

    skillTime = 0;


    reached200 = false;

    reached500 = false;


    updateUI();

    draw();
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    scoreEl.textContent =
        Math.floor(score);

    hpEl.textContent =
        hp;

    if(currentSkill === "Không"){

        skillEl.textContent =
            "Không";

    }else{

        skillEl.textContent =
            currentSkill +
            " " +
            Math.ceil(skillTime) +
            "s";
    }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    messageEl.classList.remove("show");

    void messageEl.offsetWidth;

    messageEl.textContent =
        text;

    messageEl.classList.add("show");
}


/* =========================================================
   SCORE
========================================================= */

function updateScore(){

    const current =
        Math.floor(score);


    scoreEl.textContent =
        current;


    /* LƯU KỶ LỤC */

    if(current > bestScore){

        bestScore = current;

        localStorage.setItem(
            "neQuaiBest",
            bestScore
        );

        bestEl.textContent =
            bestScore;
    }


    /* 200 ĐIỂM */

    if(
        current >= 200 &&
        !reached200
    ){

        reached200 = true;

        showMessage(
            "🐔 ÔI GÀ THẾ!"
        );
    }


    /* 500 ĐIỂM */

    if(
        current >= 500 &&
        !reached500
    ){

        reached500 = true;

        showMessage(
            "😳 Ơ HAY, THẰNG NÀY GIỎI THẾ!"
        );
    }

}


/* =========================================================
   PARTICLE
========================================================= */

function createParticles(
    px,
    py,
    amount = 8
){

    const available =
        MAX_PARTICLES -
        particles.length;

    const count =
        Math.min(
            amount,
            available
        );


    for(let i=0;i<count;i++){

        particles.push({

            x:px,

            y:py,

            vx:
                (Math.random()-.5) *
                180,

            vy:
                (Math.random()-.5) *
                180,

            life:
                .3 +
                Math.random()*.35
        });
    }
}


/* =========================================================
   COLLISION PLAYER - ENEMY
========================================================= */

function enemyHitsPlayer(e){

    return (

        Math.abs(
            player.x - e.x
        ) <

        (
            player.width / 2 +
            e.size / 2
        )

    ) && (

        Math.abs(
            player.y - e.y
        ) <

        (
            player.height / 2 +
            e.size / 2
        )
    );
}


/* =========================================================
   SPAWN ENEMY
   QUÁI RƠI TỪ TRÊN XUỐNG
========================================================= */

function spawnEnemy(){

    if(
        enemies.length >=
        MAX_ENEMIES
    ){

        return;
    }


    const types = [

        {
            size:26,
            speed:110,
            hp:1
        },

        {
            size:34,
            speed:85,
            hp:2
        },

        {
            size:22,
            speed:155,
            hp:1
        }

    ];


    const type =
        types[
            Math.floor(
                Math.random() *
                types.length
            )
        ];


    enemies.push({

        x:
            25 +
            Math.random() *
            (W - 50),

        y:-35,

        size:type.size,

        speed:
            type.speed +
            Math.min(
                score * .35,
                100
            ),

        hp:type.hp,

        frozen:0,

        freezeKillTimer:0
    });
}


/* =========================================================
   SPAWN BOMB
========================================================= */

function spawnBomb(){

    if(
        bombs.length >=
        MAX_BOMBS
    ){

        return;
    }


    bombs.push({

        x:
            25 +
            Math.random() *
            (W - 50),

        y:-30,

        radius:15,

        speed:
            180 +
            Math.random()*70
    });
}


/* =========================================================
   SPAWN FRUIT
========================================================= */

function spawnFruit(){

    if(
        fruits.length >=
        MAX_FRUITS
    ){

        return;
    }


    /*
       🌈 CẦU VỒNG
       0.1%
    */

    if(
        Math.random() < .001
    ){

        fruits.push({

            x:
                25 +
                Math.random() *
                (W - 50),

            y:-25,

            speed:65,

            type:"rainbow"
        });

        return;
    }


    /*
       ❤️ HỒI HP
       0.1%
    */

    if(
        Math.random() < .001
    ){

        fruits.push({

            x:
                25 +
                Math.random() *
                (W - 50),

            y:-25,

            speed:65,

            type:"heal"
        });

        return;
    }


    /*
       🍎 FRUIT SKILL THƯỜNG
    */

    fruits.push({

        x:
            25 +
            Math.random() *
            (W - 50),

        y:-25,

        speed:65,

        type:"normal"
    });
}


/* =========================================================
   SKILL
========================================================= */

const skillList = [

    "🔥 Phun lửa",

    "⚡ Tia điện",

    "❄️ Tia băng",

    "🔫 Bắn nhanh",

    "🛡️ Khiên",

    "🔆 Laser"
];


function giveRandomSkill(){

    currentSkill =
        skillList[
            Math.floor(
                Math.random() *
                skillList.length
            )
        ];


    skillTime = 15;


    showMessage(
        currentSkill
    );


    updateUI();
}


/* =========================================================
   KILL ENEMY
========================================================= */

function killEnemy(index){

    if(
        index < 0 ||
        index >= enemies.length
    ){

        return;
    }


    const e =
        enemies[index];


    createParticles(
        e.x,
        e.y,
        7
    );


    enemies.splice(
        index,
        1
    );


    score += 3;
}


/* =========================================================
   DAMAGE PLAYER
========================================================= */

function damagePlayer(){

    /*
       KHIÊN CHẶN DAMAGE
    */

    if(
        currentSkill ===
        "🛡️ Khiên"
    ){

        return;
    }


    hp--;

    hpEl.textContent =
        hp;


    if(hp <= 0){

        gameOver();
    }
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    if(!running)
        return;


    running = false;


    updateScore();


    /*
       CHỜ 1.5 GIÂY
       RỒI TỰ CHƠI LẠI
    */

    showMessage(
        score >= 500
        ?
        "😳 Ơ HAY, THẰNG NÀY GIỎI THẾ!"
        :
        "💀 HẾT MÁU!"
    );


    setTimeout(

        () => {

            startGame();

        },

        1600
    );
}


/* =========================================================
   PLAYER
   CHỈ TRÁI / PHẢI
========================================================= */

function updatePlayer(dt){

    /*
       ⬅️
    */

    if(keys.left){

        player.x -=
            player.speed * dt;
    }


    /*
       ➡️
    */

    if(keys.right){

        player.x +=
            player.speed * dt;
    }


    /*
       GIỚI HẠN MÀN HÌNH
    */

    player.x =
        Math.max(
            player.width/2,

            Math.min(
                W -
                player.width/2,

                player.x
            )
        );
}


/* =========================================================
   UPDATE ENEMY
========================================================= */

function updateEnemies(dt){

    for(
        let i =
            enemies.length - 1;

        i >= 0;

        i--
    ){

        const e =
            enemies[i];


        /*
           BĂNG
        */

        if(e.frozen > 0){

            e.frozen -= dt;

        }else{

            /*
               QUÁI CHỈ RƠI XUỐNG
               KHÔNG ĐUỔI PLAYER
            */

            e.y +=
                e.speed * dt;
        }


        /*
           VA CHẠM PLAYER
        */

        if(
            enemyHitsPlayer(e)
        ){

            if(
                currentSkill ===
                "🛡️ Khiên"
            ){

                killEnemy(i);

                continue;
            }


            enemies.splice(i,1);

            damagePlayer();

            if(!running)
                return;

            continue;
        }


        /*
           QUÁI RA NGOÀI
        */

        if(
            e.y >
            H + 50
        ){

            enemies.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   BOM
   CHỈ DAMAGE PLAYER
========================================================= */

function updateBombs(dt){

    for(
        let i =
            bombs.length - 1;

        i >= 0;

        i--
    ){

        const b =
            bombs[i];


        b.y +=
            b.speed * dt;


        /*
           QUAN TRỌNG:

           KHÔNG CÓ CODE
           KIỂM TRA BOM - QUÁI

           => BOM KHÔNG ẢNH HƯỞNG QUÁI
        */


        const distance =
            Math.hypot(

                b.x -
                player.x,

                b.y -
                player.y
            );


        /*
           CHỈ PLAYER
        */

        if(
            distance <
            b.radius + 20
        ){

            createParticles(
                b.x,
                b.y,
                12
            );


            damagePlayer();


            bombs.splice(
                i,
                1
            );


            if(!running)
                return;


            continue;
        }


        /*
           BOM RA KHỎI MÀN
        */

        if(
            b.y >
            H + 50
        ){

            bombs.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   FRUITS
========================================================= */

function updateFruits(dt){

    for(
        let i =
            fruits.length - 1;

        i >= 0;

        i--
    ){

        const f =
            fruits[i];


        f.y +=
            f.speed * dt;


        /*
           ĂN TRÁI CÂY
        */

        if(

            Math.hypot(

                f.x -
                player.x,

                f.y -
                player.y

            ) < 35

        ){

            /*
               🌈 CẦU VỒNG
            */

            if(
                f.type ===
                "rainbow"
            ){

                currentSkill =
                    "🌈 7 Sắc";

                skillTime =
                    25;

                showMessage(
                    "🌈 7 SẮC CẦU VỒNG!"
                );
            }


            /*
               ❤️ HP
            */

            else if(
                f.type ===
                "heal"
            ){

                hp =
                    Math.min(
                        3,
                        hp + 1
                    );

                hpTextUpdate();

                showMessage(
                    "❤️ +1 HP!"
                );
            }


            /*
               🍎 SKILL
            */

            else{

                giveRandomSkill();
            }


            fruits.splice(
                i,
                1
            );

            continue;
        }


        /*
           RA NGOÀI
        */

        if(
            f.y >
            H + 40
        ){

            fruits.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   HP UI
========================================================= */

function hpTextUpdate(){

    hpEl.textContent =
        hp;
}


/* =========================================================
   SHOOT
========================================================= */

function shoot(){

    if(
        bullets.length >=
        MAX_BULLETS
    ){

        return;
    }


    bullets.push({

        x:
            player.x,

        y:
            player.y - 22,

        speed:440,

        radius:5
    });
}


/* =========================================================
   BULLETS
========================================================= */

function updateBullets(dt){

    for(
        let i =
            bullets.length - 1;

        i >= 0;

        i--
    ){

        const b =
            bullets[i];


        b.y -=
            b.speed * dt;


        /*
           RA NGOÀI
        */

        if(
            b.y <
            -30
        ){

            bullets.splice(
                i,
                1
            );

            continue;
        }


        /*
           ĐỤNG QUÁI
        */

        let hitEnemy =
            false;


        for(
            let j =
                enemies.length - 1;

            j >= 0;

            j--
        ){

            const e =
                enemies[j];


            if(

                Math.hypot(

                    b.x -
                    e.x,

                    b.y -
                    e.y

                ) <

                b.radius +
                e.size/2

            ){

                e.hp--;

                createParticles(
                    e.x,
                    e.y,
                    3
                );


                bullets.splice(
                    i,
                    1
                );


                if(
                    e.hp <= 0
                ){

                    killEnemy(j);
                }


                hitEnemy = true;

                break;
            }
        }


        if(hitEnemy)
            continue;
    }
}


/* =========================================================
   SKILL ATTACK
========================================================= */

function useSkill(dt){

    if(
        currentSkill ===
        "Không"
    ){

        return;
    }


    /*
       🔥 PHUN LỬA
    */

    if(
        currentSkill ===
        "🔥 Phun lửa"
    ){

        for(
            let i =
                enemies.length - 1;

            i >= 0;

            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x -
                    player.x
                ) < 120 &&

                player.y -
                e.y < 230

            ){

                killEnemy(i);
            }
        }
    }


    /*
       ⚡ TIA ĐIỆN
    */

    if(
        currentSkill ===
        "⚡ Tia điện"
    ){

        for(
            let i =
                enemies.length - 1;

            i >= 0;

            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x -
                    player.x
                ) < 95

            ){

                killEnemy(i);
            }
        }
    }


    /*
       ❄️ TIA BĂNG

       Bước 1:
       Đóng băng

       Bước 2:
       Sau đó giết
    */

    if(
        currentSkill ===
        "❄️ Tia băng"
    ){

        for(
            const e of enemies
        ){

            if(

                e.y < player.y &&

                Math.abs(
                    e.x -
                    player.x
                ) < 90 &&

                e.frozen <= 0 &&

                e.freezeKillTimer <= 0

            ){

                e.frozen = 1.2;

                e.freezeKillTimer =
                    .55;
            }
        }


        /*
           giảm timer giết
        */

        for(
            let i =
                enemies.length - 1;

            i >= 0;

            i--
        ){

            const e =
                enemies[i];


            if(
                e.freezeKillTimer > 0
            ){

                e.freezeKillTimer -=
                    dt;


                if(
                    e.freezeKillTimer <= 0
                ){

                    killEnemy(i);
                }
            }
        }
    }


    /*
       🔆 LASER
    */

    if(

        currentSkill ===
        "🔆 Laser" ||

        currentSkill ===
        "🌈 7 Sắc"

    ){

        for(
            let i =
                enemies.length - 1;

            i >= 0;

            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x -
                    player.x
                ) < 22

            ){

                killEnemy(i);
            }
        }
    }


    /*
       🔫 BẮN NHANH
    */

    if(
        currentSkill ===
        "🔫 Bắn nhanh"
    ){

        /*
           Bắn được xử lý
           trong game loop
        */
    }
}


/* =========================================================
   PARTICLES
========================================================= */

function updateParticles(dt){

    for(
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        p.life -=
            dt;


        /*
           TỰ XÓA
        */

        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       BACKGROUND
    */

    ctx.fillStyle =
        "#18243a";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       GRID
    */

    ctx.fillStyle =
        "#22324d";

    for(
        let i=0;

        i<14;

        i++
    ){

        ctx.fillRect(
            i*60,
            0,
            1,
            H
        );
    }


    /*
       ĐẤT
    */

    ctx.fillStyle =
        "#4d7c59";

    ctx.fillRect(
        0,
        395,
        W,
        25
    );


    /*
       PLAYER
    */

    ctx.fillStyle =
        "#77b255";

    ctx.fillRect(

        player.x -
        player.width/2,

        player.y -
        player.height/2,

        player.width,

        player.height
    );


    /*
       MẮT
    */

    ctx.fillStyle =
        "#fff";

    ctx.fillRect(
        player.x - 12,
        player.y - 5,
        7,
        7
    );

    ctx.fillRect(
        player.x + 5,
        player.y - 5,
        7,
        7
    );


    /*
       KHIÊN
    */

    if(
        currentSkill ===
        "🛡️ Khiên"
    ){

        ctx.strokeStyle =
            "#72edff";

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            35,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    /*
       PHUN LỬA
    */

    if(
        currentSkill ===
        "🔥 Phun lửa"
    ){

        ctx.fillStyle =
            "rgba(255,100,20,.28)";

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y - 105,
            100,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /*
       TIA ĐIỆN
    */

    if(
        currentSkill ===
        "⚡ Tia điện"
    ){

        ctx.strokeStyle =
            "#c084fc";

        ctx.lineWidth = 7;

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            0
        );

        ctx.lineTo(
            player.x,
            player.y
        );

        ctx.stroke();
    }


    /*
       TIA BĂNG
    */

    if(
        currentSkill ===
        "❄️ Tia băng"
    ){

        ctx.strokeStyle =
            "#6de8ff";

        ctx.lineWidth = 8;

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            0
        );

        ctx.lineTo(
            player.x,
            player.y
        );

        ctx.stroke();

        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth = 3;

        ctx.stroke();
    }


    /*
       LASER
    */

    if(

        currentSkill ===
        "🔆 Laser" ||

        currentSkill ===
        "🌈 7 Sắc"

    ){

        ctx.strokeStyle =
            "#ff6cff";

        ctx.lineWidth = 15;

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            0
        );

        ctx.lineTo(
            player.x,
            player.y
        );

        ctx.stroke();


        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth = 4;

        ctx.stroke();
    }


    /*
       BULLETS
    */

    for(
        const b of bullets
    ){

        ctx.fillStyle =
            "#ffe66b";

        ctx.fillRect(

            b.x - 3,

            b.y - 8,

            6,

            12
        );
    }


    /*
       ENEMIES
    */

    for(
        const e of enemies
    ){

        /*
           Bỏ màu đỏ như yêu cầu trước:
           dùng màu xanh/tím/cam
        */

        let enemyColor =
            "#55c85a";


        if(e.frozen > 0){

            enemyColor =
                "#66ddff";

        }else if(e.hp >= 2){

            enemyColor =
                "#9b6cff";

        }else{

            enemyColor =
                "#55c85a";
        }


        ctx.fillStyle =
            enemyColor;


        ctx.fillRect(

            e.x -
            e.size/2,

            e.y -
            e.size/2,

            e.size,

            e.size
        );


        /*
           MẮT
        */

        ctx.fillStyle =
            "#111";

        ctx.fillRect(
            e.x - 9,
            e.y - 7,
            6,
            6
        );

        ctx.fillRect(
            e.x + 3,
            e.y - 7,
            6,
            6
        );


        /*
           ĐÓNG BĂNG
        */

        if(
            e.frozen > 0
        ){

            ctx.strokeStyle =
                "#d9faff";

            ctx.lineWidth = 4;

            ctx.strokeRect(

                e.x -
                e.size/2 -
                5,

                e.y -
                e.size/2 -
                5,

                e.size + 10,

                e.size + 10
            );
        }
    }


    /*
       BOM
    */

    for(
        const b of bombs
    ){

        ctx.fillStyle =
            "#242424";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#ffb52e";

        ctx.fillRect(

            b.x - 2,

            b.y -
            b.radius -
            7,

            4,

            7
        );
    }


    /*
       FRUITS
    */

    for(
        const f of fruits
    ){

        ctx.textAlign =
            "center";


        ctx.font =
            "27px Arial";


        let icon =
            "🍎";


        if(
            f.type ===
            "rainbow"
        ){

            icon =
                "🌈";

        }else if(
            f.type ===
            "heal"
        ){

            icon =
                "❤️";
        }


        ctx.fillText(

            icon,

            f.x,

            f.y + 9
        );
    }


    /*
       PARTICLES
    */

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life / .65
            );

        ctx.fillStyle =
            "#ffd166";

        ctx.fillRect(

            p.x,

            p.y,

            4,

            4
        );
    }


    ctx.globalAlpha = 1;


    /*
       TEXT
    */

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "15px Arial";

    ctx.textAlign =
        "left";

    ctx.fillText(

        "Né quái càng lâu càng nhiều điểm!",

        15,

        25
    );
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now){

    if(!running)
        return;


    /*
       Giới hạn dt
       để tránh lỗi khi tab bị treo
    */

    const dt =
        Math.min(
            .033,
            (now - lastTime) /
            1000
        );


    lastTime =
        now;


    /*
       PLAYER
    */

    updatePlayer(dt);


    /*
       SCORE
    */

    score +=
        dt;


    updateScore();


    /*
       TIMER
    */

    enemyTimer -=
        dt;

    bombTimer -=
        dt;

    fruitTimer -=
        dt;

    shootTimer -=
        dt;


    /*
       SKILL TIMER
    */

    if(
        currentSkill !==
        "Không"
    ){

        skillTime -=
            dt;


        if(
            skillTime <= 0
        ){

            currentSkill =
                "Không";

            skillTime =
                0;
        }
    }


    /*
       SPAWN QUÁI
    */

    if(
        enemyTimer <= 0
    ){

        spawnEnemy();


        enemyTimer =
            Math.max(

                .28,

                .72 -
                Math.min(
                    score / 500,
                    .35
                )
            );
    }


    /*
       SPAWN BOM
    */

    if(
        bombTimer <= 0
    ){

        spawnBomb();


        bombTimer =
            6 +
            Math.random()*5;
    }


    /*
       SPAWN FRUIT
    */

    if(
        fruitTimer <= 0
    ){

        spawnFruit();


        fruitTimer =
            7 +
            Math.random()*6;
    }


    /*
       BẮN THƯỜNG
    */

    let fireRate =
        .42;


    if(
        currentSkill ===
        "🔫 Bắn nhanh"
    ){

        fireRate =
            .10;
    }


    if(
        shootTimer <= 0
    ){

        shoot();


        shootTimer =
            fireRate;
    }


    /*
       SKILL
    */

    useSkill(dt);


    /*
       OBJECT UPDATE
    */

    updateEnemies(dt);

    if(!running)
        return;


    updateBombs(dt);

    if(!running)
        return;


    updateFruits(dt);

    updateBullets(dt);

    updateParticles(dt);


    /*
       UI
    */

    updateUI();


    /*
       DRAW
    */

    draw();


    /*
       FRAME
    */

    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    cancelAnimationFrame(
        animationId
    );


    resetGame();


    running = true;


    lastTime =
        performance.now();


    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


document
    .getElementById("start")
    .addEventListener(
        "click",
        startGame
    );


/* =========================================================
   MOBILE CONTROL
   CHỈ TRÁI / PHẢI
========================================================= */

function setupMoveButton(
    id,
    direction
){

    const button =
        document.getElementById(id);


    /*
       BẮT ĐẦU GIỮ
    */

    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            keys[direction] = true;

            try{

                button.setPointerCapture(
                    e.pointerId
                );

            }catch(err){}

        }
    );


    /*
       THẢ
    */

    button.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "lostpointercapture",
        function(){

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "pointerleave",
        function(){

            /*
               Không bắt buộc thả khi rời
               nếu pointer đang được capture.
            */
        }
    );
}


setupMoveButton(
    "left",
    "left"
);

setupMoveButton(
    "right",
    "right"
);


/* =========================================================
   PC KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.key ===
            "ArrowLeft" ||

            e.key.toLowerCase() ===
            "a"
        ){

            e.preventDefault();

            keys.left = true;
        }


        if(
            e.key ===
            "ArrowRight" ||

            e.key.toLowerCase() ===
            "d"
        ){

            e.preventDefault();

            keys.right = true;
        }
    }
);


window.addEventListener(
    "keyup",
    function(e){

        if(
            e.key ===
            "ArrowLeft" ||

            e.key.toLowerCase() ===
            "a"
        ){

            keys.left = false;
        }


        if(
            e.key ===
            "ArrowRight" ||

            e.key.toLowerCase() ===
            "d"
        ){

            keys.right = false;
        }
    }
);


/* =========================================================
   CHỐNG SCROLL KHI GIỮ NÚT
========================================================= */

document
    .querySelectorAll(".move")
    .forEach(
        button => {

            button.addEventListener(
                "touchstart",
                e => {
                    e.preventDefault();
                },
                {passive:false}
            );

            button.addEventListener(
                "touchmove",
                e => {
                    e.preventDefault();
                },
                {passive:false}
            );

            button.addEventListener(
                "touchend",
                e => {
                    e.preventDefault();
                },
                {passive:false}
            );
        }
    );


/* =========================================================
   INIT
========================================================= */

resetGame();

draw();

</script>
