
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Né Quái - V3</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101827;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
}

.wrap{
  max-width:820px;
  margin:18px auto;
  padding:12px;
}

h1{
  margin:8px 0 12px;
}

.top{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.stat{
  background:#1d2a42;
  border:1px solid #394968;
  border-radius:10px;
  padding:9px 13px;
}

canvas{
  width:100%;
  max-width:760px;
  border:2px solid #394968;
  border-radius:12px;
  background:#18243a;
  touch-action:none;
}

button{
  border:0;
  border-radius:12px;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}

#start{
  background:#67d36b;
  font-size:19px;
  padding:12px 22px;
  margin:8px;
}

.move{
  background:#dce6f5;
  width:100px;
  height:76px;
  margin:7px;
  font-size:44px;
  font-weight:bold;
  line-height:1;
  touch-action:none;
}

#message{
  min-height:24px;
  font-weight:bold;
}

#taunt{
  min-height:30px;
  margin:3px;
  font-size:22px;
  font-weight:bold;
}

.small{
  opacity:.78;
  font-size:14px;
}
</style>
</head>

<body>

<div class="wrap">

<h1>🎮 Né Quái</h1>

<div class="top">

<div class="stat">
🏆 Điểm:
<span id="score">0</span>
</div>

<div class="stat">
🔥 Kỷ lục:
<span id="record">0</span>
</div>

<div class="stat">
❤️ Máu:
<span id="hp">3</span>
</div>

<div class="stat">
✨ Skill:
<span id="skill">Không</span>
</div>

</div>

<canvas id="game" width="760" height="440"></canvas>

<div>
<button id="start">▶ Bắt đầu</button>
</div>

<div>
<button class="move" id="left">⬅️</button>
<button class="move" id="right">➡️</button>
</div>

<p id="message"></p>

<p id="taunt"></p>

<p class="small">
PC: dùng ← → hoặc A/D.
<br>
Điện thoại: giữ nút ⬅️ ➡️ để di chuyển.
<br>
🍎 Ăn trái cây để nhận skill ngẫu nhiên.
</p>

</div>

<script>

const c=document.getElementById("game");
const x=c.getContext("2d");

const scoreEl=document.getElementById("score");
const recordEl=document.getElementById("record");
const hpEl=document.getElementById("hp");
const skillEl=document.getElementById("skill");
const messageEl=document.getElementById("message");
const tauntEl=document.getElementById("taunt");
const startBtn=document.getElementById("start");

let p;
let enemies;
let bombs;
let fruits;
let bullets;
let particles;
let rainbows;
let hpItems;

let score;
let hp;

let running=false;
let last;
let spawn;
let bombSpawn;
let fruitSpawn;
let shootTimer;

let skill="Không";
let skillTime=0;
let laserTime=0;

let keys={};
let raf;

let record=
Number(localStorage.getItem("neQuaiRecord")||0);

const SKILLS=[
"Bắn nhanh",
"Tia laser",
"Khiên",
"🔥 Phun lửa",
"⚡ Tia điện",
"❄️ Tia băng"
];

const clamp=(v,a,b)=>
Math.max(a,Math.min(b,v));

const rand=(a,b)=>
a+Math.random()*(b-a);


/* =========================
   THÔNG BÁO
========================= */

function say(text){

messageEl.textContent=text;

clearTimeout(say.timer);

say.timer=setTimeout(()=>{
messageEl.textContent="";
},2000);

}


/* =========================
   HIỆU ỨNG
========================= */

function boom(px,py,type="normal"){

for(let i=0;i<28;i++){

particles.push({

x:px,
y:py,

vx:rand(-220,220),
vy:rand(-220,220),

life:.7,

type:type

});

}

}


/* =========================
   RESET
========================= */

function reset(){

p={
x:380,
y:390,
w:44,
h:25,
s:360,
r:20
};

enemies=[];
bombs=[];
fruits=[];
bullets=[];
particles=[];
rainbows=[];
hpItems=[];

score=0;
hp=3;

spawn=.4;
bombSpawn=5;
fruitSpawn=5;

shootTimer=0;

skill="Không";
skillTime=0;
laserTime=0;

scoreEl.textContent="0";
hpEl.textContent="3";
skillEl.textContent="Không";
recordEl.textContent=record;
tauntEl.textContent="";

draw();

}


/* =========================
   SKILL NGẪU NHIÊN
========================= */

function chooseSkill(){

skill=
SKILLS[
Math.floor(
Math.random()*SKILLS.length
)
];

skillTime=20;

laserTime=
skill==="Tia laser"
?20
:0;

skillEl.textContent=
skill+" 20s";

say(
"🍎 Nhận skill: "+skill+"!"
);

}


/* =========================
   QUÁI
========================= */

function spawnEnemy(){

const types=[

{
kind:"normal",
color:"#4f8cff",
r:17,
v:rand(95,145),
hp:1
},

{
kind:"fast",
color:"#ff9f43",
r:14,
v:rand(155,205),
hp:1
},

{
kind:"tank",
color:"#9b59b6",
r:24,
v:rand(65,95),
hp:3
},

{
kind:"green",
color:"#39d98a",
r:19,
v:rand(105,150),
hp:2
}

];

const t=
types[
Math.floor(
Math.random()*types.length
)
];

enemies.push({

x:rand(28,732),

y:-30,

r:t.r,

v:t.v,

baseV:t.v,

color:t.color,

kind:t.kind,

hp:t.hp,

frozen:false,

freeze:0

});

}


/* =========================
   BẮN
========================= */

function shoot(type="normal"){

bullets.push({

x:p.x,

y:p.y-25,

r:
type==="fire"
?8
:6,

v:
type==="fire"
?600
:550,

type:type

});

}


/* =========================
   GIẾT QUÁI
========================= */

function killEnemy(i,points=5,effect="normal"){

if(!enemies[i])
return;

const e=enemies[i];

boom(
e.x,
e.y,
effect
);

enemies.splice(i,1);

score+=points;

}


/* =========================
   SKILL ĐẶC BIỆT
========================= */

function electricAttack(i){

if(!enemies[i])
return;

const target=enemies[i];

killEnemy(
i,
12,
"electric"
);

let nearest=-1;
let distance=130;

for(let j=enemies.length-1;j>=0;j--){

const d=
Math.hypot(
target.x-enemies[j].x,
target.y-enemies[j].y
);

if(d<distance){

distance=d;
nearest=j;

}

}

if(nearest>=0){

killEnemy(
nearest,
9,
"electric"
);

}

}


/* =========================
   UPDATE
========================= */

function update(dt){

score+=dt*2;

spawn-=dt;
bombSpawn-=dt;
fruitSpawn-=dt;
shootTimer-=dt;


/* SKILL TIMER */

if(skill!=="Không"){

skillTime-=dt;

if(skillTime>0){

skillEl.textContent=
skill+
" "+
Math.ceil(skillTime)+
"s";

}

if(skillTime<=0){

skill="Không";
skillTime=0;
laserTime=0;

skillEl.textContent="Không";

}

}


/* QUÁI */

if(spawn<=0){

spawnEnemy();

spawn=
Math.max(
.25,
.72-score*.0025
);

}


/* BOM */

if(bombSpawn<=0){

bombs.push({

x:rand(35,725),

y:-25,

r:18,

v:rand(180,260)

});

bombSpawn=
rand(7,11);

}


/* TRÁI CÂY */

if(fruitSpawn<=0){

fruits.push({

x:rand(35,725),

y:-25,

r:17,

v:70

});

fruitSpawn=
rand(7,12);

}


/* 🌈 0.1% CẦU VỒNG */

if(
Math.random()<0.001*dt*2
){

rainbows.push({

x:rand(35,725),

y:-25,

r:20,

v:60,

spin:0

});

}


/* ❤️ 0.1% HỒI MÁU */

if(
Math.random()<0.001*dt*2
){

hpItems.push({

x:rand(35,725),

y:-25,

r:18,

v:58,

pulse:0

});

}


/* DI CHUYỂN */

if(keys.left||keys.a)
p.x-=p.s*dt;

if(keys.right||keys.d)
p.x+=p.s*dt;

p.x=
clamp(
p.x,
30,
730
);


/* TỐC ĐỘ BẮN */

let rate=.42;

if(skill==="Bắn nhanh")
rate=.10;

if(skill==="🌈 7 SẮC")
rate=.07;

if(
skill==="Tia laser"
)
rate=.20;

if(shootTimer<=0){

let type="normal";

if(skill==="🔥 Phun lửa")
type="fire";

if(skill==="⚡ Tia điện")
type="electric";

if(skill==="❄️ Tia băng")
type="ice";

if(skill==="🌈 7 SẮC")
type="rainbow";

shoot(type);

shootTimer=rate;

}


/* QUÁI DI CHUYỂN */

enemies.forEach(e=>{

if(e.frozen){

e.freeze-=dt;

if(e.freeze<=0){

e.frozen=false;

e.v=e.baseV;

}

}

e.y+=
(
e.frozen
?e.v*.15
:e.v
)*dt;

});


/* VA CHẠM QUÁI */

for(
let i=enemies.length-1;
i>=0;
i--
){

const e=enemies[i];

if(
Math.hypot(
p.x-e.x,
p.y-e.y
)
<
p.r+e.r
){

if(
(
skill==="Khiên"||
skill==="🌈 7 SẮC"
)
&&
skillTime>0
){

killEnemy(
i,
8,
"shield"
);

}else{

enemies.splice(i,1);

hp--;

hpEl.textContent=hp;

boom(
p.x,
p.y,
"hit"
);

if(hp<=0){

gameOver();

return;

}

}

}

else if(e.y>470){

enemies.splice(i,1);

}

}


/* =========================
   BOM
========================= */

for(
let i=bombs.length-1;
i>=0;
i--
){

const b=bombs[i];

b.y+=b.v*dt;


/* BOM ĐỤNG QUÁI */

for(
let j=enemies.length-1;
j>=0;
j--
){

const e=enemies[j];

if(
Math.hypot(
b.x-e.x,
b.y-e.y
)
<
b.r+e.r+10
){

killEnemy(
j,
10,
"bomb"
);

}

}


/* BOM ĐỤNG NGƯỜI */

if(
Math.hypot(
b.x-p.x,
b.y-p.y
)
<
b.r+20
){

if(
(
skill==="Khiên"||
skill==="🌈 7 SẮC"
)
&&
skillTime>0
){

boom(
b.x,
b.y,
"shield"
);

bombs.splice(i,1);

continue;

}

hp--;

hpEl.textContent=hp;

boom(
b.x,
b.y,
"hit"
);

bombs.splice(i,1);

if(hp<=0){

gameOver();

return;

}

continue;

}

if(b.y>470){

bombs.splice(i,1);

}

}


/* =========================
   TRÁI CÂY
========================= */

for(
let i=fruits.length-1;
i>=0;
i--
){

const f=fruits[i];

f.y+=f.v*dt;

if(
Math.hypot(
f.x-p.x,
f.y-p.y
)
<
f.r+22
){

chooseSkill();

fruits.splice(i,1);

}

else if(f.y>470){

fruits.splice(i,1);

}

}


/* =========================
   🌈 CẦU VỒNG
========================= */

for(
let i=rainbows.length-1;
i>=0;
i--
){

const r=rainbows[i];

r.y+=r.v*dt;

r.spin+=dt*6;

if(
Math.hypot(
r.x-p.x,
r.y-p.y
)
<
r.r+22
){

skill="🌈 7 SẮC";

skillTime=20;

laserTime=20;

skillEl.textContent=
"🌈 7 SẮC 20s";

say(
"🌈 SIÊU HIẾM! SKILL 7 SẮC!"
);

rainbows.splice(i,1);

}

else if(r.y>470){

rainbows.splice(i,1);

}

}


/* =========================
   ❤️ HỒI MÁU
========================= */

for(
let i=hpItems.length-1;
i>=0;
i--
){

const h=hpItems[i];

h.y+=h.v*dt;

h.pulse+=dt*6;

if(
Math.hypot(
h.x-p.x,
h.y-p.y
)
<
h.r+22
){

hp=
Math.min(
3,
hp+1
);

hpEl.textContent=hp;

say(
"❤️ SIÊU HIẾM! +1 MÁU!"
);

boom(
h.x,
h.y,
"shield"
);

hpItems.splice(i,1);

}

else if(h.y>470){

hpItems.splice(i,1);

}

}


/* =========================
   ĐẠN
========================= */

for(
let i=bullets.length-1;
i>=0;
i--
){

const b=bullets[i];

b.y-=b.v*dt;

if(b.y<-40){

bullets.splice(i,1);

continue;

}


for(
let j=enemies.length-1;
j>=0;
j--
){

const e=enemies[j];

if(
Math.hypot(
b.x-e.x,
b.y-e.y
)
<
b.r+e.r
){

/* BĂNG */

if(b.type==="ice"){

e.frozen=true;

e.freeze=3;

e.baseV=
e.baseV||
e.v;

e.v=25;

if(e.hp>1){

e.hp--;

boom(
e.x,
e.y,
"ice"
);

}else{

killEnemy(
j,
8,
"ice"
);

}

bullets.splice(i,1);

break;

}


/* ĐIỆN */

if(b.type==="electric"){

electricAttack(j);

bullets.splice(i,1);

break;

}


/* LỬA */

if(b.type==="fire"){

killEnemy(
j,
9,
"fire"
);

bullets.splice(i,1);

break;

}


/* 🌈 */

if(b.type==="rainbow"){

e.frozen=true;

e.freeze=2;

e.baseV=
e.baseV||
e.v;

e.v=20;

if(e.hp>1)
e.hp--;

else
killEnemy(
j,
14,
"laser"
);

boom(
e.x,
e.y,
"laser"
);

bullets.splice(i,1);

break;

}


/* ĐẠN THƯỜNG */

if(e.hp>1){

e.hp--;

boom(
e.x,
e.y,
"normal"
);

bullets.splice(i,1);

break;

}

killEnemy(
j,
5,
"normal"
);

bullets.splice(i,1);

break;

}

}

}


/* =========================
   LASER
========================= */

if(
(
skill==="Tia laser"||
skill==="🌈 7 SẮC"
)
&&
skillTime>0
){

for(
let i=enemies.length-1;
i>=0;
i--
){

if(
Math.abs(
enemies[i].x-p.x
)
<
35
){

killEnemy(
i,
skill==="🌈 7 SẮC"
?14
:8,
"laser"
);

}

}

}


/* PARTICLES */

particles.forEach(q=>{

q.x+=q.vx*dt;

q.y+=q.vy*dt;

q.life-=dt;

});

particles=
particles.filter(
q=>q.life>0
);


/* KỶ LỤC */

const current=
Math.floor(score);

scoreEl.textContent=current;

if(current>record){

record=current;

localStorage.setItem(
"neQuaiRecord",
record
);

recordEl.textContent=record;

}


/* CÂU CHỌC */

if(current>=500){

tauntEl.textContent=
"😳 Ờ hay thằng này giỏi thế!";

}

else if(current>=200){

tauntEl.textContent=
"🐔 Gà thế!";

}

}


/* =========================
   VẼ GAME
========================= */

function draw(){

x.clearRect(
0,
0,
760,
440
);


/* BACKGROUND */

x.fillStyle="#18243a";

x.fillRect(
0,
0,
760,
440
);

x.fillStyle="#22324d";

for(
let i=0;
i<14;
i++
){

x.fillRect(
i*60,
0,
1,
440
);

}


/* ĐẤT */

x.fillStyle="#4d7c59";

x.fillRect(
0,
415,
760,
25
);


/* PLAYER */

x.fillStyle="#77b255";

x.fillRect(
p.x-22,
p.y-13,
44,
26
);

x.fillStyle="#fff";

x.fillRect(
p.x-12,
p.y-5,
7,
7
);

x.fillRect(
p.x+5,
p.y-5,
7,
7
);


/* KHIÊN */

if(
(
skill==="Khiên"||
skill==="🌈 7 SẮC"
)
&&
skillTime>0
){

x.strokeStyle="#72edff";

x.lineWidth=5;

x.beginPath();

x.arc(
p.x,
p.y,
38,
0,
Math.PI*2
);

x.stroke();

}


/* LASER */

if(
(
skill==="Tia laser"||
skill==="🌈 7 SẮC"
)
&&
skillTime>0
){

x.fillStyle=
"rgba(255,70,220,.25)";

x.fillRect(
p.x-35,
0,
70,
415
);

x.fillStyle="#ff8af0";

x.fillRect(
p.x-6,
0,
12,
415
);

}


/* QUÁI */

enemies.forEach(e=>{

x.fillStyle=
e.frozen
?"#8fe8ff"
:e.color;

x.beginPath();

x.arc(
e.x,
e.y,
e.r,
0,
Math.PI*2
);

x.fill();


/* MẮT */

x.fillStyle="#111";

x.fillRect(
e.x-e.r*.45,
e.y-e.r*.25,
5,
5
);

x.fillRect(
e.x+e.r*.15,
e.y-e.r*.25,
5,
5
);


/* TANK */

if(e.kind==="tank"){

x.strokeStyle="#e7c4ff";

x.lineWidth=3;

x.stroke();

}


/* ĐÓNG BĂNG */

if(e.frozen){

x.strokeStyle="#b9f3ff";

x.lineWidth=4;

x.stroke();

x.fillStyle="#d9f8ff";

x.font="12px Arial";

x.textAlign="center";

x.fillText(
"❄ ĐÓNG BĂNG",
e.x,
e.y-e.r-8
);

}

});


/* BOM */

bombs.forEach(b=>{

x.fillStyle="#252525";

x.beginPath();

x.arc(
b.x,
b.y,
b.r,
0,
Math.PI*2
);

x.fill();

x.fillStyle="#ffb52e";

x.fillRect(
b.x-2,
b.y-b.r-8,
4,
8
);

});


/* TRÁI CÂY */

fruits.forEach(f=>{

x.font="30px Arial";

x.textAlign="center";

x.fillText(
"🍎",
f.x,
f.y+10
);

});


/* 🌈 CẦU VỒNG */

rainbows.forEach(r=>{

x.save();

x.translate(
r.x,
r.y
);

x.rotate(r.spin);

const colors=[
"#ff4d6d",
"#ff9f43",
"#ffe66d",
"#5ee37a",
"#5ec8ff",
"#6f7cff",
"#d47cff"
];

for(
let i=0;
i<7;
i++
){

x.strokeStyle=
colors[i];

x.lineWidth=4;

x.beginPath();

x.arc(
0,
0,
10+i*2,
-Math.PI*.9,
Math.PI*.9
);

x.stroke();

}

x.restore();

});


/* ❤️ HP */

hpItems.forEach(h=>{

const s=
1+
Math.sin(h.pulse)*.12;

x.save();

x.translate(
h.x,
h.y
);

x.scale(
s,
s
);

x.fillStyle="#ff4d6d";

x.beginPath();

x.arc(
-6,
-2,
7,
0,
Math.PI*2
);

x.arc(
6,
-2,
7,
0,
Math.PI*2
);

x.moveTo(
-13,
1
);

x.lineTo(
13,
1
);

x.lineTo(
0,
15
);

x.closePath();

x.fill();

x.fillStyle="#fff";

x.font="bold 10px Arial";

x.textAlign="center";

x.fillText(
"+HP",
0,
4
);

x.restore();

});


/* ĐẠN */

bullets.forEach(b=>{

let color="#ffe66b";

if(b.type==="fire")
color="#ff5a36";

if(b.type==="electric")
color="#ffe66d";

if(b.type==="ice")
