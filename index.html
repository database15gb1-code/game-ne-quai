<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Né Quái - V4</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#0b1220;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow-x:hidden;
}

h1{
    margin:12px 0;
    font-size:30px;
}

#info{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin:8px auto;
    max-width:1000px;
}

.box{
    background:#17243c;
    border:1px solid #33496e;
    border-radius:12px;
    padding:9px 14px;
    font-size:17px;
    box-shadow:0 4px 12px #0005;
}

#game{
    position:relative;
    width:min(960px,96vw);
    height:min(620px,72vh);
    min-height:430px;
    margin:auto;
    border:3px solid #344d75;
    border-radius:18px;
    overflow:hidden;
    background:
        linear-gradient(#ffffff08 1px,transparent 1px),
        linear-gradient(90deg,#ffffff08 1px,transparent 1px),
        #142139;
    background-size:40px 40px;
    touch-action:none;
}

#ground{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:32px;
    background:#4b875b;
    pointer-events:none;
}

.entity{
    position:absolute;
    pointer-events:none;
    will-change:transform;
}

#player{
    width:42px;
    height:42px;
    background:#75c94c;
    border-radius:7px;
    border:2px solid #d5ffba;
    z-index:20;
    box-shadow:0 0 15px #79ff58;
}

.eye{
    position:absolute;
    width:7px;
    height:7px;
    background:white;
    border-radius:50%;
    top:10px;
}

.eye.left{left:8px}
.eye.right{right:8px}

.pupil{
    width:3px;
    height:3px;
    background:#111;
    border-radius:50%;
    margin:2px;
}

.enemy{
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid #d7c4ff;
    z-index:8;
    box-shadow:0 0 12px #a86cff88;
}

.enemy.normal{background:#8d55b9}
.enemy.fast{
    background:#2979d7;
    width:32px;
    height:32px;
    border-color:#a9d4ff;
}
.enemy.tank{
    background:#28ad78;
    width:50px;
    height:50px;
    border-color:#a9ffda;
}
.enemy.small{
    background:#f3a13d;
    width:28px;
    height:28px;
    border-color:#ffd59a;
}

.enemy-eye{
    position:absolute;
    width:6px;
    height:6px;
    background:#111;
    top:12px;
}

.enemy-eye.one{left:8px}
.enemy-eye.two{right:8px}

.bomb{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#242424;
    border:2px solid #444;
    z-index:14;
    box-shadow:0 0 15px #ffb00088;
}

.bomb:after{
    content:"";
    position:absolute;
    width:5px;
    height:11px;
    background:#ffb000;
    top:-9px;
    left:12px;
}

.fruit{
    width:30px;
    height:30px;
    border-radius:50%;
    background:#ff4f68;
    border:2px solid white;
    z-index:15;
    box-shadow:0 0 16px #ff4f68;
}

.rainbow{
    background:conic-gradient(
        #ff3030,
        #ff9d00,
        #ffe600,
        #38d46a,
        #27a8ff,
        #7e5cff,
        #e95cff,
        #ff3030
    );
    box-shadow:0 0 25px #fff;
}

.hp{
    background:#55e889;
    box-shadow:0 0 18px #55e889;
}

.projectile{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ffe35b;
    box-shadow:0 0 10px #ffe35b;
    z-index:12;
}

.fireball{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#ff7a18;
    box-shadow:0 0 20px #ff4218;
}

.laser{
    position:absolute;
    height:8px;
    background:#ff43e9;
    box-shadow:0 0 15px #ff43e9,0 0 30px #ff43e9;
    border-radius:10px;
    z-index:11;
    pointer-events:none;
}

.lightning{
    position:absolute;
    width:7px;
    background:#64d9ff;
    box-shadow:0 0 14px #64d9ff;
    border-radius:8px;
    z-index:11;
    pointer-events:none;
}

.iceEffect{
    position:absolute;
    width:55px;
    height:55px;
    border:4px solid #9cecff;
    border-radius:50%;
    box-shadow:0 0 22px #51dcff;
    pointer-events:none;
    z-index:10;
}

.explosion{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    border:5px solid #ffb52e;
    box-shadow:0 0 30px #ff5b22;
    pointer-events:none;
    z-index:30;
    animation:explode .35s ease-out forwards;
}

@keyframes explode{
    from{
        transform:scale(.2);
        opacity:1;
    }
    to{
        transform:scale(1.5);
        opacity:0;
    }
}

#fruitText{
    position:absolute;
    left:10px;
    top:8px;
    font-size:18px;
    z-index:40;
    text-shadow:0 2px 5px #000;
}

#message{
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:30px;
    font-weight:bold;
    text-shadow:0 3px 10px #000;
    z-index:100;
    pointer-events:none;
    opacity:0;
    transition:.2s;
    white-space:nowrap;
}

#startScreen,
#gameOver{
    position:absolute;
    inset:0;
    background:#08101ee8;
    z-index:200;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:15px;
    padding:20px;
}

#gameOver{
    display:none;
}

button{
    border:0;
    border-radius:14px;
    padding:13px 25px;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:#3e7cff;
    cursor:pointer;
    box-shadow:0 5px 12px #0005;
}

button:active{
    transform:scale(.94);
}

#controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    margin:12px auto;
    user-select:none;
}

.control{
    width:78px;
    height:68px;
    font-size:35px;
    padding:0;
    background:#263a5e;
    border:2px solid #5573a7;
    touch-action:none;
}

#controls .middle{
    display:flex;
    flex-direction:column;
    gap:7px;
}

#controls .middle .control{
    width:78px;
    height:55px;
}

.skillButtons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin:8px auto 16px;
    max-width:950px;
}

.skillBtn{
    font-size:14px;
    padding:9px 12px;
    background:#202f4c;
    border:1px solid #49668e;
}

#tip{
    font-size:14px;
    color:#b9c7dd;
    margin-bottom:10px;
}

@media(max-width:600px){
    h1{
        font-size:25px;
    }

    .box{
        font-size:14px;
        padding:7px 9px;
    }

    #game{
        width:96vw;
        height:62vh;
        min-height:390px;
    }

    .control{
        width:82px;
        height:70px;
    }

    #message{
        font-size:23px;
    }
}
</style>
</head>

<body>

<h1>🎮 Né Quái</h1>

<div id="info">
    <div class="box">🏆 Điểm: <b id="score">0</b></div>
    <div class="box">🔥 Kỷ lục: <b id="highScore">0</b></div>
    <div class="box">❤️ Máu: <b id="hp">100</b></div>
    <div class="box">🗺️ Màn: <b id="level">1</b></div>
    <div class="box">✨ Skill: <b id="skill">Không</b></div>
</div>

<div id="game">

    <div id="fruitText">🍎 Ăn trái cây để nhận skill</div>

    <div id="player" class="entity">
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
    </div>

    <div id="ground"></div>

    <div id="message"></div>

    <div id="startScreen">
        <h2>🎮 NÉ QUÁI</h2>
        <p>Né quái, ăn trái cây và cố phá kỷ lục!</p>
        <button id="startBtn">▶ Bắt đầu</button>
    </div>

    <div id="gameOver">
        <h2>💀 GAME OVER</h2>
        <p>Điểm: <b id="finalScore">0</b></p>
        <p>Kỷ lục: <b id="finalHigh">0</b></p>
        <button id="restartBtn">🔄 Chơi lại</button>
    </div>

</div>

<div id="controls">

    <button class="control" id="left">◀</button>

    <div class="middle">
        <button class="control" id="up">▲</button>
        <button class="control" id="down">▼</button>
    </div>

    <button class="control" id="right">▶</button>

</div>

<div class="skillButtons">
    <button class="skillBtn" data-skill="fire">🔥 Lửa</button>
    <button class="skillBtn" data-skill="lightning">⚡ Điện</button>
    <button class="skillBtn" data-skill="ice">❄️ Băng</button>
    <button class="skillBtn" data-skill="laser">🔮 Laser</button>
    <button class="skillBtn" data-skill="rapid">🔫 Bắn nhanh</button>
    <button class="skillBtn" data-skill="shield">🛡️ Khiên</button>
</div>

<div id="tip">
    Bàn phím: WASD / phím mũi tên • Điện thoại: dùng các nút mũi tên
</div>

<script>
"use strict";

/* =========================================================
   CẤU HÌNH
========================================================= */

const CONFIG = {
    MAX_ENEMIES: 18,
    MAX_PROJECTILES: 35,
    MAX_EFFECTS: 35,
    MAX_BOMBS: 3,

    RAINBOW_CHANCE: 0.001,
    HP_CHANCE: 0.001,

    PLAYER_SPEED: 330,
    START_HP: 100,

    SCORE_LEVEL: 100
};

/* =========================================================
   DOM
========================================================= */

const game = document.getElementById("game");
const playerEl = document.getElementById("player");

const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("highScore");
const hpEl = document.getElementById("hp");
const levelEl = document.getElementById("level");
const skillEl = document.getElementById("skill");

const messageEl = document.getElementById("message");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const finalScoreEl = document.getElementById("finalScore");
const finalHighEl = document.getElementById("finalHigh");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");

/* =========================================================
   GAME STATE
========================================================= */

let running = false;
let lastTime = 0;

let score = 0;
let hp = CONFIG.START_HP;

let highScore = Number(localStorage.getItem("nequai_highscore") || 0);

let level = 1;

let player = {
    x: 0,
    y: 0,
    w: 42,
    h: 42
};

let enemies = [];
let projectiles = [];
let bombs = [];
let fruits = [];
let effects = [];

let particles = [];

let input = {
    left:false,
    right:false,
    up:false,
    down:false
};

let currentSkill = null;
let skillUntil = 0;

let spawnTimer = 0;
let fruitTimer = 0;
let bombTimer = 0;
let shootTimer = 0;
let damageCooldown = 0;

let frozenEnemies = new Map();

/* =========================================================
   KHỞI TẠO
========================================================= */

highScoreEl.textContent = highScore;

function resetPlayer(){

    const rect = game.getBoundingClientRect();

    player.x = rect.width / 2 - 21;
    player.y = rect.height - 80;

    updatePlayer();
}

function updatePlayer(){

    playerEl.style.transform =
        `translate3d(${player.x}px,${player.y}px,0)`;
}

function clampPlayer(){

    const rect = game.getBoundingClientRect();

    player.x = Math.max(0,Math.min(rect.width-player.w,player.x));
    player.y = Math.max(0,Math.min(rect.height-32-player.h,player.y));
}

/* =========================================================
   ENTITY CREATION
========================================================= */

function createEnemy(){

    if(!running) return;

    if(enemies.length >= CONFIG.MAX_ENEMIES) return;

    const rect = game.getBoundingClientRect();

    const types = ["normal","normal","normal","fast","tank","small"];

    const type = types[Math.floor(Math.random()*types.length)];

    let size = 38;
    let hpEnemy = 1;
    let speed = 80;

    if(type === "fast"){
        size = 32;
        speed = 145;
    }

    if(type === "tank"){
        size = 50;
        hpEnemy = 3;
        speed = 55;
    }

    if(type === "small"){
        size = 28;
        speed = 180;
    }

    const el = document.createElement("div");

    el.className = `entity enemy ${type}`;

    el.innerHTML = `
        <div class="enemy-eye one"></div>
        <div class="enemy-eye two"></div>
    `;

    game.appendChild(el);

    const enemy = {
        el,
        x:Math.random()*(rect.width-size),
        y:-size-10,
        size,
        hp:hpEnemy,
        maxHp:hpEnemy,
        speed:speed + level*4,
        phase:Math.random()*Math.PI*2,
        dead:false
    };

    enemies.push(enemy);

    renderEnemy(enemy);
}

function renderEnemy(e){

    e.el.style.transform =
        `translate3d(${e.x}px,${e.y}px,0)`;
}

/* =========================================================
   BOM
========================================================= */

function createBomb(){

    if(!running) return;

    if(bombs.length >= CONFIG.MAX_BOMBS) return;

    const rect = game.getBoundingClientRect();

    const el = document.createElement("div");

    el.className = "entity bomb";

    game.appendChild(el);

    const bomb = {
        el,
        x:Math.random()*(rect.width-32),
        y:-40,
        speed:180 + Math.random()*80,
        dead:false
    };

    bombs.push(bomb);
}

function explodeBomb(bomb){

    if(bomb.dead) return;

    bomb.dead = true;

    createExplosion(bomb.x-20,bomb.y-20);

    /*
       QUAN TRỌNG:
       BOM CHỈ GÂY SÁT THƯƠNG NGƯỜI CHƠI.
       KHÔNG KIỂM TRA VA CHẠM VỚI QUÁI.
    */

    const dx = player.x + player.w/2 - (bomb.x+16);
    const dy = player.y + player.h/2 - (bomb.y+16);

    const distance = Math.sqrt(dx*dx+dy*dy);

    if(distance < 75){
        damagePlayer(25);
    }
}

/* =========================================================
   TRÁI CÂY
========================================================= */

function createFruit(){

    if(!running) return;

    if(fruits.length >= 2) return;

    const rect = game.getBoundingClientRect();

    const roll = Math.random();

    let type = "skill";

    /*
       0.1% trái 7 sắc cầu vồng
    */
    if(roll < CONFIG.RAINBOW_CHANCE){
        type = "rainbow";
    }
    /*
       0.1% trái hồi máu
    */
    else if(roll < CONFIG.RAINBOW_CHANCE + CONFIG.HP_CHANCE){
        type = "hp";
    }

    const el = document.createElement("div");

    el.className =
        `entity fruit ${type === "rainbow" ? "rainbow":""} ${type === "hp" ? "hp":""}`;

    game.appendChild(el);

    const fruit = {
        el,
        type,
        x:Math.random()*(rect.width-30),
        y:-35,
        speed:70,
        dead:false
    };

    fruits.push(fruit);
}

/* =========================================================
   SKILL
========================================================= */

const skillNames = {
    fire:"🔥 Phun lửa",
    lightning:"⚡ Tia điện",
    ice:"❄️ Tia băng",
    laser:"🔮 Laser",
    rapid:"🔫 Bắn nhanh",
    shield:"🛡️ Khiên"
};

function giveRandomSkill(){

    const skills = Object.keys(skillNames);

    const selected =
        skills[Math.floor(Math.random()*skills.length)];

    currentSkill = selected;

    let duration = 10000;

    if(selected === "fire") duration = 20000;
    if(selected === "shield") duration = 15000;
    if(selected === "rapid") duration = 20000;

    skillUntil = performance.now() + duration;

    skillEl.textContent =
        `${skillNames[selected]} ${Math.ceil(duration/1000)}s`;

    showMessage(skillNames[selected],700);
}

function useSkill(type){

    currentSkill = type;
    skillUntil = performance.now() + 10000;

    skillEl.textContent = skillNames[type];

    showMessage(skillNames[type],600);
}

function updateSkill(now){

    if(!currentSkill) return;

    const remaining = skillUntil-now;

    if(remaining <= 0){

        currentSkill = null;
        skillEl.textContent = "Không";

        return;
    }

    skillEl.textContent =
        `${skillNames[currentSkill]} ${Math.ceil(remaining/1000)}s`;
}

/* =========================================================
   ĐẠN
========================================================= */

function shoot(){

    if(!running) return;

    if(projectiles.length >= CONFIG.MAX_PROJECTILES) return;

    const p = {
        el:document.createElement("div"),
        x:player.x+player.w/2-4,
        y:player.y-10,
        vx:0,
        vy:-520,
        damage:1,
        dead:false
    };

    p.el.className = "entity projectile";

    game.appendChild(p.el);

    projectiles.push(p);
}

function rapidShoot(){

    shoot();

    if(projectiles.length < CONFIG.MAX_PROJECTILES){

        setTimeout(()=>{
            if(running) shoot();
        },80);

    }
}

/* =========================================================
   SKILL TẤN CÔNG
========================================================= */

function fireAttack(){

    if(effects.length >= CONFIG.MAX_EFFECTS) return;

    const p = {
        el:document.createElement("div"),
        x:player.x+player.w/2-8,
        y:player.y-25,
        vx:0,
        vy:-400,
        damage:3,
        life:1400,
        dead:false
    };

    p.el.className = "entity fireball";

    game.appendChild(p.el);

    projectiles.push(p);
}

function laserAttack(){

    if(effects.length >= CONFIG.MAX_EFFECTS) return;

    const rect = game.getBoundingClientRect();

    const el = document.createElement("div");

    el.className = "laser";

    el.style.left = "0px";
    el.style.width = rect.width+"px";
    el.style.top = (player.y+15)+"px";

    game.appendChild(el);

    const effect = {
        el,
        life:220,
        dead:false
    };

    effects.push(effect);

    /*
       Laser gây sát thương quái.
    */

    for(const enemy of enemies){

        if(enemy.dead) continue;

        const ey = enemy.y + enemy.size/2;
        const py = player.y+player.h/2;

        if(Math.abs(ey-py)<35){

            damageEnemy(enemy,2);
        }
    }
}

function lightningAttack(){

    if(effects.length >= CONFIG.MAX_EFFECTS) return;

    const rect = game.getBoundingClientRect();

    const x =
        Math.random()*(rect.width-10);

    const el = document.createElement("div");

    el.className = "lightning";

    el.style.left = x+"px";
    el.style.top = "0px";
    el.style.height = rect.height+"px";

    game.appendChild(el);

    effects.push({
        el,
        life:180,
        dead:false
    });

    for(const enemy of enemies){

        if(enemy.dead) continue;

        if(Math.abs(enemy.x-x)<45){

            damageEnemy(enemy,3);
        }
    }
}

function iceAttack(){

    if(effects.length >= CONFIG.MAX_EFFECTS) return;

    const rect = game.getBoundingClientRect();

    const centerX =
        player.x + player.w/2;

    const centerY =
        player.y + player.h/2;

    const el = document.createElement("div");

    el.className = "iceEffect";

    el.style.left = centerX-27+"px";
    el.style.top = centerY-27+"px";

    game.appendChild(el);

    effects.push({
        el,
        life:350,
        dead:false
    });

    for(const enemy of enemies){

        if(enemy.dead) continue;

        const dx =
            enemy.x+enemy.size/2-centerX;

        const dy =
            enemy.y+enemy.size/2-centerY;

        const distance =
            Math.sqrt(dx*dx+dy*dy);

        if(distance < 180){

            /*
              Đóng băng nhưng VẪN CÓ THỂ GIẾT QUÁI.
            */

            frozenEnemies.set(enemy,performance.now()+2500);

            damageEnemy(enemy,1);
        }
    }
}

/* =========================================================
   SÁT THƯƠNG
========================================================= */

function damageEnemy(enemy,damage){

    if(!enemy || enemy.dead) return;

    enemy.hp -= damage;

    if(enemy.hp <= 0){

        killEnemy(enemy);

    }
}

function killEnemy(enemy){

    if(enemy.dead) return;

    enemy.dead = true;

    createExplosion(
        enemy.x-15,
        enemy.y-15
    );

    score += 1;

    updateScore();
}

/* =========================================================
   NGƯỜI CHƠI
========================================================= */

function damagePlayer(amount){

    if(!running) return;

    if(currentSkill === "shield"){
        return;
    }

    if(damageCooldown > 0){
        return;
    }

    damageCooldown = 700;

    hp -= amount;

    if(hp < 0) hp = 0;

    hpEl.textContent = hp;

    showMessage(`-${amount} ❤️`,350);

    if(hp <= 0){

        endGame();
    }
}

/* =========================================================
   VA CHẠM
========================================================= */

function collision(a,b){

    return (
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );
}

function playerRect(){

    return {
        x:player.x,
        y:player.y,
        w:player.w,
        h:player.h
    };
}

function enemyRect(e){

    return {
        x:e.x,
        y:e.y,
        w:e.size,
        h:e.size
    };
}

/* =========================================================
   EXPLOSION
========================================================= */

function createExplosion(x,y){

    if(effects.length >= CONFIG.MAX_EFFECTS) return;

    const el = document.createElement("div");

    el.className = "explosion";

    el.style.left = x+"px";
    el.style.top = y+"px";

    game.appendChild(el);

    effects.push({
        el,
        life:350,
        dead:false
    });
}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = null;

function showMessage(text,duration){

    messageEl.textContent = text;
    messageEl.style.opacity = "1";

    clearTimeout(messageTimer);

    messageTimer = setTimeout(()=>{
        messageEl.style.opacity = "0";
    },duration);
}

/* =========================================================
   SCORE
========================================================= */

function updateScore(){

    scoreEl.textContent = score;

    level =
        Math.floor(score/CONFIG.SCORE_LEVEL)+1;

    levelEl.textContent = level;

    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "nequai_highscore",
            highScore
        );

        highScoreEl.textContent = highScore;
    }

    /*
       THÔNG BÁO MỐC ĐIỂM
    */

    if(score === 200){

        showMessage("🐔 Gà thế!",1800);
    }

    if(score === 500){

        showMessage(
            "😳 Ơ hay thằng này giỏi thế!",
            2500
        );
    }
}

/* =========================================================
   UPDATE ENEMIES
========================================================= */

function updateEnemies(dt,now){

    const rect = game.getBoundingClientRect();

    for(const enemy of enemies){

        if(enemy.dead) continue;

        const frozenUntil =
            frozenEnemies.get(enemy) || 0;

        const frozen =
            now < frozenUntil;

        if(!frozen){

            const dx =
                player.x-enemy.x;

            const dy =
                player.y-enemy.y;

            const dist =
                Math.sqrt(dx*dx+dy*dy);

            if(dist > 1){

                enemy.x +=
                    (dx/dist)*enemy.speed*dt;

                enemy.y +=
                    (dy/dist)*enemy.speed*dt;
            }

            enemy.y += enemy.speed*.12*dt;
        }

        renderEnemy(enemy);

        /*
           Quái chạm người chơi
        */

        if(collision(
            playerRect(),
            enemyRect(enemy)
        )){

            damagePlayer(12);

            enemy.x += 60;

            enemy.y += 30;
        }

        /*
           Quái rơi ra ngoài màn hình
        */

        if(enemy.y > rect.height+80){

            enemy.dead = true;
        }
    }
}

/* =========================================================
   UPDATE PROJECTILES
========================================================= */

function updateProjectiles(dt){

    const rect = game.getBoundingClientRect();

    for(const p of projectiles){

        if(p.dead) continue;

        p.x += p.vx*dt;
        p.y += p.vy*dt;

        p.el.style.transform =
            `translate3d(${p.x}px,${p.y}px,0)`;

        if(
            p.y < -50 ||
            p.y > rect.height+50 ||
            p.x < -50 ||
            p.x > rect.width+50
        ){
            p.dead = true;
            continue;
        }

        const pw = 16;
        const ph = 16;

        for(const enemy of enemies){

            if(enemy.dead) continue;

            if(
                p.x < enemy.x+enemy.size &&
                p.x+pw > enemy.x &&
                p.y < enemy.y+enemy.size &&
                p.y+ph > enemy.y
            ){

                damageEnemy(enemy,p.damage || 1);

                p.dead = true;

                break;
            }
        }
    }
}

/* =========================================================
   UPDATE BOM
========================================================= */

function updateBombs(dt){

    const rect = game.getBoundingClientRect();

    for(const bomb of bombs){

        if(bomb.dead) continue;

        bomb.y += bomb.speed*dt;

        bomb.el.style.transform =
            `translate3d(${bomb.x}px,${bomb.y}px,0)`;

        /*
           BOM KHÔNG KIỂM TRA QUÁI.
           CHỈ KIỂM TRA NGƯỜI CHƠI.
        */

        if(
            collision(
                {
                    x:bomb.x,
                    y:bomb.y,
                    w:32,
                    h:32
                },
                playerRect()
            )
        ){

            explodeBomb(bomb);

        }
        else if(bomb.y > rect.height+50){

            bomb.dead = true;
        }
    }
}

/* =========================================================
   UPDATE FRUITS
========================================================= */

function updateFruits(dt){

    const rect = game.getBoundingClientRect();

    for(const fruit of fruits){

        if(fruit.dead) continue;

        fruit.y += fruit.speed*dt;

        fruit.el.style.transform =
            `translate3d(${fruit.x}px,${fruit.y}px,0)`;

        if(
            collision(
                {
                    x:fruit.x,
                    y:fruit.y,
                    w:30,
                    h:30
                },
                playerRect()
            )
        ){

            collectFruit(fruit);

        }
        else if(fruit.y > rect.height+50){

            fruit.dead = true;
        }
    }
}

function collectFruit(fruit){

    fruit.dead = true;

    if(fruit.type === "rainbow"){

        score += 50;

        hp = Math.min(100,hp+50);

        hpEl.textContent = hp;

        showMessage("🌈 7 SẮC CẦU VỒNG! +50",1800);

    }
    else if(fruit.type === "hp"){

        hp = Math.min(100,hp+35);

        hpEl.textContent = hp;

        showMessage("💚 HỒI MÁU +35",1200);

    }
    else{

        giveRandomSkill();
    }

    updateScore();
}

/* =========================================================
   UPDATE EFFECTS
========================================================= */

function updateEffects(dt){

    for(const effect of effects){

        if(effect.dead) continue;

        effect.life -= dt*1000;

        if(effect.life <= 0){

            effect.dead = true;
        }
    }
}

/* =========================================================
   CLEANUP
   QUAN TRỌNG CHO VIỆC KHÔNG BỊ ĐỨNG
========================================================= */

function cleanup(){

    enemies =
        enemies.filter(e=>{

            if(e.dead){

                e.el.remove();
                frozenEnemies.delete(e);

                return false;
            }

            return true;
        });

    projectiles =
        projectiles.filter(p=>{

            if(p.dead){

                p.el.remove();

                return false;
            }

            return true;
        });

    bombs =
        bombs.filter(b=>{

            if(b.dead){

                b.el.remove();

                return false;
            }

            return true;
        });

    fruits =
        fruits.filter(f=>{

            if(f.dead){

                f.el.remove();

                return false;
            }

            return true;
        });

    effects =
        effects.filter(e=>{

            if(e.dead){

                e.el.remove();

                return false;
            }

            return true;
        });
}

/* =========================================================
   SKILL LOOP
========================================================= */

function updateSkillAttack(now){

    if(!currentSkill) return;

    if(currentSkill === "fire"){

        if(now - shootTimer > 350){

            shootTimer = now;

            fireAttack();
        }
    }

    else if(currentSkill === "rapid"){

        if(now - shootTimer > 160){

            shootTimer = now;

            rapidShoot();
        }
    }

    else if(currentSkill === "laser"){

        if(now - shootTimer > 700){

            shootTimer = now;

            laserAttack();
        }
    }

    else if(currentSkill === "lightning"){

        if(now - shootTimer > 650){

            shootTimer = now;

            lightningAttack();
        }
    }

    else if(currentSkill === "ice"){

        if(now - shootTimer > 900){

            shootTimer = now;

            iceAttack();
        }
    }
}

/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayerMovement(dt){

    let dx = 0;
    let dy = 0;

    if(input.left) dx--;
    if(input.right) dx++;
    if(input.up) dy--;
    if(input.down) dy++;

    if(dx !== 0 || dy !== 0){

        const length =
            Math.sqrt(dx*dx+dy*dy);

        dx /= length;
        dy /= length;

        player.x +=
            dx*CONFIG.PLAYER_SPEED*dt;

        player.y +=
            dy*CONFIG.PLAYER_SPEED*dt;
    }

    clampPlayer();
    updatePlayer();
}

/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener("keydown",e=>{

    if(
        ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "]
        .includes(e.key)
    ){
        e.preventDefault();
    }

    if(e.key === "ArrowLeft" || e.key.toLowerCase()==="a")
        input.left=true;

    if(e.key === "ArrowRight" || e.key.toLowerCase()==="d")
        input.right=true;

    if(e.key === "ArrowUp" || e.key.toLowerCase()==="w")
        input.up=true;

    if(e.key === "ArrowDown" || e.key.toLowerCase()==="s")
        input.down=true;
});

window.addEventListener("keyup",e=>{

    if(e.key === "ArrowLeft" || e.key.toLowerCase()==="a")
        input.left=false;

    if(e.key === "ArrowRight" || e.key.toLowerCase()==="d")
        input.right=false;

    if(e.key === "ArrowUp" || e.key.toLowerCase()==="w")
        input.up=false;

    if(e.key === "ArrowDown" || e.key.toLowerCase()==="s")
        input.down=false;
});

/* =========================================================
   MOBILE BUTTONS
========================================================= */

function setupButton(id,key){

    const btn = document.getElementById(id);

    const start = e=>{
        e.preventDefault();
        input[key]=true;
    };

    const stop = e=>{
        e.preventDefault();
        input[key]=false;
    };

    btn.addEventListener("pointerdown",start);
    btn.addEventListener("pointerup",stop);
    btn.addEventListener("pointercancel",stop);
    btn.addEventListener("pointerleave",stop);
}

setupButton("left","left");
setupButton("right","right");
setupButton("up","up");
setupButton("down","down");

/* =========================================================
   SKILL BUTTONS
========================================================= */

document.querySelectorAll(".skillBtn").forEach(btn=>{

    btn.addEventListener("click",()=>{

        if(!running) return;

        useSkill(btn.dataset.skill);
    });
});

/* =========================================================
   GAME START
========================================================= */

function startGame(){

    /*
       Dọn toàn bộ entity cũ.
    */

    [...game.querySelectorAll(
        ".enemy,.bomb,.fruit,.projectile,.fireball,.laser,.lightning,.iceEffect,.explosion"
    )].forEach(e=>e.remove());

    enemies=[];
    projectiles=[];
    bombs=[];
    fruits=[];
    effects=[];
    frozenEnemies.clear();

    score=0;
    hp=CONFIG.START_HP;
    level=1;

    currentSkill=null;
    skillUntil=0;

    spawnTimer=0;
    fruitTimer=0;
    bombTimer=0;
    shootTimer=0;
    damageCooldown=0;

    scoreEl.textContent="0";
    hpEl.textContent=hp;
    levelEl.textContent="1";
    skillEl.textContent="Không";

    resetPlayer();

    startScreen.style.display="none";
    gameOverScreen.style.display="none";

    running=true;

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);
}

/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

    if(!running) return;

    running=false;

    finalScoreEl.textContent=score;

    if(score > highScore){

        highScore=score;

        localStorage.setItem(
            "nequai_highscore",
            highScore
        );
    }

    highScoreEl.textContent=highScore;
    finalHighEl.textContent=highScore;

    /*
       THÔNG BÁO ĐẶC BIỆT KHI THUA.
    */

    if(score >= 500){

        setTimeout(()=>{
            showMessage(
                "😳 Ơ hay thằng này giỏi thế!",
                2500
            );
        },300);
    }
    else if(score >= 200){

        setTimeout(()=>{
            showMessage(
                "🐔 Gà thế!",
                1800
            );
        },300);
    }

    gameOverScreen.style.display="flex";
}

/* =========================================================
   MAIN GAME LOOP
========================================================= */

function gameLoop(now){

    if(!running) return;

    /*
       QUAN TRỌNG:
       Giới hạn delta time.
       Nếu tab bị lag/đứng một lúc thì game không
       chạy một bước khổng lồ gây lỗi.
    */

    let dt =
        Math.min((now-lastTime)/1000,0.033);

    lastTime=now;

    damageCooldown =
        Math.max(0,damageCooldown-dt*1000);

    updatePlayerMovement(dt);

    updateSkill(now);

    updateSkillAttack(now);

    spawnTimer += dt;
    fruitTimer += dt;
    bombTimer += dt;

    /*
       Spawn quái.
       Khi màn càng cao thì spawn nhanh hơn nhưng
       vẫn bị giới hạn MAX_ENEMIES.
    */

    const spawnDelay =
        Math.max(0.35,1.15-level*0.025);

    if(spawnTimer >= spawnDelay){

        spawnTimer=0;

        createEnemy();
    }

    /*
       Trái cây
    */

    if(fruitTimer >= 5){

        fruitTimer=0;

        createFruit();
    }

    /*
       Bom
    */

    if(bombTimer >= 7){

        bombTimer=0;

        createBomb();
    }

    updateEnemies(dt,now);
    updateProjectiles(dt);
    updateBombs(dt);
    updateFruits(dt);
    updateEffects(dt);

    cleanup();

    requestAnimationFrame(gameLoop);
}

/* =========================================================
   START BUTTON
========================================================= */

startBtn.addEventListener("click",startGame);

restartBtn.addEventListener("click",startGame);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener("resize",()=>{

    if(!running) return;

    clampPlayer();
    updatePlayer();
});

/* =========================================================
   KHỞI TẠO
========================================================= */

resetPlayer();
</script>
