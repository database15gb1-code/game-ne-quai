<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Né Quái - Minecraft Demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;text-align:center}
.wrap{max-width:820px;margin:18px auto;padding:12px}
h1{margin:8px 0 12px}
.top{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.stat{background:#1d2a42;border:1px solid #394968;border-radius:10px;padding:8px 12px}
canvas{width:100%;max-width:760px;border:2px solid #394968;border-radius:12px;background:#18243a;touch-action:none}
button{font-size:18px;padding:11px 18px;margin:6px 3px;border:0;border-radius:10px;cursor:pointer}
#start{background:#67d36b}
.move{background:#dce6f5}
.skillBtn{background:#ffd166}
.panel{margin:12px auto;padding:12px;background:#172238;border:1px solid #394968;border-radius:12px;text-align:left}
.panel h2{margin:0 0 8px;text-align:center;font-size:20px}
#leaderboard{margin:0;padding-left:28px}
#leaderboard li{padding:3px 0}
.small{opacity:.78;font-size:14px}
#message{min-height:22px;font-weight:bold}
</style>
</head>

<body>
<div class="wrap">

<h1>🎮 Né Quái</h1>

<div class="top">
  <div class="stat">🏆 Điểm: <span id="score">0</span></div>
  <div class="stat">❤️ Máu: <span id="hp">3</span></div>
  <div class="stat">✨ Skill: <span id="skill">Không</span></div>
</div>

<canvas id="game" width="760" height="440"></canvas>

<div>
  <button id="start">▶ Bắt đầu</button>
</div>

<div>
  <button class="move" id="left">←</button>
  <button class="move" id="right">→</button>
</div>

<p id="message"></p>

<p class="small">
PC: ← → hoặc A/D. Điện thoại: giữ ← →.
Ăn 🍎 để nhận skill ngẫu nhiên.
</p>

<div class="panel">
  <h2>🏆 Bảng xếp hạng</h2>
  <ol id="leaderboard"></ol>
  <p class="small">
    Bảng xếp hạng được lưu trên trình duyệt của thiết bị này.
  </p>
</div>

</div>

<script>
const c=document.getElementById("game");
const x=c.getContext("2d");

const scoreEl=document.getElementById("score");
const hpEl=document.getElementById("hp");
const skillEl=document.getElementById("skill");
const messageEl=document.getElementById("message");
const startBtn=document.getElementById("start");
const leaderboardEl=document.getElementById("leaderboard");

let p,enemies,bombs,fruits,bullets,particles;

let score,hp,running=false,last,spawn,bombSpawn,fruitSpawn,shootTimer;

let skill="Không";
let skillTime=0;
let laserTime=0;

let keys={},raf;

const SKILLS=[
  "Bắn nhanh",
  "Tia laser",
  "Khiên",
  "🔥 Phun lửa",
  "⚡ Tia điện",
  "❄️ Tia băng"
];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const rand=(a,b)=>a+Math.random()*(b-a);

function say(t){

  messageEl.textContent=t;

  clearTimeout(say.t);

  say.t=setTimeout(()=>{
    messageEl.textContent="";
  },1800);
}

function hit(a,b){

  return Math.hypot(a.x-b.x,a.y-b.y)
  <
  (a.r||22)+(b.r||22);
}

function boom(px,py,kind="normal"){

  for(let i=0;i<22;i++){

    particles.push({

      x:px,
      y:py,

      vx:rand(-180,180),
      vy:rand(-180,180),

      life:.65,
      kind
    });
  }
}

function reset(){

  p={
    x:380,
    y:390,
    w:42,
    h:24,
    s:340,
    r:20
  };

  enemies=[];
  bombs=[];
  fruits=[];
  bullets=[];
  particles=[];

  score=0;
  hp=3;

  spawn=.4;
  bombSpawn=5;
  fruitSpawn=5;
  shootTimer=0;

  skill="Không";
  skillTime=0;
  laserTime=0;

  scoreEl.textContent="0";
  hpEl.textContent="3";
  skillEl.textContent="Không";

  draw();
}

function chooseSkill(){

  skill=
    SKILLS[
      Math.floor(
        Math.random()*SKILLS.length
      )
    ];

  skillTime=10;

  laserTime=
    skill==="Tia laser"
    ?2.5
    :0;

  skillEl.textContent=
    skill+" 10s";

  say("🍎 Nhận skill: "+skill+"!");
}

function saveScore(){

  const name=
    (
      prompt(
        "🎉 Bạn đạt "+
        Math.floor(score)+
        " điểm!\nNhập tên để lưu bảng xếp hạng:",
        "Người chơi"
      )
      ||
      "Người chơi"
    )
    .trim()
    .slice(0,18)
    ||
    "Người chơi";

  let data=
    JSON.parse(
      localStorage.getItem("neQuaiScores")
      ||
      "[]"
    );

  data.push({
    name,
    score:Math.floor(score),
    date:Date.now()
  });

  data.sort(
    (a,b)=>b.score-a.score
  );

  data=data.slice(0,10);

  localStorage.setItem(
    "neQuaiScores",
    JSON.stringify(data)
  );

  renderLeaderboard();
}

function renderLeaderboard(){

  const data=
    JSON.parse(
      localStorage.getItem("neQuaiScores")
      ||
      "[]"
    );

  leaderboardEl.innerHTML="";

  if(!data.length){

    leaderboardEl.innerHTML=
      "<li>Chưa có điểm. Hãy chơi một ván!</li>";

    return;
  }

  data.forEach((r,i)=>{

    const li=
      document.createElement("li");

    li.textContent=
      `${r.name} — ${r.score} điểm`;

    leaderboardEl.appendChild(li);
  });
}

function gameOver(){

  running=false;

  startBtn.textContent="🔄 Chơi lại";

  say(
    "💀 GAME OVER — "+
    Math.floor(score)+
    " điểm"
  );

  saveScore();
}

function spawnEnemy(){

  const types=[

    {
      kind:"normal",
      color:"#d94f4f",
      r:17,
      v:rand(95,145)
    },

    {
      kind:"fast",
      color:"#ff9f43",
      r:14,
      v:rand(155,205)
    },

    {
      kind:"tank",
      color:"#9b59b6",
      r:24,
      v:rand(65,95),
      hp:2
    }

  ];

  const t=
    types[
      Math.floor(
        Math.random()*types.length
      )
    ];

  enemies.push({

    x:rand(28,732),
    y:-30,

    r:t.r,
    v:t.v,

    color:t.color,

    kind:t.kind,

    hp:t.hp||1
  });
}

function shoot(kind="normal"){

  bullets.push({

    x:p.x,
    y:p.y-22,

    r:5,
    v:520,

    kind
  });
}

function killEnemy(
  i,
  points=5,
  effect="normal"
){

  const e=enemies[i];

  boom(
    e.x,
    e.y,
    effect
  );

  enemies.splice(i,1);

  score+=points;
}

function applySkillToEnemy(i){

  const e=enemies[i];

  if(skill==="🔥 Phun lửa"){

    killEnemy(
      i,
      8,
      "fire"
    );

    return true;
  }

  if(skill==="⚡ Tia điện"){

    killEnemy(
      i,
      10,
      "electric"
    );

    for(
      let j=enemies.length-1;
      j>=0;
      j--
    ){

      if(
        Math.hypot(
          e.x-enemies[j].x,
          e.y-enemies[j].y
        )<115
      ){

        killEnemy(
          j,
          8,
          "electric"
        );

        break;
      }
    }

    return true;
  }

  if(skill==="❄️ Tia băng"){

    e.v=Math.min(
      e.v,
      35
    );

    e.frozen=true;

    e.freeze=2.5;

    return true;
  }

  return false;
}

function update(dt){

  score+=dt*2;

  spawn-=dt;
  bombSpawn-=dt;
  fruitSpawn-=dt;
  shootTimer-=dt;

  if(skill!=="Không"){

    skillTime-=dt;

    if(skillTime<=0){

      skill="Không";

      skillTime=0;
      laserTime=0;

      skillEl.textContent="Không";
    }
  }

  if(spawn<=0){

    spawnEnemy();

    spawn=
      Math.max(
        .24,
        .72-score*.0025
      );
  }

  if(bombSpawn<=0){

    bombs.push({

      x:rand(35,725),
      y:-25,

      r:16,
      v:rand(180,250)
    });

    bombSpawn=
      rand(7,11);
  }

  if(fruitSpawn<=0){

    fruits.push({

      x:rand(35,725),
      y:-25,

      r:16,
      v:70
    });

    fruitSpawn=
      rand(7,12);
  }

  if(keys.left||keys.a)
    p.x-=p.s*dt;

  if(keys.right||keys.d)
    p.x+=p.s*dt;

  p.x=
    clamp(
      p.x,
      28,
      732
    );

  let rate=
    skill==="Bắn nhanh"
    ?.12
    :.42;

  if(skill==="Tia laser")
    rate=.30;

  if(shootTimer<=0){

    shoot(
      skill==="🔥 Phun lửa"
      ?"fire"
      :
      skill==="⚡ Tia điện"
      ?"electric"
      :
      skill==="❄️ Tia băng"
      ?"ice"
      :
      "normal"
    );

    shootTimer=rate;
  }

  enemies.forEach(e=>{

    if(e.frozen){

      e.freeze-=dt;

      if(e.freeze<=0){

        e.frozen=false;

        e.v=
          e.baseV||
          e.v;
      }
    }

    e.y+=
      (
        e.frozen
        ?e.v*.18
        :e.v
      )*dt;
  });

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const e=enemies[i];

    if(
      Math.hypot(
        p.x-e.x,
        p.y-e.y
      )
      <
      p.r+e.r
    ){

      if(
        skill==="Khiên" &&
        skillTime>0
      ){

        killEnemy(
          i,
          6,
          "shield"
        );

      }else{

        enemies.splice(i,1);

        hp--;

        hpEl.textContent=hp;

        boom(
          p.x,
          p.y,
          "hit"
        );

        if(hp<=0){

          gameOver();

          return;
        }
      }

    }else if(e.y>465){

      enemies.splice(i,1);
    }
  }

  for(
    let i=bombs.length-1;
    i>=0;
    i--
  ){

    const b=bombs[i];

    b.y+=b.v*dt;

    let exploded=false;

    for(
      let j=enemies.length-1;
      j>=0;
      j--
    ){

      const e=enemies[j];

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )
        <
        b.r+e.r+8
      ){

        killEnemy(
          j,
          10,
          "bomb"
        );

        exploded=true;
      }
    }

    if(
      Math.hypot(
        b.x-p.x,
        b.y-p.y
      )
      <
      b.r+20
    ){

      if(
        skill==="Khiên" &&
        skillTime>0
      ){

        boom(
          b.x,
          b.y,
          "shield"
        );

        bombs.splice(i,1);

        continue;
      }

      hp--;

      hpEl.textContent=hp;

      boom(
        b.x,
        b.y,
        "hit"
      );

      bombs.splice(i,1);

      if(hp<=0){

        gameOver();

        return;
      }

      continue;
    }

    if(
      exploded||
      b.y>465
    ){

      bombs.splice(i,1);
    }
  }

  for(
    let i=fruits.length-1;
    i>=0;
    i--
  ){

    const f=fruits[i];

    f.y+=f.v*dt;

    if(
      Math.hypot(
        f.x-p.x,
        f.y-p.y
      )
      <
      f.r+22
    ){

      chooseSkill();

      fruits.splice(i,1);

    }else if(f.y>465){

      fruits.splice(i,1);
    }
  }

  for(
    let i=bullets.length-1;
    i>=0;
    i--
  ){

    const b=bullets[i];

    b.y-=b.v*dt;

    if(b.y<-30){

      bullets.splice(i,1);

      continue;
    }

    for(
      let j=enemies.length-1;
      j>=0;
      j--
    ){

      const e=enemies[j];

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )
        <
        b.r+e.r
      ){

        if(b.kind==="ice"){

          e.frozen=true;

          e.freeze=3;

          e.baseV=
            e.baseV||
            e.v;

          e.v=25;

          boom(
            e.x,
            e.y,
            "ice"
          );

          bullets.splice(i,1);

          break;
        }

        if(b.kind==="fire"){

          killEnemy(
            j,
            8,
            "fire"
          );

          bullets.splice(i,1);

          break;
        }

        if(b.kind==="electric"){

          applySkillToEnemy(j);

          bullets.splice(i,1);

          break;
        }

        if(e.hp>1){

          e.hp--;

          boom(
            e.x,
            e.y,
            "normal"
          );

          bullets.splice(i,1);

          break;
        }

        killEnemy(
          j,
          5,
          "normal"
        );

        bullets.splice(i,1);

        break;
      }
    }
  }

  if(
    skill==="Tia laser" &&
    laserTime>0
  ){

    for(
      let i=enemies.length-1;
      i>=0;
      i--
    ){

      if(
        Math.abs(
          enemies[i].x-p.x
        )<32
      ){

        killEnemy(
          i,
          7,
          "laser"
        );
      }
    }
  }

  particles.forEach(q=>{

    q.x+=q.vx*dt;
    q.y+=q.vy*dt;

    q.life-=dt;
  });

  particles=
    particles.filter(
      q=>q.life>0
    );

  scoreEl.textContent=
    Math.floor(score);
}

function draw(){

  x.clearRect(
    0,
    0,
    c.width,
    c.height
  );

  x.fillStyle="#18243a";

  x.fillRect(
    0,
    0,
    c.width,
    c.height
  );

  x.fillStyle="#22324d";

  for(
    let i=0;
    i<14;
    i++
  ){

    x.fillRect(
      i*60,
      0,
      1,
      c.height
    );
  }

  x.fillStyle="#4d7c59";

  x.fillRect(
    0,
    415,
    760,
    25
  );

  x.fillStyle="#77b255";

  x.fillRect(
    0,
    415,
    760,
    4
  );

  x.fillStyle="#77b255";

  x.fillRect(
    p.x-21,
    p.y-12,
    42,
    24
  );

  x.fillStyle="#fff";

  x.fillRect(
    p.x-12,
    p.y-5,
    7,
    7
  );

  x.fillRect(
    p.x+5,
    p.y-5,
    7,
    7
  );

  if(
    skill==="Khiên" &&
    skillTime>0
  ){

    x.strokeStyle="#72edff";

    x.lineWidth=4;

    x.beginPath();

    x.arc(
      p.x,
      p.y,
      34,
      0,
      Math.PI*2
    );

    x.stroke();
  }

  if(
    skill==="Tia laser" &&
    laserTime>0
  ){

    x.fillStyle=
      "rgba(255,80,220,.35)";

    x.fillRect(
      p.x-30,
      0,
      60,
      415
    );

    x.fillStyle="#ff8af0";

    x.fillRect(
      p.x-5,
      0,
      10,
      415
    );
  }

  enemies.forEach(e=>{

    x.fillStyle=
      e.frozen
      ?" #8fe8ff".trim()
      :e.color;

    x.beginPath();

    x.arc(
      e.x,
      e.y,
      e.r,
      0,
      Math.PI*2
    );

    x.fill();

    x.fillStyle="#111";

    x.fillRect(
      e.x-e.r*.45,
      e.y-e.r*.25,
      5,
      5
    );

    x.fillRect(
      e.x+e.r*.15,
      e.y-e.r*.25,
      5,
      5
    );

    if(e.kind==="tank"){

      x.strokeStyle="#e1b6ff";

      x.lineWidth=2;

      x.stroke();
    }

    if(e.frozen){

      x.strokeStyle="#b9f3ff";

      x.lineWidth=3;

      x.stroke();
    }
  });

  bombs.forEach(b=>{

    x.fillStyle="#252525";

    x.beginPath();

    x.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    x.fill();

    x.fillStyle="#ffb52e";

    x.fillRect(
      b.x-2,
      b.y-b.r-7,
      4,
      7
    );
  });

  fruits.forEach(f=>{

    x.font="28px Arial";

    x.textAlign="center";

    x.fillText(
      "🍎",
      f.x,
      f.y+9
    );
  });

  bullets.forEach(b=>{

    const colors={

      fire:"#ff6b35",
      electric:"#ffe66d",
      ice:"#8fe8ff",
      normal:"#ffe66b"
    };

    x.fillStyle=
      colors[b.kind]||
      "#ffe66b";

    x.beginPath();

    x.arc(
      b.x,
      b.y,
      5,
      0,
      Math.PI*2
    );

    x.fill();
  });

  particles.forEach(q=>{

    const colors={

      fire:"#ff6b35",
      electric:"#ffe66d",
      ice:"#8fe8ff",
      laser:"#ff8af0",
      shield:"#72edff",
      bomb:"#ffb52e",
      hit:"#ff4d6d",
      normal:"#ffd166"
    };

    x.fillStyle=
      colors[q.kind]||
      "#ffd166";

    x.fillRect(
      q.x,
      q.y,
      4,
      4
    );
  });

  x.fillStyle="#fff";

  x.font="16px Arial";

  x.textAlign="left";

  x.fillText(
    "🍎 Ăn trái cây để nhận skill ngẫu nhiên",
    18,
    26
  );
}

function loop(now){

  if(!running)
    return;

  const dt=
    Math.min(
      .033,
      (now-last)/1000
    );

  last=now;

  update(dt);

  draw();

  raf=
    requestAnimationFrame(loop);
}

function start(){

  cancelAnimationFrame(raf);

  reset();

  running=true;

  startBtn.textContent=
    "⏹ Đang chơi";

  last=
    performance.now();

  raf=
    requestAnimationFrame(loop);
}

startBtn.onclick=()=>{

  if(!running)
    start();
};

function hold(id,k){

  const b=
    document.getElementById(id);

  const down=e=>{

    e.preventDefault();

    keys[k]=true;
  };

  const up=e=>{

    e.preventDefault();

    keys[k]=false;
  };

  b.addEventListener(
    "pointerdown",
    down
  );

  [
    "pointerup",
    "pointerleave",
    "pointercancel"
  ]
  .forEach(
    ev=>
      b.addEventListener(
        ev,
        up
      )
  );
}

hold("left","left");

hold("right","right");

onkeydown=e=>{

  if(e.key==="ArrowLeft")
    keys.left=true;

  if(e.key==="ArrowRight")
    keys.right=true;

  if(e.key.toLowerCase()==="a")
    keys.a=true;

  if(e.key.toLowerCase()==="d")
    keys.d=true;
};

onkeyup=e=>{

  if(e.key==="ArrowLeft")
    keys.left=false;

  if(e.key==="ArrowRight")
    keys.right=false;

  if(e.key.toLowerCase()==="a")
    keys.a=false;

  if(e.key.toLowerCase()==="d")
    keys.d=false;
};

renderLeaderboard();

reset();

</script>

</body>
</html>
