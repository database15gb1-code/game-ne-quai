
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Né Quái</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#101827;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow-x:hidden;
    touch-action:manipulation;
}

.wrap{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:8px;
}

h1{
    margin:6px 0 8px;
    font-size:28px;
}

.top{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:8px;
    font-size:15px;
}

.info{
    background:#1d2a42;
    border:1px solid #33476b;
    border-radius:10px;
    padding:7px 10px;
}

canvas{
    display:block;
    width:100%;
    max-width:720px;
    height:auto;
    margin:auto;

    border:3px solid #394968;
    border-radius:12px;

    background:#18243a;

    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

button{
    border:0;
    border-radius:14px;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

#start{
    background:#62d86d;
    color:#07110a;
    font-size:18px;
    font-weight:bold;
    padding:12px 28px;
    margin:10px 0;
}

#start:active{
    transform:scale(.96);
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:4px;
}

.move{
    width:110px;
    height:78px;

    background:#e1e9f5;
    color:#172238;

    font-size:42px;
    font-weight:bold;

    box-shadow:0 5px 0 #9eacbf;
}

.move:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 #9eacbf;
}

.small{
    margin:8px 0;
    opacity:.7;
    font-size:13px;
}

#message{
    position:fixed;

    left:50%;
    top:43%;

    transform:
        translate(-50%,-50%)
        scale(.4);

    width:96%;

    font-size:clamp(27px,7vw,60px);

    font-weight:900;

    text-align:center;

    opacity:0;

    pointer-events:none;

    z-index:9999;

    text-shadow:
        0 4px 0 #000,
        0 0 15px #fff,
        0 0 30px #fff;
}

#message.show{
    animation:messagePop 2.5s ease forwards;
}

@keyframes messagePop{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.4);
    }

    12%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.12);
    }

    25%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.92);
    }
}

@media(max-width:500px){

    h1{
        font-size:23px;
    }

    .top{
        font-size:13px;
        gap:5px;
    }

    .info{
        padding:5px 7px;
    }

    .move{
        width:110px;
        height:78px;
        font-size:42px;
    }
}
</style>
</head>

<body>

<div class="wrap">

<h1>🎮 Né Quái</h1>

<div class="top">

    <div class="info">
        ⭐ Điểm:
        <span id="score">0</span>
    </div>

    <div class="info">
        🏆 Kỷ lục:
        <span id="best">0</span>
    </div>

    <div class="info">
        ❤️ HP:
        <span id="hp">3</span>
    </div>

    <div class="info">
        ✨ Skill:
        <span id="skill">Không</span>
    </div>

</div>

<canvas
    id="game"
    width="720"
    height="420">
</canvas>

<button id="start">
    🔄 Chơi lại
</button>

<div class="controls">

    <button class="move" id="left">
        ⬅️
    </button>

    <button class="move" id="right">
        ➡️
    </button>

</div>

<p class="small">
    📱 Điện thoại: giữ ⬅️ ➡️ để di chuyển<br>
    🖥️ PC: dùng ← → hoặc A / D
</p>

</div>

<div id="message"></div>


<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 720;
const H = 420;


/* =====================================================
   UI
===================================================== */

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const hpEl = document.getElementById("hp");
const skillEl = document.getElementById("skill");
const messageEl = document.getElementById("message");
const startButton = document.getElementById("start");


/* =====================================================
   LOCAL STORAGE AN TOÀN
===================================================== */

function loadBest(){

    try{

        const value =
            Number(
                localStorage.getItem("neQuaiBest")
            );

        return Number.isFinite(value)
            ? value
            : 0;

    }catch(error){

        return 0;
    }
}


function saveBest(value){

    try{

        localStorage.setItem(
            "neQuaiBest",
            String(value)
        );

    }catch(error){

        /*
           Nếu trình duyệt chặn localStorage
           game vẫn tiếp tục chạy bình thường.
        */
    }
}


let bestScore = loadBest();

bestEl.textContent = bestScore;


/* =====================================================
   GAME OBJECTS
===================================================== */

let player = null;

let enemies = [];
let bombs = [];
let fruits = [];
let bullets = [];
let particles = [];


/* =====================================================
   GAME STATE
===================================================== */

let score = 0;
let hp = 3;

let running = false;

let lastTime = 0;
let animationId = 0;

let restartTimer = null;


/* =====================================================
   SPAWN TIMER
===================================================== */

let enemyTimer = .5;
let bombTimer = 5;
let fruitTimer = 6;
let shootTimer = .3;


/* =====================================================
   SKILL
===================================================== */

let currentSkill = "Không";
let skillTime = 0;


/* =====================================================
   MỐC ĐIỂM
===================================================== */

let reached200 = false;
let reached500 = false;


/* =====================================================
   ĐIỀU KHIỂN
===================================================== */

const keys = {
    left:false,
    right:false
};


/* =====================================================
   GIỚI HẠN CHỐNG LAG
===================================================== */

const MAX_ENEMIES = 18;
const MAX_BOMBS = 3;
const MAX_FRUITS = 3;
const MAX_BULLETS = 24;
const MAX_PARTICLES = 75;


/* =====================================================
   RESET GAME
===================================================== */

function resetGame(){

    player = {

        x:W / 2,

        y:H - 45,

        width:42,

        height:25,

        speed:330
    };


    enemies.length = 0;
    bombs.length = 0;
    fruits.length = 0;
    bullets.length = 0;
    particles.length = 0;


    score = 0;
    hp = 3;


    enemyTimer = .5;
    bombTimer = 5;
    fruitTimer = 6;
    shootTimer = .3;


    currentSkill = "Không";
    skillTime = 0;


    reached200 = false;
    reached500 = false;


    keys.left = false;
    keys.right = false;


    updateUI();
    draw();
}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    scoreEl.textContent =
        Math.floor(score);

    hpEl.textContent =
        hp;

    if(currentSkill === "Không"){

        skillEl.textContent = "Không";

    }else{

        skillEl.textContent =
            currentSkill +
            " " +
            Math.ceil(skillTime) +
            "s";
    }
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

    messageEl.classList.remove("show");

    void messageEl.offsetWidth;

    messageEl.textContent = text;

    messageEl.classList.add("show");
}


/* =====================================================
   SCORE
===================================================== */

function updateScore(){

    const current =
        Math.floor(score);


    scoreEl.textContent = current;


    /*
       LƯU KỶ LỤC
    */

    if(current > bestScore){

        bestScore = current;

        saveBest(bestScore);

        bestEl.textContent = bestScore;
    }


    /*
       200 ĐIỂM
    */

    if(
        current >= 200 &&
        !reached200
    ){

        reached200 = true;

        showMessage(
            "🐔 ÔI GÀ THẾ!"
        );
    }


    /*
       500 ĐIỂM
    */

    if(
        current >= 500 &&
        !reached500
    ){

        reached500 = true;

        showMessage(
            "😳 Ơ HAY, THẰNG NÀY GIỎI THẾ!"
        );
    }
}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    amount = 8
){

    const available =
        MAX_PARTICLES -
        particles.length;

    const count =
        Math.min(
            amount,
            Math.max(0,available)
        );


    for(let i=0;i<count;i++){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*180,

            vy:
                (Math.random()-.5)*180,

            life:
                .25 +
                Math.random()*.35
        });
    }
}


/* =====================================================
   PLAYER - ENEMY COLLISION
===================================================== */

function enemyHitsPlayer(e){

    return (

        Math.abs(
            player.x - e.x
        )

        <

        (
            player.width/2 +
            e.size/2
        )

    )

    &&

    (

        Math.abs(
            player.y - e.y
        )

        <

        (
            player.height/2 +
            e.size/2
        )
    );
}


/* =====================================================
   SPAWN ENEMY
   QUÁI RƠI TỪ TRÊN XUỐNG
===================================================== */

function spawnEnemy(){

    if(
        enemies.length >=
        MAX_ENEMIES
    ){

        return;
    }


    const types = [

        {
            size:26,
            speed:110,
            hp:1
        },

        {
            size:34,
            speed:85,
            hp:2
        },

        {
            size:22,
            speed:155,
            hp:1
        }
    ];


    const type =
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];


    enemies.push({

        x:
            25 +
            Math.random() *
            (W-50),

        y:-35,

        size:type.size,

        speed:
            type.speed +
            Math.min(
                score*.35,
                100
            ),

        hp:type.hp,

        frozen:0,

        freezeKillTimer:0
    });
}


/* =====================================================
   BOM
===================================================== */

function spawnBomb(){

    if(
        bombs.length >=
        MAX_BOMBS
    ){

        return;
    }


    bombs.push({

        x:
            25 +
            Math.random() *
            (W-50),

        y:-30,

        radius:15,

        speed:
            180 +
            Math.random()*70
    });
}


/* =====================================================
   FRUIT
===================================================== */

function spawnFruit(){

    if(
        fruits.length >=
        MAX_FRUITS
    ){

        return;
    }


    const random =
        Math.random();


    /*
       🌈 0.1%
    */

    if(random < .001){

        fruits.push({

            x:
                25 +
                Math.random()*(W-50),

            y:-25,

            speed:65,

            type:"rainbow"
        });

        return;
    }


    /*
       ❤️ 0.1%
    */

    if(random < .002){

        fruits.push({

            x:
                25 +
                Math.random()*(W-50),

            y:-25,

            speed:65,

            type:"heal"
        });

        return;
    }


    /*
       🍎 SKILL
    */

    fruits.push({

        x:
            25 +
            Math.random()*(W-50),

        y:-25,

        speed:65,

        type:"normal"
    });
}


/* =====================================================
   SKILLS
===================================================== */

const skillList = [

    "🔥 Phun lửa",
    "⚡ Tia điện",
    "❄️ Tia băng",
    "🔫 Bắn nhanh",
    "🛡️ Khiên",
    "🔆 Laser"
];


function giveRandomSkill(){

    currentSkill =
        skillList[
            Math.floor(
                Math.random() *
                skillList.length
            )
        ];


    skillTime = 15;


    showMessage(currentSkill);

    updateUI();
}


/* =====================================================
   KILL ENEMY
===================================================== */

function killEnemy(index){

    if(
        index < 0 ||
        index >= enemies.length
    ){

        return;
    }


    const e = enemies[index];


    createParticles(
        e.x,
        e.y,
        7
    );


    enemies.splice(index,1);


    score += 3;
}


/* =====================================================
   DAMAGE PLAYER
===================================================== */

function damagePlayer(){

    /*
       KHIÊN
    */

    if(
        currentSkill ===
        "🛡️ Khiên"
    ){

        createParticles(
            player.x,
            player.y,
            4
        );

        return;
    }


    hp--;

    hpEl.textContent = hp;


    createParticles(
        player.x,
        player.y,
        8
    );


    if(hp <= 0){

        gameOver();
    }
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    if(!running){
        return;
    }


    running = false;


    cancelAnimationFrame(
        animationId
    );


    updateScore();


    showMessage(
        "💀 HẾT MÁU!"
    );


    /*
       TỰ ĐỘNG CHƠI LẠI
    */

    clearTimeout(restartTimer);


    restartTimer =
        setTimeout(
            () => {

                startGame();

            },
            1600
        );
}


/* =====================================================
   PLAYER
   CHỈ TRÁI / PHẢI
===================================================== */

function updatePlayer(dt){

    if(keys.left){

        player.x -=
            player.speed * dt;
    }


    if(keys.right){

        player.x +=
            player.speed * dt;
    }


    player.x =
        Math.max(

            player.width/2,

            Math.min(

                W -
                player.width/2,

                player.x
            )
        );
}


/* =====================================================
   ENEMY UPDATE
===================================================== */

function updateEnemies(dt){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e =
            enemies[i];


        /*
           ĐANG ĐÓNG BĂNG
        */

        if(e.frozen > 0){

            e.frozen -= dt;

        }else{

            e.y +=
                e.speed * dt;
        }


        /*
           ĐỤNG PLAYER
        */

        if(
            enemyHitsPlayer(e)
        ){

            if(
                currentSkill ===
                "🛡️ Khiên"
            ){

                killEnemy(i);

                continue;
            }


            enemies.splice(i,1);

            damagePlayer();


            if(!running){
                return;
            }


            continue;
        }


        /*
           RA KHỎI MÀN
        */

        if(
            e.y > H+50
        ){

            enemies.splice(i,1);
        }
    }
}


/* =====================================================
   BOM
   CHỈ GÂY DAMAGE PLAYER
===================================================== */

function updateBombs(dt){

    for(
        let i=bombs.length-1;
        i>=0;
        i--
    ){

        const b =
            bombs[i];


        b.y +=
            b.speed*dt;


        /*
           QUAN TRỌNG:

           KHÔNG KIỂM TRA BOM - QUÁI

           => BOM KHÔNG ẢNH HƯỞNG QUÁI
        */


        const distance =
            Math.hypot(

                b.x-player.x,

                b.y-player.y
            );


        /*
           CHỈ PLAYER
        */

        if(
            distance <
            b.radius+20
        ){

            createParticles(
                b.x,
                b.y,
                12
            );


            damagePlayer();


            bombs.splice(i,1);


            if(!running){
                return;
            }


            continue;
        }


        if(
            b.y > H+50
        ){

            bombs.splice(i,1);
        }
    }
}


/* =====================================================
   FRUIT UPDATE
===================================================== */

function updateFruits(dt){

    for(
        let i=fruits.length-1;
        i>=0;
        i--
    ){

        const f =
            fruits[i];


        f.y +=
            f.speed*dt;


        /*
           ĂN TRÁI
        */

        if(

            Math.hypot(

                f.x-player.x,

                f.y-player.y

            ) < 35

        ){

            /*
               🌈
            */

            if(
                f.type ===
                "rainbow"
            ){

                currentSkill =
                    "🌈 7 Sắc";

                skillTime = 25;

                showMessage(
                    "🌈 7 SẮC CẦU VỒNG!"
                );
            }


            /*
               ❤️
            */

            else if(
                f.type ===
                "heal"
            ){

                hp =
                    Math.min(
                        3,
                        hp+1
                    );

                hpTextUpdate();

                showMessage(
                    "❤️ +1 HP!"
                );
            }


            /*
               🍎
            */

            else{

                giveRandomSkill();
            }


            fruits.splice(i,1);

            continue;
        }


        if(
            f.y > H+40
        ){

            fruits.splice(i,1);
        }
    }
}


/* =====================================================
   HP
===================================================== */

function hpTextUpdate(){

    hpEl.textContent = hp;
}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(
        bullets.length >=
        MAX_BULLETS
    ){

        return;
    }


    bullets.push({

        x:player.x,

        y:player.y-22,

        speed:440,

        radius:5
    });
}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];


        b.y -=
            b.speed*dt;


        if(
            b.y < -30
        ){

            bullets.splice(i,1);

            continue;
        }


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const e =
                enemies[j];


            if(

                Math.hypot(

                    b.x-e.x,

                    b.y-e.y

                )

                <

                b.radius+
                e.size/2

            ){

                e.hp--;


                createParticles(
                    e.x,
                    e.y,
                    3
                );


                bullets.splice(i,1);


                if(
                    e.hp<=0
                ){

                    killEnemy(j);
                }


                break;
            }
        }
    }
}


/* =====================================================
   SKILL ATTACK
===================================================== */

function useSkill(dt){

    if(
        currentSkill ===
        "Không"
    ){

        return;
    }


    /*
       🔥 PHUN LỬA
    */

    if(
        currentSkill ===
        "🔥 Phun lửa"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 120 &&

                player.y-e.y < 230

            ){

                killEnemy(i);
            }
        }
    }


    /*
       ⚡ ĐIỆN
    */

    if(
        currentSkill ===
        "⚡ Tia điện"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 95

            ){

                killEnemy(i);
            }
        }
    }


    /*
       ❄️ BĂNG

       Đầu tiên đóng băng.

       Sau đó đếm ngược.

       Cuối cùng tiêu diệt.
    */

    if(
        currentSkill ===
        "❄️ Tia băng"
    ){

        for(
            const e of enemies
        ){

            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 90 &&

                e.frozen <= 0 &&

                e.freezeKillTimer <= 0

            ){

                e.frozen = 1.2;

                e.freezeKillTimer = .65;
            }
        }


        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(
                e.freezeKillTimer > 0
            ){

                e.freezeKillTimer -= dt;


                if(
                    e.freezeKillTimer <= 0
                ){

                    killEnemy(i);
                }
            }
        }
    }


    /*
       🔆 LASER
    */

    if(

        currentSkill ===
        "🔆 Laser"

        ||

        currentSkill ===
        "🌈 7 Sắc"

    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 22

            ){

                killEnemy(i);
            }
        }
    }
}


/* =====================================================
   PARTICLES UPDATE
===================================================== */

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx*dt;

        p.y +=
            p.vy*dt;

        p.life -= dt;


        if(
            p.life <= 0
        ){

            particles.splice(i,1);
        }
    }
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    /*
       BACKGROUND
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle =
        "#18243a";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       GRID
    */

    ctx.strokeStyle =
        "#22324d";

    ctx.lineWidth = 1;


    for(
        let x=0;
        x<W;
        x+=60
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,H);

        ctx.stroke();
    }


    /*
       GROUND
    */

    ctx.fillStyle =
        "#4d7c59";

    ctx.fillRect(
        0,
        395,
        W,
        25
    );


    /*
       PLAYER
    */

    if(player){

        ctx.fillStyle =
            "#77b255";


        ctx.fillRect(

            player.x-
            player.width/2,

            player.y-
            player.height/2,

            player.width,

            player.height
        );


        /*
           MẮT
        */

        ctx.fillStyle =
            "#fff";


        ctx.fillRect(
            player.x-12,
            player.y-5,
            7,
            7
        );


        ctx.fillRect(
            player.x+5,
            player.y-5,
            7,
            7
        );
    }


    /*
       KHIÊN
    */

    if(
        player &&
        currentSkill ===
        "🛡️ Khiên"
    ){

        ctx.strokeStyle =
            "#72edff";

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            35,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    /*
       🔥 LỬA
    */

    if(
        player &&
        currentSkill ===
        "🔥 Phun lửa"
    ){

        const gradient =
            ctx.createRadialGradient(
                player.x,
                player.y-100,
                10,
                player.x,
                player.y-100,
                120
            );


        gradient.addColorStop(
            0,
            "rgba(255,220,50,.7)"
        );

        gradient.addColorStop(
            .5,
            "rgba(255,80,20,.3)"
        );

        gradient.addColorStop(
            1,
            "rgba(255,50,0,0)"
        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y-100,
            120,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /*
       ⚡ ĐIỆN
    */

    if(
        player &&
        currentSkill ===
        "⚡ Tia điện"
    ){

        ctx.strokeStyle =
            "#d78cff";

        ctx.lineWidth = 7;

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            0
        );

        ctx.lineTo(
            player.x,
            player.y
        );

        ctx.stroke();


        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth = 2;

        ctx.stroke();
    }


    /*
       ❄️ BĂNG
    */

    if(
        player &&
        currentSkill ===
        "❄️ Tia băng"
    ){

        ctx.strokeStyle =
            "#67e8ff";

        ctx.lineWidth = 10;

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            0
        );

        ctx.lineTo(
            player.x,
            player.y
        );

        ctx.stroke();


        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth = 3;

        ctx.stroke();
    }


    /*
       🔆 LASER / 🌈
    */

    if(
        player &&

        (
            currentSkill ===
            "🔆 Laser"

            ||

            currentSkill ===
            "🌈 7 Sắc"
        )

    ){

        ctx.strokeStyle =
            currentSkill ===
            "🌈 7 Sắc"
            ? "#ff55ff"
            : "#ff55ff";


        ctx.lineWidth = 16;

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            0
        );

        ctx.lineTo(
            player.x,
            player.y
        );

        ctx.stroke();


        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth = 4;

        ctx.stroke();
    }


    /*
       BULLETS
    */

    for(
        const b of bullets
    ){

        ctx.fillStyle =
            "#ffe66b";


        ctx.fillRect(

            b.x-3,

            b.y-8,

            6,

            12
        );
    }


    /*
       ENEMIES
    */

    for(
        const e of enemies
    ){

        let enemyColor;


        /*
           KHÔNG DÙNG MÀU ĐỎ
        */

        if(
            e.frozen > 0
        ){

            enemyColor =
                "#66ddff";

        }else if(
            e.hp >= 2
        ){

            enemyColor =
                "#9b6cff";

        }else{

            enemyColor =
                "#55c85a";
        }


        ctx.fillStyle =
            enemyColor;


        ctx.fillRect(

            e.x-
            e.size/2,

            e.y-
            e.size/2,

            e.size,

            e.size
        );


        /*
           MẮT
        */

        ctx.fillStyle =
            "#111";


        ctx.fillRect(
            e.x-9,
            e.y-7,
            6,
            6
        );

        ctx.fillRect(
            e.x+3,
            e.y-7,
            6,
            6
        );


        /*
           BĂNG
        */

        if(
            e.frozen > 0
        ){

            ctx.strokeStyle =
                "#e8fbff";

            ctx.lineWidth = 4;


            ctx.strokeRect(

                e.x-
                e.size/2-5,

                e.y-
                e.size/2-5,

                e.size+10,

                e.size+10
            );
        }
    }


    /*
       BOM
    */

    for(
        const b of bombs
    ){

        ctx.fillStyle =
            "#242424";


        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#ffb52e";


        ctx.fillRect(

            b.x-2,

            b.y-
            b.radius-
            7,

            4,

            7
        );
    }


    /*
       FRUIT
    */

    for(
        const f of fruits
    ){

        ctx.textAlign =
            "center";

        ctx.font =
            "27px Arial";


        let icon = "🍎";


        if(
            f.type ===
            "rainbow"
        ){

            icon = "🌈";

        }else if(
            f.type ===
            "heal"
        ){

            icon = "❤️";
        }


        ctx.fillText(
            icon,
            f.x,
            f.y+9
        );
    }


    /*
       PARTICLES
    */

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life/.65
            );


        ctx.fillStyle =
            "#ffd166";


        ctx.fillRect(
            p.x,
            p.y,
            4,
            4
        );
    }


    ctx.globalAlpha = 1;


    /*
       HƯỚNG DẪN
    */

    ctx.fillStyle =
        "rgba(255,255,255,.8)";

    ctx.font =
        "15px Arial";

    ctx.textAlign =
        "left";


    ctx.fillText(
        "Né quái càng lâu càng nhiều điểm!",
        15,
        25
    );
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(now){

    if(!running){
        return;
    }


    /*
       CHỐNG DT QUÁ LỚN
    */

    const dt =
        Math.min(
            .033,
            Math.max(
                0,
                (now-lastTime)/1000
            )
        );


    lastTime = now;


    /*
       PLAYER
    */

    updatePlayer(dt);


    /*
       SCORE
    */

    score += dt;

    updateScore();


    /*
       TIMERS
    */

    enemyTimer -= dt;
    bombTimer -= dt;
    fruitTimer -= dt;
    shootTimer -= dt;


    /*
       SKILL TIMER
    */

    if(
        currentSkill !==
        "Không"
    ){

        skillTime -= dt;


        if(
            skillTime <= 0
        ){

            currentSkill =
                "Không";

            skillTime = 0;
        }
    }


    /*
       QUÁI
    */

    if(
        enemyTimer <= 0
    ){

        spawnEnemy();


        enemyTimer =
            Math.max(

                .28,

                .72 -
                Math.min(
                    score/500,
                    .35
                )
            );
    }


    /*
       BOM
    */

    if(
        bombTimer <= 0
    ){

        spawnBomb();


        bombTimer =
            6 +
            Math.random()*5;
    }


    /*
       FRUIT
    */

    if(
        fruitTimer <= 0
    ){

        spawnFruit();


        fruitTimer =
            7 +
            Math.random()*6;
    }


    /*
       BẮN
    */

    let fireRate = .42;


    if(
        currentSkill ===
        "🔫 Bắn nhanh"
    ){

        fireRate = .10;
    }


    if(
        shootTimer <= 0
    ){

        shoot();

        shootTimer =
            fireRate;
    }


    /*
       SKILL
    */

    useSkill(dt);


    /*
       UPDATE
    */

    updateEnemies(dt);

    if(!running){
        return;
    }


    updateBombs(dt);

    if(!running){
        return;
    }


    updateFruits(dt);

    updateBullets(dt);

    updateParticles(dt);


    /*
       DRAW
    */

    draw();

    updateUI();


    /*
       FRAME
    */

    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    clearTimeout(restartTimer);

    cancelAnimationFrame(
        animationId
    );


    running = false;


    resetGame();


    running = true;


    lastTime =
        performance.now();


    animationId =
        requestAnimationFrame(
            gameLoop
        );
}

   NÚT CHƠI LẠI

startButton.addEventListener(

        startGame();

    }

/* =====================================================
   MOBILE BUTTON
===================================================== */

function setupMoveButton(
    id,
    direction
){

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            keys[direction] = true;


            try{

                button.setPointerCapture(
                    e.pointerId
                );

            }catch(error){}
        }
    );


    button.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "lostpointercapture",
        function(){

            keys[direction] = false;
        }
    );
}


setupMoveButton(
    "left",
    "left"
);


setupMoveButton(
    "right",
    "right"
);


/* =====================================================
   PC KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    function(e){

        const key =
            e.key.toLowerCase();


        if(
            e.key === "ArrowLeft" ||
            key === "a"
        ){

            e.preventDefault();

            keys.left = true;
        }


        if(
            e.key === "ArrowRight" ||
            key === "d"
        ){

            e.preventDefault();

            keys.right = true;
        }
    }
);


window.addEventListener(
    "keyup",
    function(e){

        const key =
            e.key.toLowerCase();


        if(
            e.key === "ArrowLeft" ||
            key === "a"
        ){

            keys.left = false;
        }


        if(
            e.key === "ArrowRight" ||
            key === "d"
        ){

            keys.right = false;
        }
    }
);
