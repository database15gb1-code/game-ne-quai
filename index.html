
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Né Quái</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#101827;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow-x:hidden;
    touch-action:manipulation;
}

.wrap{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:8px;
}

h1{
    margin:6px 0 8px;
    font-size:28px;
}

.top{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:8px;
    font-size:15px;
}

.info{
    background:#1d2a42;
    border:1px solid #33476b;
    border-radius:10px;
    padding:7px 10px;
}

canvas{
    display:block;
    width:100%;
    max-width:720px;
    height:auto;
    margin:auto;

    border:3px solid #394968;
    border-radius:12px;

    background:#18243a;

    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

button{
    border:0;
    border-radius:14px;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

#start{
    background:#62d86d;
    color:#07110a;
    font-size:18px;
    font-weight:bold;
    padding:12px 28px;
    margin:10px 0;
}

#start:active{
    transform:scale(.96);
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:4px;
}

.move{
    width:110px;
    height:78px;

    background:#e1e9f5;
    color:#172238;

    font-size:42px;
    font-weight:bold;

    box-shadow:0 5px 0 #9eacbf;
}

.move:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 #9eacbf;
}

.small{
    margin:8px 0;
    opacity:.7;
    font-size:13px;
}

#message{
    position:fixed;

    left:50%;
    top:43%;

    transform:
        translate(-50%,-50%)
        scale(.4);

    width:96%;

    font-size:clamp(27px,7vw,60px);

    font-weight:900;

    text-align:center;

    opacity:0;

    pointer-events:none;

    z-index:9999;

    text-shadow:
        0 4px 0 #000,
        0 0 15px #fff,
        0 0 30px #fff;
}

#message.show{
    animation:messagePop 2.5s ease forwards;
}

@keyframes messagePop{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.4);
    }

    12%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.12);
    }

    25%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.92);
    }
}

@media(max-width:500px){

    h1{
        font-size:23px;
    }

    .top{
        font-size:13px;
        gap:5px;
    }

    .info{
        padding:5px 7px;
    }

    .move{
        width:110px;
        height:78px;
        font-size:42px;
    }
}
</style>
</head>

<body>

<div class="wrap">

<h1>🎮 Né Quái</h1>

<div class="top">

    <div class="info">
        ⭐ Điểm:
        <span id="score">0</span>
    </div>

    <div class="info">
        🏆 Kỷ lục:
        <span id="best">0</span>
    </div>

    <div class="info">
        ❤️ HP:
        <span id="hp">3</span>
    </div>

    <div class="info">
        ✨ Skill:
        <span id="skill">Không</span>
    </div>

</div>

<canvas
    id="game"
    width="720"
    height="420">
</canvas>

<button id="start">
    🔄 Chơi lại
</button>

<div class="controls">

    <button class="move" id="left">
        ⬅️
    </button>

    <button class="move" id="right">
        ➡️
    </button>

</div>

<p class="small">
    📱 Điện thoại: giữ ⬅️ ➡️ để di chuyển<br>
    🖥️ PC: dùng phím ← →
</p>

</div>

<div id="message"></div>


<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 720;
const H = 420;


/* =====================================================
   UI
===================================================== */

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const hpEl = document.getElementById("hp");
const skillEl = document.getElementById("skill");
const messageEl = document.getElementById("message");
const startButton = document.getElementById("start");


/* =====================================================
   LOCAL STORAGE AN TOÀN
===================================================== */

function loadBest(){

    try{

        const value =
            Number(
                localStorage.getItem("neQuaiBest")
            );

        return Number.isFinite(value)
            ? value
            : 0;

    }catch(error){

        return 0;
    }
}


function saveBest(value){

    try{

        localStorage.setItem(
            "neQuaiBest",
            String(value)
        );

    }catch(error){

        /*
           Nếu trình duyệt chặn localStorage
           game vẫn tiếp tục chạy bình thường.
        */
    }
}


let bestScore = loadBest();

bestEl.textContent = bestScore;


/* =====================================================
   GAME OBJECTS
===================================================== */

let player = null;

let enemies = [];
let bombs = [];
let fruits = [];
let bullets = [];
let particles = [];


/* =====================================================
   GAME STATE
===================================================== */

let score = 0;
let hp = 3;

let running = false;

let lastTime = 0;
let animationId = 0;



/* =====================================================
   SPAWN TIMER
===================================================== */

let enemyTimer = .5;
let bombTimer = 5;
let fruitTimer = 6;
let shootTimer = .3;


/* =====================================================
   SKILL
===================================================== */

let currentSkill = "Không";
let skillTime = 0;


/* =====================================================
   MỐC ĐIỂM
===================================================== */

let reached200 = false;
let reached500 = false;


/* =====================================================
   ĐIỀU KHIỂN
===================================================== */

const keys = {
    left:false,
    right:false
};


/* =====================================================
   GIỚI HẠN CHỐNG LAG
===================================================== */

const MAX_ENEMIES = 18;
const MAX_BOMBS = 3;
const MAX_FRUITS = 3;
const MAX_BULLETS = 24;
const MAX_PARTICLES = 75;


/* =====================================================
   RESET GAME
===================================================== */

function resetGame(){

    player = {

        x:W / 2,

        y:H - 45,

        width:42,

        height:25,

        speed:330
    };


    enemies.length = 0;
    bombs.length = 0;
    fruits.length = 0;
    bullets.length = 0;
    particles.length = 0;


    score = 0;
    hp = 3;


    enemyTimer = .5;
    bombTimer = 5;
    fruitTimer = 6;
    shootTimer = .3;


    currentSkill = "Không";
    skillTime = 0;




    keys.left = false;
    keys.right = false;


    updateUI();
    draw();
}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    scoreEl.textContent =
        Math.floor(score);

    hpEl.textContent =
        hp;

    if(currentSkill === "Không"){

        skillEl.textContent = "Không";

    }else{

        skillEl.textContent =
            currentSkill +
            " " +
            Math.ceil(skillTime) +
            "s";
    }
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

    messageEl.classList.remove("show");

    void messageEl.offsetWidth;

    messageEl.textContent = text;

    messageEl.classList.add("show");
}


/* =====================================================
   SCORE
===================================================== */

function updateScore(){

    const current =
        Math.floor(score);


    scoreEl.textContent = current;


    /*
       LƯU KỶ LỤC
    */

    if(current > bestScore){

        bestScore = current;

        saveBest(bestScore);

        bestEl.textContent = bestScore;
    }


    /*
       200 ĐIỂM
    */

    if(
        current >= 200 &&
        !reached200
    ){

        reached200 = true;

        showMessage(
            ""
        );
    }


    /*
       500 ĐIỂM
    */

    if(
        current >= 500 &&
        !reached500
    ){

        reached500 = true;

        showMessage(
            ""
        );
    }
}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    amount = 8
){

    const available =
        MAX_PARTICLES -
        particles.length;

    const count =
        Math.min(
            amount,
            Math.max(0,available)
        );


    for(let i=0;i<count;i++){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*180,

            vy:
                (Math.random()-.5)*180,

            life:
                .25 +
                Math.random()*.35
        });
    }
}


/* =====================================================
   PLAYER - ENEMY COLLISION
===================================================== */

function enemyHitsPlayer(e){

    return (

        Math.abs(
            player.x - e.x
        )

        <

        (
            player.width/2 +
            e.size/2
        )

    )

    &&

    (

        Math.abs(
            player.y - e.y
        )

        <

        (
            player.height/2 +
            e.size/2
        )
    );
}


/* =====================================================
   SPAWN ENEMY
   QUÁI RƠI TỪ TRÊN XUỐNG
===================================================== */

function spawnEnemy(){

    if(
        enemies.length >=
        MAX_ENEMIES
    ){

        return;
    }


    const types = [

        {
            size:26,
            speed:110,
            hp:1
        },

        {
            size:34,
            speed:85,
            hp:2
        },

        {
            size:22,
            speed:155,
            hp:1
        }
    ];


    const type =
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];


    enemies.push({

        x:
            25 +
            Math.random() *
            (W-50),

        y:-35,

        size:type.size,

        speed:
            type.speed +
            Math.min(
                score*.35,
                100
            ),

        hp:type.hp,

        frozen:0,

        freezeKillTimer:0
    });
}


/* =====================================================
   BOM
===================================================== */

function spawnBomb(){

    if(
        bombs.length >=
        MAX_BOMBS
    ){

        return;
    }


    bombs.push({

        x:
            25 +
            Math.random() *
            (W-50),

        y:-30,

        radius:15,

        speed:
            180 +
            Math.random()*70
    });
}


/* =====================================================
   FRUIT
===================================================== */

function spawnFruit(){

    if(
        fruits.length >=
        MAX_FRUITS
    ){

        return;
    }


    const random =
        Math.random();


    /*
       🌈 0.1%
    */

    if(random < .001){

        fruits.push({

            x:
                25 +
                Math.random()*(W-50),

            y:-25,

            speed:65,

            type:"rainbow"
        });

        return;
    }


    /*
       ❤️ 0.1%
    */

    if(random < .002){

        fruits.push({

            x:
                25 +
                Math.random()*(W-50),

            y:-25,

            speed:65,

            type:"heal"
        });

        return;
    }


    /*
       🍎 SKILL
    */

    fruits.push({

        x:
            25 +
            Math.random()*(W-50),

        y:-25,

        speed:65,

        type:"normal"
    });
}


/* =====================================================
   SKILLS
===================================================== */

const skillList = [

    "🔥 Phun lửa",
    "⚡ Tia điện",
    "❄️ Tia băng",
    "🔫 Bắn nhanh",
    "🛡️ Khiên",
    "🔆 Laser"
];


function giveRandomSkill(){

    currentSkill =
        skillList[
            Math.floor(
                Math.random() *
                skillList.length
            )
        ];


    skillTime = 15;

    updateUI();
}


/* =====================================================
   KILL ENEMY
===================================================== */

function killEnemy(index){

    if(
        index < 0 ||
        index >= enemies.length
    ){

        return;
    }


    const e = enemies[index];


    createParticles(
        e.x,
        e.y,
        7
    );


    enemies.splice(index,1);


    score += 3;
}


/* =====================================================
   DAMAGE PLAYER
===================================================== */

function damagePlayer(){

    /*
       KHIÊN
    */

    if(
        currentSkill ===
        "🛡️ Khiên"
    ){

        createParticles(
            player.x,
            player.y,
            4
        );

        return;
    }


    hp--;

    hpEl.textContent = hp;


    createParticles(
        player.x,
        player.y,
        8
    );


    if(hp <= 0){

        gameOver();
    }
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    if(!running){
        return;
    }


    running = false;


    cancelAnimationFrame(
        animationId
    );


    updateScore();


    showMessage(
        "💀 HẾT MÁU!"
    );


    /*
       TỰ ĐỘNG CHƠI LẠI
    */


    restartTimer =
        setTimeout(
            () => {

                startGame();

            },
            1600
        );
}


/* =====================================================
   PLAYER
   CHỈ TRÁI / PHẢI
===================================================== */

function updatePlayer(dt){

    if(keys.left){

        player.x -=
            player.speed * dt;
    }


    if(keys.right){

        player.x +=
            player.speed * dt;
    }


    player.x =
        Math.max(

            player.width/2,

            Math.min(

                W -
                player.width/2,

                player.x
            )
        );
}


/* =====================================================
   ENEMY UPDATE
===================================================== */

function updateEnemies(dt){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e =
            enemies[i];


        /*
           ĐANG ĐÓNG BĂNG
        */

        if(e.frozen > 0){

            e.frozen -= dt;

        }else{

            e.y +=
                e.speed * dt;
        }


        /*
           ĐỤNG PLAYER
        */

        if(
            enemyHitsPlayer(e)
        ){

            if(
                currentSkill ===
                "🛡️ Khiên"
            ){

                killEnemy(i);

                continue;
            }


            enemies.splice(i,1);

            damagePlayer();


            if(!running){
                return;
            }


            continue;
        }


        /*
           RA KHỎI MÀN
        */

        if(
            e.y > H+50
        ){

            enemies.splice(i,1);
        }
    }
}


/* =====================================================
   BOM
   CHỈ GÂY DAMAGE PLAYER
===================================================== */

function updateBombs(dt){

    for(
        let i=bombs.length-1;
        i>=0;
        i--
    ){

        const b =
            bombs[i];


        b.y +=
            b.speed*dt;


        /*
           QUAN TRỌNG:

           KHÔNG KIỂM TRA BOM - QUÁI

           => BOM KHÔNG ẢNH HƯỞNG QUÁI
        */


        const distance =
            Math.hypot(

                b.x-player.x,

                b.y-player.y
            );


        /*
           CHỈ PLAYER
        */

        if(
            distance <
            b.radius+20
        ){

            createParticles(
                b.x,
                b.y,
                12
            );


            damagePlayer();


            bombs.splice(i,1);


            if(!running){
                return;
            }


            continue;
        }


        if(
            b.y > H+50
        ){

            bombs.splice(i,1);
        }
    }
}


/* =====================================================
   FRUIT UPDATE
===================================================== */

function updateFruits(dt){

    for(
        let i=fruits.length-1;
        i>=0;
        i--
    ){

        const f =
            fruits[i];


        f.y +=
            f.speed*dt;


        /*
           ĂN TRÁI
        */

        if(

            Math.hypot(

                f.x-player.x,

                f.y-player.y

            ) < 35

        ){

            /*
               🌈
            */

            if(
                f.type ===
                "rainbow"
            ){

                const rainbowRoll = Math.random();

                if(rainbowRoll < 0.34){
                    currentSkill = "🌈 Khiên Lửa";
                    skillTime = 25;
                }else if(rainbowRoll < 0.67){
                    currentSkill = "🌈 Song Hỏa";
                    skillTime = 25;
                }else{
                    currentSkill = "🌈 Hồi 2 Tim";
                    if(typeof hp === "number"){
                        hp = Math.min(5, hp + 2);
                    }
                    skillTime = 3;
                }
            }


            /*
               ❤️
            */

            else if(
                f.type ===
                "heal"
            ){

                hp =
                    Math.min(
                        3,
                        hp+1
                    );

                hpTextUpdate();

                showMessage(
                    "❤️ +1 HP!"
                );
            }


            /*
               🍎
            */

            else{

                giveRandomSkill();
            }


            fruits.splice(i,1);

            continue;
        }


        if(
            f.y > H+40
        ){

            fruits.splice(i,1);
        }
    }
}


/* =====================================================
   HP
===================================================== */

function hpTextUpdate(){

    hpEl.textContent = hp;
}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(
        bullets.length >=
        MAX_BULLETS
    ){

        return;
    }


    bullets.push({

        x:player.x,

        y:player.y-22,

        speed:440,

        radius:5
    });
}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];


        b.y -=
            b.speed*dt;


        if(
            b.y < -30
        ){

            bullets.splice(i,1);

            continue;
        }


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const e =
                enemies[j];


            if(

                Math.hypot(

                    b.x-e.x,

                    b.y-e.y

                )

                <

                b.radius+
                e.size/2

            ){

                e.hp--;


                createParticles(
                    e.x,
                    e.y,
                    3
                );


                bullets.splice(i,1);


                if(
                    e.hp<=0
                ){

                    killEnemy(j);
                }


                break;
            }
        }
    }
}


/* =====================================================
   SKILL ATTACK
===================================================== */

function useSkill(dt){

    if(
        currentSkill ===
        "Không"
    ){

        return;
    }


    /*
       🔥 PHUN LỬA
    */

    if(
        currentSkill ===
        "🔥 Phun lửa"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 120 &&

                player.y-e.y < 230

            ){

                killEnemy(i);
            }
        }
    }


    /*
       ⚡ ĐIỆN
    */

    if(
        currentSkill ===
        "⚡ Tia điện"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 95

            ){

                killEnemy(i);
            }
        }
    }


    /*
       ❄️ BĂNG

       Đầu tiên đóng băng.

       Sau đó đếm ngược.

       Cuối cùng tiêu diệt.
    */

    if(
        currentSkill ===
        "❄️ Tia băng"
    ){

        for(
            const e of enemies
        ){

            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 90 &&

                e.frozen <= 0 &&

                e.freezeKillTimer <= 0

            ){

                e.frozen = 1.2;

                e.freezeKillTimer = .65;
            }
        }


        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(
                e.freezeKillTimer > 0
            ){

                e.freezeKillTimer -= dt;


                if(
                    e.freezeKillTimer <= 0
                ){

                    killEnemy(i);
                }
            }
        }
    }


    /*
       🔆 LASER
    */

    if(

        currentSkill ===
        "🔆 Laser"

        ||

        currentSkill ===
        "🌈 Khiên Lửa"

    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 22

            ){

                killEnemy(i);
            }
        }
    }
}


/* =====================================================
   PARTICLES UPDATE
===================================================== */

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx*dt;

        p.y +=
            p.vy*dt;

        p.life -= dt;


        if(
            p.life <= 0
        ){

            particles.splice(i,1);
        }
    }
}



/* =====================================================
   DỌN RÁC - XÓA MỌI OBJECT RA KHỎI MÀN HÌNH
===================================================== */
function cleanupOffscreen(){
    enemies = enemies.filter(e =>
        e.x > -e.size - 20 &&
        e.x < W + e.size + 20 &&
        e.y < H + e.size + 20
    );

    bombs = bombs.filter(b =>
        b.x > -b.radius - 20 &&
        b.x < W + b.radius + 20 &&
        b.y < H + b.radius + 20
    );

    fruits = fruits.filter(f =>
        f.x > -40 &&
        f.x < W + 40 &&
        f.y < H + 40
    );

    bullets = bullets.filter(b =>
        b.x > -30 &&
        b.x < W + 30 &&
        b.y > -30 &&
        b.y < H + 30
    );

    particles = particles.filter(p =>
        p.x > -40 &&
        p.x < W + 40 &&
        p.y > -40 &&
        p.y < H + 40 &&
        p.life > 0
    );
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    /*
       BACKGROUND
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#101b31");
    bg.addColorStop(.55, "#182a46");
    bg.addColorStop(1, "#10233a");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Ánh sáng nền tạo chiều sâu
    const glow = ctx.createRadialGradient(W/2, H*.38, 10, W/2, H*.38, 360);
    glow.addColorStop(0, "rgba(70,130,210,.10)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);


    /*
       GRID
    */

    ctx.strokeStyle =
        "#22324d";

    ctx.lineWidth = 1;


    for(
        let x=0;
        x<W;
        x+=60
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,H);

        ctx.stroke();
    }


    /*
       GROUND
    */

    const groundGradient = ctx.createLinearGradient(0, 395, 0, H);
    groundGradient.addColorStop(0, "#4f9a62");
    groundGradient.addColorStop(1, "#285b3b");
    ctx.fillStyle = groundGradient;
    ctx.fillRect(0, 395, W, 25);


    /*
       PLAYER — NHÂN VẬT MỚI
    */

    if(player){

        ctx.save();

        const px = player.x;
        const py = player.y;

        // Bóng chân
        ctx.fillStyle = "rgba(0,0,0,.35)";
        ctx.beginPath();
        ctx.ellipse(px, py+24, 27, 8, 0, 0, Math.PI*2);
        ctx.fill();

        // Jet/giày
        const shoe = ctx.createLinearGradient(px-18,py+10,px+18,py+27);
        shoe.addColorStop(0,"#79a7ff");
        shoe.addColorStop(.5,"#3157b7");
        shoe.addColorStop(1,"#14265c");
        ctx.fillStyle = shoe;

        ctx.beginPath();
        ctx.roundRect(px-19,py+10,14,15,6);
        ctx.roundRect(px+5,py+10,14,15,6);
        ctx.fill();

        // Ánh sáng dưới giày
        ctx.fillStyle = "rgba(75,220,255,.7)";
        ctx.beginPath();
        ctx.ellipse(px-12,py+26,7,2,0,0,Math.PI*2);
        ctx.ellipse(px+12,py+26,7,2,0,0,Math.PI*2);
        ctx.fill();

        // Thân robot
        const body = ctx.createLinearGradient(px-22,py-2,px+22,py+18);
        body.addColorStop(0,"#7de8ff");
        body.addColorStop(.35,"#3b9ed5");
        body.addColorStop(.7,"#2760a8");
        body.addColorStop(1,"#142d63");

        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.roundRect(px-22,py-8,44,28,14);
        ctx.fill();

        ctx.strokeStyle = "rgba(210,250,255,.85)";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Lõi năng lượng
        const core = ctx.createRadialGradient(px,py+6,1,px,py+6,9);
        core.addColorStop(0,"#ffffff");
        core.addColorStop(.3,"#8fffff");
        core.addColorStop(1,"rgba(50,180,255,0)");
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(px,py+6,9,0,Math.PI*2);
        ctx.fill();

        // Đầu tròn lớn
        const head = ctx.createRadialGradient(
            px-9,py-24,2,
            px,py-17,27
        );
        head.addColorStop(0,"#ffffff");
        head.addColorStop(.15,"#dff8ff");
        head.addColorStop(.48,"#6bb7e8");
        head.addColorStop(.8,"#2d609e");
        head.addColorStop(1,"#142a58");

        ctx.fillStyle = head;
        ctx.beginPath();
        ctx.arc(px,py-18,27,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "#bdefff";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Kính visor đen/xanh
        const visor = ctx.createLinearGradient(px-19,py-28,px+19,py-8);
        visor.addColorStop(0,"#bdf8ff");
        visor.addColorStop(.18,"#4cd7f5");
        visor.addColorStop(.5,"#102d50");
        visor.addColorStop(1,"#061326");

        ctx.fillStyle = visor;
        ctx.beginPath();
        ctx.ellipse(px,py-17,20,13,0,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "rgba(220,255,255,.9)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Hai mắt phát sáng
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#6fffff";
        ctx.fillStyle = "#eaffff";

        ctx.beginPath();
        ctx.roundRect(px-12,py-21,7,5,2);
        ctx.roundRect(px+5,py-21,7,5,2);
        ctx.fill();

        ctx.shadowBlur = 0;

        // Highlight kính
        ctx.fillStyle = "rgba(255,255,255,.5)";
        ctx.beginPath();
        ctx.ellipse(px-9,py-25,8,3,-.35,0,Math.PI*2);
        ctx.fill();

        // Anten
        ctx.strokeStyle = "#8ceeff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px,py-44);
        ctx.lineTo(px,py-53);
        ctx.stroke();

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#55eaff";
        ctx.fillStyle = "#dfffff";
        ctx.beginPath();
        ctx.arc(px,py-55,4,0,Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Tay robot
        const arm = ctx.createLinearGradient(px-30,py-8,px-23,py+12);
        arm.addColorStop(0,"#8beaff");
        arm.addColorStop(1,"#24518c");
        ctx.fillStyle = arm;

        ctx.beginPath();
        ctx.roundRect(px-31,py-5,10,22,5);
        ctx.roundRect(px+21,py-5,10,22,5);
        ctx.fill();

        // Vạch giáp
        ctx.strokeStyle = "rgba(255,255,255,.35)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(px-16,py+15);
        ctx.lineTo(px+16,py+15);
        ctx.stroke();

        ctx.restore();
    }


    /*
       🛡️ KHIÊN
    */

 — 3D
    */

    if(
        player &&
        currentSkill ===
        "🛡️ Khiên"
    ){

        ctx.save();

        const pulse =
            35 +
            Math.sin(performance.now()/150)*3;

        const shieldGlow = ctx.createRadialGradient(
            player.x,
            player.y,
            25,
            player.x,
            player.y,
            55
        );

        shieldGlow.addColorStop(
            0,
            "rgba(80,230,255,.24)"
        );

        shieldGlow.addColorStop(
            .65,
            "rgba(50,170,255,.12)"
        );

        shieldGlow.addColorStop(
            1,
            "rgba(30,130,255,0)"
        );

        ctx.fillStyle = shieldGlow;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 55, 0, Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "rgba(120,245,255,.35)";
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(player.x, player.y, pulse, 0, Math.PI*2);
        ctx.stroke();

        ctx.strokeStyle = "#d9fbff";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(player.x, player.y, pulse-3, 0, Math.PI*2);
        ctx.stroke();

        ctx.restore();
    }


    /*
       🌈 KHIÊN LỬA — 7 SẮC
    */

    if(
        player &&
        currentSkill ===
        "🌈 Khiên Lửa"
    ){

        ctx.save();

        const t =
            performance.now()/230;

        // Aura
        const aura = ctx.createRadialGradient(
            player.x,
            player.y,
            24,
            player.x,
            player.y,
            75
        );

        aura.addColorStop(
            0,
            "rgba(255,235,90,.22)"
        );

        aura.addColorStop(
            .42,
            "rgba(255,110,20,.22)"
        );

        aura.addColorStop(
            1,
            "rgba(255,30,0,0)"
        );

        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 75, 0, Math.PI*2);
        ctx.fill();

        // 3 vòng lửa
        const fireColors = [
            "#fff3a1",
            "#ff9f1c",
            "#ff3d16"
        ];

        for(let r=0; r<3; r++){

            ctx.strokeStyle = fireColors[r];
            ctx.lineWidth = 6-r;

            ctx.shadowBlur = 18;
            ctx.shadowColor = fireColors[r];

            ctx.beginPath();

            ctx.arc(
                player.x,
                player.y,
                39+r*5,
                t*(1.2+r*.25)+r,
                t*(1.2+r*.25)+r + Math.PI*1.72
            );

            ctx.stroke();
        }

        // Cục lửa quay quanh người
        for(let i=0; i<10; i++){

            const a =
                t*1.35 +
                i*Math.PI*2/10;

            const rr =
                48 +
                Math.sin(t*2+i)*3;

            const fx =
                player.x +
                Math.cos(a)*rr;

            const fy =
                player.y +
                Math.sin(a)*rr;

            const flame =
                4 +
                (i%3)*1.5;

            ctx.fillStyle =
                i%2
                    ? "#ff6a00"
                    : "#ffe66b";

            ctx.beginPath();
            ctx.arc(
                fx,
                fy,
                flame,
                0,
                Math.PI*2
            );
            ctx.fill();
        }

        ctx.shadowBlur = 0;
        ctx.restore();
    }


    /*
       🔥 PHUN LỬA — NÓN LỬA 3D
    */

    if(
        player &&
        currentSkill ===
        "🔥 Phun lửa"
    ){

        ctx.save();

        const flamePulse =
            1 +
            Math.sin(performance.now()/90)*.08;

        ctx.translate(
            player.x,
            player.y-20
        );

        ctx.scale(
            flamePulse,
            flamePulse
        );

        const fire =
            ctx.createRadialGradient(
                0,
                -95,
                5,
                0,
                -95,
                125
            );

        fire.addColorStop(
            0,
            "rgba(255,255,220,.95)"
        );

        fire.addColorStop(
            .18,
            "rgba(255,235,80,.95)"
        );

        fire.addColorStop(
            .48,
            "rgba(255,105,15,.72)"
        );

        fire.addColorStop(
            1,
            "rgba(255,35,0,0)"
        );

        ctx.fillStyle = fire;

        ctx.beginPath();
        ctx.moveTo(-22, 0);
        ctx.bezierCurveTo(
            -60,-55,
            -48,-150,
            0,-185
        );
        ctx.bezierCurveTo(
            48,-150,
            60,-55,
            22,0
        );
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }


    /*
       ⚡ TIA ĐIỆN — ZIGZAG
    */

    if(
        player &&
        currentSkill ===
        "⚡ Tia điện"
    ){

        ctx.save();

        const flicker =
            Math.sin(performance.now()/45);

        ctx.shadowBlur = 24;
        ctx.shadowColor = "#b86cff";

        ctx.strokeStyle =
            "rgba(170,90,255,.45)";

        ctx.lineWidth = 14;

        ctx.beginPath();
        ctx.moveTo(player.x, player.y);

        for(let i=1; i<=9; i++){

            const yy =
                player.y -
                i*(player.y/9);

            const xx =
                player.x +
                Math.sin(i*2.4+flicker)*16;

            ctx.lineTo(xx, yy);
        }

        ctx.stroke();

        ctx.strokeStyle = "#f7eaff";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(player.x, player.y);

        for(let i=1; i<=9; i++){

            const yy =
                player.y -
                i*(player.y/9);

            const xx =
                player.x +
                Math.sin(i*2.4+flicker)*16;

            ctx.lineTo(xx, yy);
        }

        ctx.stroke();

        ctx.restore();
    }


    /*
       ❄️ TIA BĂNG — TINH THỂ 3D
    */

    if(
        player &&
        currentSkill ===
        "❄️ Tia băng"
    ){

        ctx.save();

        const ice =
            ctx.createLinearGradient(
                player.x-18,
                player.y,
                player.x+18,
                0
            );

        ice.addColorStop(
            0,
            "rgba(30,180,255,.18)"
        );

        ice.addColorStop(
            .5,
            "rgba(220,255,255,.72)"
        );

        ice.addColorStop(
            1,
            "rgba(70,210,255,.08)"
        );

        ctx.fillStyle = ice;
        ctx.beginPath();
        ctx.moveTo(player.x-16, player.y);
        ctx.lineTo(player.x-7, 8);
        ctx.lineTo(player.x, 0);
        ctx.lineTo(player.x+7, 8);
        ctx.lineTo(player.x+16, player.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "#dffcff";
        ctx.lineWidth = 2;
        ctx.stroke();

        // tinh thể hai bên
        for(let side of [-1,1]){

            ctx.fillStyle =
                "rgba(120,235,255,.72)";

            ctx.beginPath();
            ctx.moveTo(player.x+side*7, player.y-40);
            ctx.lineTo(player.x+side*23, player.y-90);
            ctx.lineTo(player.x+side*12, player.y-100);
            ctx.closePath();
            ctx.fill();
        }

        ctx.restore();
    }



    /*
       🔥 PHUN LỬA — TIA LỬA 3D
    */
    if(player && currentSkill === "🔥 Phun lửa"){

        ctx.save();

        const t = performance.now()/80;

        const g = ctx.createLinearGradient(
            player.x, player.y, player.x, 0
        );
        g.addColorStop(0, "#fffbd7");
        g.addColorStop(.18, "#ffe66d");
        g.addColorStop(.45, "#ff8a1c");
        g.addColorStop(.72, "#ff3b12");
        g.addColorStop(1, "rgba(255,30,0,0)");

        ctx.shadowBlur = 30;
        ctx.shadowColor = "#ff5a00";

        ctx.strokeStyle = "rgba(255,80,10,.25)";
        ctx.lineWidth = 30;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + Math.sin(t)*18, 0);
        ctx.stroke();

        ctx.strokeStyle = g;
        ctx.lineWidth = 13;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + Math.sin(t)*18, 0);
        ctx.stroke();

        ctx.strokeStyle = "#fffef0";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + Math.sin(t)*18, 0);
        ctx.stroke();

        ctx.restore();
    }

    /*
       ❄️ BĂNG — TIA BĂNG 3D
    */
    if(player && currentSkill === "❄️ Tia băng"){

        ctx.save();

        const t = performance.now()/120;

        const g = ctx.createLinearGradient(
            player.x, player.y, player.x, 0
        );
        g.addColorStop(0, "#ffffff");
        g.addColorStop(.18, "#bffaff");
        g.addColorStop(.5, "#50dcff");
        g.addColorStop(1, "rgba(70,210,255,0)");

        ctx.shadowBlur = 28;
        ctx.shadowColor = "#48dfff";

        ctx.strokeStyle = "rgba(70,220,255,.22)";
        ctx.lineWidth = 28;
        ctx.beginPath();
        ctx.moveTo(player.x,player.y);
        ctx.lineTo(player.x+Math.sin(t)*9,0);
        ctx.stroke();

        ctx.strokeStyle = g;
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(player.x,player.y);
        ctx.lineTo(player.x+Math.sin(t)*9,0);
        ctx.stroke();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(player.x,player.y);
        ctx.lineTo(player.x+Math.sin(t)*9,0);
        ctx.stroke();

        ctx.restore();
    }

    /*
       🔆 LASER — TIA 3 LỚP
    */

    if(
        player &&
        currentSkill ===
        "🔆 Laser"
    ){

        ctx.save();

        const laser =
            ctx.createLinearGradient(
                player.x-15,
                player.y,
                player.x+15,
                0
            );

        laser.addColorStop(
            0,
            "rgba(255,20,210,.12)"
        );

        laser.addColorStop(
            .45,
            "rgba(255,90,245,.82)"
        );

        laser.addColorStop(
            .55,
            "rgba(255,255,255,.98)"
        );

        laser.addColorStop(
            1,
            "rgba(255,20,210,.12)"
        );

        ctx.shadowBlur = 28;
        ctx.shadowColor = "#ff36df";

        ctx.strokeStyle =
            "rgba(255,45,220,.35)";
        ctx.lineWidth = 24;

        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x, 0);
        ctx.stroke();

        ctx.strokeStyle = laser;
        ctx.lineWidth = 9;

        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x, 0);
        ctx.stroke();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.5;

        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x, 0);
        ctx.stroke();

        ctx.restore();
    }


    /*
       BULLETS
    */



    for(
        const b of bullets
    ){

        const bg = ctx.createLinearGradient(b.x-4, b.y-10, b.x+4, b.y+10);
        bg.addColorStop(0, "#fffbd0");
        bg.addColorStop(.45, "#ffe66b");
        bg.addColorStop(1, "#ff9f1c");
        ctx.fillStyle = bg;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ffe66b";
        ctx.beginPath();
        ctx.roundRect(b.x-4, b.y-10, 8, 20, 4);
        ctx.fill();
        ctx.shadowBlur = 0;
    }


    /*
       ENEMIES
    */

    for(
        const e of enemies
    ){

        let enemyColor;


        /*
           KHÔNG DÙNG MÀU ĐỎ
        */

        if(
            e.frozen > 0
        ){

            enemyColor =
                "#66ddff";

        }else if(
            e.hp >= 2
        ){

            enemyColor =
                "#9b6cff";

        }else{

            enemyColor =
                "#55c85a";
        }


        ctx.save();

        // Quái hình tròn + gradient + viền sáng
        const eg = ctx.createRadialGradient(
            e.x-e.size*.18, e.y-e.size*.25, 2,
            e.x, e.y, e.size*.62
        );
        eg.addColorStop(0, "#ffffff");
        eg.addColorStop(.12, enemyColor);
        eg.addColorStop(1, enemyColor);
        ctx.fillStyle = eg;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size/2, 0, Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,.5)";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Mắt
        ctx.fillStyle = "#10131a";
        ctx.beginPath();
        ctx.arc(e.x-e.size*.18, e.y-e.size*.08, Math.max(3, e.size*.11), 0, Math.PI*2);
        ctx.arc(e.x+e.size*.18, e.y-e.size*.08, Math.max(3, e.size*.11), 0, Math.PI*2);
        ctx.fill();

        // Miệng
        ctx.strokeStyle = "#10131a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y+e.size*.08, e.size*.18, 0.15, Math.PI-0.15);
        ctx.stroke();

        ctx.restore();


        /*
           BĂNG
        */

        if(
            e.frozen > 0
        ){

            ctx.strokeStyle =
                "#e8fbff";

            ctx.lineWidth = 4;


            ctx.strokeRect(

                e.x-
                e.size/2-5,

                e.y-
                e.size/2-5,

                e.size+10,

                e.size+10
            );
        }
    }


    /*
       BOM
    */

    for(
        const b of bombs
    ){

        ctx.fillStyle =
            "#242424";


        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#ffb52e";


        ctx.fillRect(

            b.x-2,

            b.y-
            b.radius-
            7,

            4,

            7
        );
    }


    /*
       FRUIT
    */

    for(
        const f of fruits
    ){

        ctx.textAlign =
            "center";

        ctx.font =
            "27px Arial";


        let icon = "🍎";


        if(
            f.type ===
            "rainbow"
        ){

            icon = "🌈";

        }else if(
            f.type ===
            "heal"
        ){

            icon = "❤️";
        }


        ctx.fillText(
            icon,
            f.x,
            f.y+9
        );
    }


    /*
       PARTICLES
    */

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life/.65
            );


        const particleGradient =
            ctx.createRadialGradient(
                p.x,
                p.y,
                0,
                p.x,
                p.y,
                5
            );

        particleGradient.addColorStop(
            0,
            "#ffffff"
        );

        particleGradient.addColorStop(
            .45,
            "#ffd166"
        );

        particleGradient.addColorStop(
            1,
            "rgba(255,120,30,0)"
        );

        ctx.fillStyle =
            particleGradient;

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            4.5,
            0,
            Math.PI*2
        );
        ctx.fill();
    }


    ctx.globalAlpha = 1;


    /*
       HƯỚNG DẪN
    */

    ctx.fillStyle =
        "rgba(255,255,255,.8)";

    ctx.font =
        "15px Arial";

    ctx.textAlign =
        "left";


    ctx.fillText(
        "Né quái càng lâu càng nhiều điểm!",
        15,
        25
    );
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(now){

    if(!running){
        return;
    }


    /*
       CHỐNG DT QUÁ LỚN
    */

    const dt =
        Math.min(
            .033,
            Math.max(
                0,
                (now-lastTime)/1000
            )
        );


    lastTime = now;


    /*
       PLAYER
    */

    updatePlayer(dt);


    /*
       SCORE
    */

    score += dt;

    updateScore();


    /*
       TIMERS
    */

    enemyTimer -= dt;
    bombTimer -= dt;
    fruitTimer -= dt;
    shootTimer -= dt;


    /*
       SKILL TIMER
    */

    if(
        currentSkill !==
        "Không"
    ){

        skillTime -= dt;


        if(
            skillTime <= 0
        ){

            currentSkill =
                "Không";

            skillTime = 0;
        }
    }


    /*
       QUÁI
    */

    if(
        enemyTimer <= 0
    ){

        spawnEnemy();


        enemyTimer =
            Math.max(

                .28,

                .72 -
                Math.min(
                    score/500,
                    .35
                )
            );
    }


    /*
       BOM
    */

    if(
        bombTimer <= 0
    ){

        spawnBomb();


        bombTimer =
            6 +
            Math.random()*5;
    }


    /*
       FRUIT
    */

    if(
        fruitTimer <= 0
    ){

        spawnFruit();


        fruitTimer =
            7 +
            Math.random()*6;
    }


    /*
       BẮN
    */

    let fireRate = .42;


    if(
        currentSkill ===
        "🔫 Bắn nhanh"
    ){

        fireRate = .10;
    }


    if(
        shootTimer <= 0
    ){

        shoot();

        shootTimer =
            fireRate;
    }


    /*
       SKILL
    */

    useSkill(dt);


    /*
       UPDATE
    */

    updateEnemies(dt);

    if(!running){
        return;
    }


    updateBombs(dt);

    if(!running){
        return;
    }


    updateFruits(dt);

    updateBullets(dt);

    updateParticles(dt);
    cleanupOffscreen();


    /*
       DRAW
    */

    draw();

    updateUI();


    /*
       FRAME
    */

    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    cancelAnimationFrame(
        animationId
    );


    running = false;


    resetGame();


    running = true;


    lastTime =
        performance.now();


    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =====================================================
   NÚT CHƠI LẠI
===================================================== */

startButton.addEventListener(
    "click",
    function(){

        startGame();

    }
);


/* =====================================================
   MOBILE BUTTON
===================================================== */

function setupMoveButton(
    id,
    direction
){

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            keys[direction] = true;


            try{

                button.setPointerCapture(
                    e.pointerId
                );

            }catch(error){}
        }
    );


    button.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "lostpointercapture",
        function(){

            keys[direction] = false;
        }
    );
}


setupMoveButton(
    "left",
    "left"
);


setupMoveButton(
    "right",
    "right"
);


/* =====================================================
   PC KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "ArrowLeft"
        ){

            e.preventDefault();

            keys.left = true;
        }


        if(
            e.key === "ArrowRight"
        ){

            e.preventDefault();

            keys.right = true;
        }
    }
);


window.addEventListener(
    "keyup",
    function(e){

        if(
            e.key === "ArrowLeft" ||
            key === "a"
        ){

            keys.left = false;
        }


        if(
            e.key === "ArrowRight" ||
            key === "d"
        ){

            keys.right = false;
        }
    }
);


/* =====================================================
   CHỐNG SCROLL MOBILE
===================================================== */

document
.querySelectorAll(".move")
.forEach(button => {

    button.addEventListener(
        "touchstart",
        e => e.preventDefault(),
        {passive:false}
    );

    button.addEventListener(
        "touchmove",
        e => e.preventDefault(),
        {passive:false}
    );

    button.addEventListener(
        "touchend",
        e => e.preventDefault(),
        {passive:false}
    );
});


/* =====================================================
   KHỞI TẠO
===================================================== */

resetGame();


/*
   TỰ ĐỘNG BẮT ĐẦU
   => Mở GitHub Pages là chơi ngay
*/

setTimeout(
    () => {

        startGame();

    },
    300
);

</script>
