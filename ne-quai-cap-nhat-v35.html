<style>
*{

html,body{

    width:100%;

body{

    color:#fff;
    font-family:Arial,sans-serif;

    overflow-x:hidden;

}

h1{

}

.top{

    display:block;

    border:3px solid #394968;

#start{

#soundToggle{
    background:#263653;

.controls{

.move{

    height:78px;

    transform:translateY(4px);

}

.small{

}

#message{
    position:fixed;

    left:50%;
    top:43%;

    transform:
        translate(-50%,-50%)
        scale(.4);

    width:96%;

    font-size:clamp(27px,7vw,60px);

    font-weight:900;

    text-align:center;

    opacity:0;

    pointer-events:none;

    z-index:9999;

    text-shadow:
        0 4px 0 #000,
        0 0 15px #fff,
        0 0 30px #fff;
}

#message.show{
    animation:messagePop 2.5s ease forwards;
}

@keyframes messagePop{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.4);
    }

    12%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.12);
    }

    25%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.92);
    }
}

@media(max-width:500px){

    h1{
        font-size:23px;
    }

    .top{
        font-size:13px;
        gap:5px;
    }

    .info{
        padding:5px 7px;
    }

    .move{
        width:110px;
        height:78px;
        font-size:42px;
    }
}

<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 720;
const H = 420;


/* =====================================================
   UI
===================================================== */

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const hpEl = document.getElementById("hp");
const skillEl = document.getElementById("skill");
const messageEl = document.getElementById("message");


/* =====================================================
   ÂM THANH — Web Audio, không cần file ngoài
===================================================== */

const soundToggle = document.getElementById("soundToggle");

let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;
let musicTimer = null;
let musicStep = 0;
let soundEnabled = true;

function ensureAudio(){
    if(!soundEnabled) return false;

    try{
        if(!audioCtx){
            const AC = window.AudioContext || window.webkitAudioContext;
            if(!AC) return false;

            audioCtx = new AC();

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.0;
            masterGain.connect(audioCtx.destination);

            musicGain = audioCtx.createGain();
            musicGain.gain.value = 0.16;
            musicGain.connect(masterGain);

            sfxGain = audioCtx.createGain();
            sfxGain.gain.value = 0.55;
            sfxGain.connect(masterGain);
        }

        if(audioCtx.state !== "running") audioCtx.resume().catch(()=>{});
        return true;
    }catch(e){
        return false;
    }
}

/* Mở khóa Web Audio chắc chắn bằng đúng thao tác click/chạm của người chơi. */
function unlockAudio(){
    if(!soundEnabled) return false;
    if(!ensureAudio()) return false;

    try{
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        osc.connect(gain);
        gain.connect(sfxGain);
        osc.start(t);
        osc.stop(t + 0.2);

        if(!musicTimer) startMusic();
        return true;
    }catch(e){
        return false;
    }
}

function tone(freq, duration=.08, type="sine", volume=.12, when=0){
    if(!ensureAudio()) return;

    const t = audioCtx.currentTime + when;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(
        Math.max(0.0001, volume),
        t + 0.008
    );
    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        t + duration
    );

    osc.connect(gain);
    gain.connect(sfxGain);

    osc.start(t);
    osc.stop(t + duration + 0.02);
}

function noise(duration=.12, volume=.12, filterFreq=1200){
    if(!ensureAudio()) return;

    const length = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
    const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);

    for(let i=0;i<length;i++){
        data[i] = (Math.random()*2-1) * (1-i/length);
    }

    const source = audioCtx.createBufferSource();
    const filter = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();

    filter.type = "lowpass";
    filter.frequency.value = filterFreq;

    gain.gain.setValueAtTime(Math.max(0.0001, volume), audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
    );

    source.buffer = buffer;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(sfxGain);

    source.start();
}

function playSfx(name){
    if(!soundEnabled) return;

    switch(name){
        case "pickup":
            tone(660,.06,"triangle",.16);
            tone(990,.10,"triangle",.13,.055);
            break;

        case "skill":
            tone(440,.08,"sine",.12);
            tone(660,.08,"sine",.13,.07);
            tone(880,.14,"sine",.14,.14);
            break;

        case "enemy":
            tone(150,.07,"square",.10);
            tone(90,.12,"sawtooth",.07,.045);
            noise(.08,.06,900);
            break;

        case "hurt":
            tone(120,.16,"sawtooth",.13);
            tone(75,.20,"square",.08,.06);
            break;

        case "fire":
            noise(.16,.10,1700);
            tone(180,.10,"sawtooth",.08);
            break;

        case "electric":
            tone(950,.055,"square",.10);
            tone(1450,.045,"square",.08,.045);
            tone(1900,.06,"square",.06,.09);
            break;

        case "ice":
            tone(1200,.10,"sine",.08);
            tone(1750,.16,"triangle",.09,.07);
            break;

        case "laser":
            tone(520,.08,"sawtooth",.08);
            tone(1100,.14,"sine",.09,.035);
            break;

        case "vortex":
            tone(220,.20,"sine",.08);
            tone(140,.25,"sine",.06,.08);
            break;

        case "bomb":
            noise(.22,.16,700);
            tone(75,.20,"square",.10);
            break;

        case "heal":
            tone(523,.08,"sine",.10);
            tone(784,.10,"sine",.11,.08);
            tone(1047,.16,"sine",.12,.16);
            break;

        case "shield":
            tone(330,.10,"triangle",.08);
            tone(495,.14,"triangle",.09,.07);
            break;

        case "gameover":
            tone(392,.13,"sine",.10);
            tone(294,.16,"sine",.09,.12);
            tone(196,.30,"sine",.10,.27);
            break;

        case "start":
            tone(392,.07,"triangle",.10);
            tone(523,.09,"triangle",.12,.07);
            tone(784,.16,"triangle",.14,.16);
            break;

        case "move":
            tone(180,.035,"square",.035);
            break;

        case "spawn":
            tone(95,.06,"sine",.035);
            break;

        case "fruit":
            tone(520,.05,"triangle",.07);
            tone(700,.08,"triangle",.08,.045);
            break;

        case "rainbow":
            tone(523,.06,"sine",.08);
            tone(659,.06,"sine",.08,.055);
            tone(784,.10,"sine",.10,.11);
            tone(1047,.16,"sine",.12,.19);
            break;

        case "skillEnd":
            tone(440,.08,"sine",.07);
            tone(330,.12,"sine",.06,.08);
            break;

        case "score":
            tone(660,.045,"triangle",.06);
            tone(880,.07,"triangle",.07,.05);
            break;

        case "button":
            tone(500,.05,"triangle",.055);
            break;

        case "milestone":
            tone(523,.06,"triangle",.08);
            tone(659,.06,"triangle",.08,.06);
            tone(784,.12,"triangle",.10,.12);
            tone(1047,.20,"triangle",.11,.20);
            break;

        case "shieldHit":
            tone(700,.05,"triangle",.08);
            tone(980,.08,"triangle",.07,.045);
            break;
    }
}

function musicTick(){
    if(!soundEnabled || !audioCtx || audioCtx.state !== "running") return;

    const notes = [261.63,329.63,392,329.63,293.66,349.23,440,349.23];
    const bass  = [130.81,164.81,196,164.81];

    const n = notes[musicStep % notes.length];
    const b = bass[musicStep % bass.length];

    const t = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.value = n;
    gain.gain.setValueAtTime(0.0001,t);
    gain.gain.exponentialRampToValueAtTime(0.07,t+.02);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+.27);
    osc.connect(gain);
    gain.connect(musicGain);
    osc.start(t);
    osc.stop(t+.3);

    if(musicStep % 2 === 0){
        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = "sine";
        bassOsc.frequency.value = b;
        bassGain.gain.setValueAtTime(0.0001,t);
        bassGain.gain.exponentialRampToValueAtTime(0.045,t+.02);
        bassGain.gain.exponentialRampToValueAtTime(0.0001,t+.42);
        bassOsc.connect(bassGain);
        bassGain.connect(musicGain);
        bassOsc.start(t);
        bassOsc.stop(t+.45);
    }

    musicStep++;
}

function startMusic(){
    if(!ensureAudio()) return;

    if(musicTimer) clearInterval(musicTimer);

    musicStep = 0;
    musicTick();
    musicTimer = setInterval(musicTick, 360);
}

function stopMusic(){
    if(musicTimer){
        clearInterval(musicTimer);
        musicTimer = null;
    }
}

soundToggle.addEventListener("click", function(e){
    e.preventDefault();

    if(!soundEnabled){
        soundEnabled = true;
        soundToggle.textContent = "🔊 Âm thanh";
        unlockAudio();
        playSfx("pickup");
        return;
    }

    /* Nếu âm thanh đang bật nhưng chưa được trình duyệt mở khóa, click này sẽ mở khóa. */
    if(!audioCtx || audioCtx.state !== "running") {
        unlockAudio();
        soundToggle.textContent = "🔊 Âm thanh";
        return;
    }

    soundEnabled = false;
    soundToggle.textContent = "🔇 Tắt tiếng";
    stopMusic();
    if(audioCtx) audioCtx.suspend().catch(()=>{});
});

/* Trình duyệt chỉ cho phát âm thanh sau thao tác của người dùng. */
document.addEventListener("pointerdown", function(){
    if(soundEnabled){
        ensureAudio();
        if(!musicTimer) startMusic();
    }
}, {passive:true});

document.addEventListener("touchstart", function(){
    if(soundEnabled){
        ensureAudio();
        if(!musicTimer) startMusic();
    }
}, {passive:true});

document.addEventListener("keydown", function(){
    if(soundEnabled) ensureAudio();
}, {once:false});

const startButton = document.getElementById("start");


/* =====================================================
   LOCAL STORAGE AN TOÀN
===================================================== */

function loadBest(){

    try{

        const value =
            Number(
                localStorage.getItem("neQuaiBest")
            );

        return Number.isFinite(value)
            ? value
            : 0;

    }catch(error){

        return 0;
    }
}


function saveBest(value){

    try{

        localStorage.setItem(
            "neQuaiBest",
            String(value)
        );

    }catch(error){

        /*
           Nếu trình duyệt chặn localStorage
           game vẫn tiếp tục chạy bình thường.
        */
    }
}


let bestScore = loadBest();

bestEl.textContent = bestScore;


/* =====================================================
   GAME OBJECTS
===================================================== */

let player = null;

let enemies = [];
let bombs = [];
let fruits = [];
let bullets = [];
let particles = [];


/* =====================================================
   GAME STATE
===================================================== */

let score = 0;
let hp = 3;

let running = false;

let lastTime = 0;
let animationId = 0;



/* =====================================================
   SPAWN TIMER
===================================================== */

let enemyTimer = .35;
let bombTimer = 5;
let fruitTimer = 6;
let rainbowTimer = 120;
let clockTimer = 90;
let shootTimer = .3;


/* =====================================================
   SKILL
===================================================== */

let currentSkill = "Không";
let skillAux = 0;
let skillTime = 0;
let soundSkillCooldown = 0;
let soundMoveCooldown = 0;


/* =====================================================
   ĐIỀU KHIỂN
===================================================== */

const keys = {
    left:false,
    right:false
};


/* =====================================================
   GIỚI HẠN CHỐNG LAG
===================================================== */

const MAX_ENEMIES = 42;
const MAX_BOMBS = 3;
const MAX_FRUITS = 3;
const MAX_BULLETS = 24;
const MAX_PARTICLES = 75;


/* =====================================================
   RESET GAME
===================================================== */

function resetGame(){

    player = {

        x:W / 2,

        y:H - 45,

        width:42,

        height:25,

        speed:330
    };


    enemies.length = 0;
    bombs.length = 0;
    fruits.length = 0;
    bullets.length = 0;
    particles.length = 0;


    score = 0;
    hp = 3;


    /*
       NGAY KHI VÀO GAME ĐÃ CÓ NHIỀU QUÁI
       Giữ cảm giác khó như bản cũ, không phải chờ quái rơi từng con.
    */
    for(let i = 0; i < 14; i++){
        spawnEnemy(true);
    }


    enemyTimer = .35;
    bombTimer = 5;
    /* 🍎 Táo vẫn rơi bình thường */
    fruitTimer = 6;
    /* 🌈 Trái 7 màu: đúng chu kỳ 2 phút */
    rainbowTimer = 120;
    shootTimer = .3;


    currentSkill = "Không";
    skillTime = 0;
    skillAux = 0;


    keys.left = false;
    keys.right = false;


    updateUI();
    draw();
}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    scoreEl.textContent =
        Math.floor(score);

    hpEl.textContent =
        hp;

    if(currentSkill === "Không"){

        skillEl.textContent = "Không";

    }else{

        skillEl.textContent =
            currentSkill +
            " " +
            Math.ceil(skillTime) +
            "s";
    }
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

    messageEl.classList.remove("show");

    void messageEl.offsetWidth;

    messageEl.textContent = text;

    messageEl.classList.add("show");
}


/* =====================================================
   SCORE
===================================================== */

function updateScore(){

    const current =
        Math.floor(score);


    scoreEl.textContent = current;


    /*
       LƯU KỶ LỤC
    */

    if(current > bestScore){

        bestScore = current;

        saveBest(bestScore);

        bestEl.textContent = bestScore;
    }
}






/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    amount = 8
){

    const available =
        MAX_PARTICLES -
        particles.length;

    const count =
        Math.min(
            amount,
            Math.max(0,available)
        );


    for(let i=0;i<count;i++){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*180,

            vy:
                (Math.random()-.5)*180,

            life:
                .25 +
                Math.random()*.35
        });
    }
}


/* =====================================================
   PLAYER - ENEMY COLLISION
===================================================== */

function enemyHitsPlayer(e){

    return (

        Math.abs(
            player.x - e.x
        )

        <

        (
            player.width/2 +
            e.size/2
        )

    )

    &&

    (

        Math.abs(
            player.y - e.y
        )

        <

        (
            player.height/2 +
            e.size/2
        )
    );
}


/* =====================================================
   SPAWN ENEMY
   QUÁI RƠI TỪ TRÊN XUỐNG
===================================================== */

function spawnEnemy(initialSpawn = false){

    if(
        enemies.length >=
        MAX_ENEMIES
    ){

        return;
    }


    const types = [

        {
            size:34,
            speed:110,
            hp:1
        },

        {
            size:39,
            speed:85,
            hp:2
        },

        {
            size:26,
            speed:155,
            hp:1
        },
        {
            size:34,
            speed:125,
            hp:2
        },
        {
            size:43,
            speed:70,
            hp:3
        }
    ];


    const type =
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];


    enemies.push({

        x:
            25 +
            Math.random() *
            (W-50),

        y: initialSpawn
            ? -40 - Math.random() * 360
            : -45,

        size:type.size,

        speed:
            type.speed +
            Math.min(
                score*.45,
                130
            ),

        hp:type.hp,

        shape: Math.floor(Math.random()*5),

        frozen:0,

        freezeKillTimer:0,

        dying:false,
        deathFade:1
    });
}


/* =====================================================
   BOM
===================================================== */

function spawnBomb(){

    playSfx("spawn");

    if(
        bombs.length >=
        MAX_BOMBS
    ){

        return;
    }


    bombs.push({

        x:
            25 +
            Math.random() *
            (W-50),

        y:-30,

        radius:15,

        speed:
            180 +
            Math.random()*70
    });
}


/* =====================================================
   FRUIT
===================================================== */

function spawnFruit(){

    playSfx("fruit");

    if(
        fruits.length >=
        MAX_FRUITS
    ){

        return;
    }


    const random =
        Math.random();


    /*
       ❤️ 0.01%
       Chỉ táo thường mới kiểm tra tỉ lệ hồi máu.
       🌈 7 màu được tách riêng và rơi theo chu kỳ 2 phút.
    */

    if(random < .0001){

        fruits.push({

            x:
                25 +
                Math.random()*(W-50),

            y:-25,

            speed:65,

            type:"heal"
        });

        return;
    }


    /*
       🍎 SKILL
    */

    fruits.push({

        x:
            25 +
            Math.random()*(W-50),

        y:-25,

        speed:65,

        type:"normal"
    });
}


function spawnClockFruit(){
    if(fruits.length >= MAX_FRUITS) return;
    fruits.push({
        x:25 + Math.random()*(W-50),
        y:-25,
        speed:65,
        type:"clock"
    });
}


/* =====================================================
   SKILLS
===================================================== */

const skillList = [
    "🔥 Phun lửa",
    "⚡ Tia điện",
    "❄️ Tia băng",
    "🔫 Bắn nhanh",
    "🛡️ Khiên",
    "🔆 Laser",
    "🌀 Lốc Xoáy",
    "⚡⚡ Sét Lan",
    "🧊 Đóng Băng Toàn Màn",
    "💥 Sóng Xung Kích",
    "☄️ Mưa Thiên Thạch",
];


function giveRandomSkill(){

    currentSkill =
        skillList[
            Math.floor(
                Math.random() *
                skillList.length
            )
        ];


    skillTime = 15;

    playSfx("skill");
    updateUI();
}


/* =====================================================
   KILL ENEMY
===================================================== */

function killEnemy(index){

    if(
        index < 0 ||
        index >= enemies.length
    ){

        return;
    }


    const e = enemies[index];


    if(e.dying){
        return;
    }

    // Quái không biến mất ngay: nhạt màu dần rồi mới tan biến.
    e.dying = true;
    e.deathFade = 1;
    e.frozen = 0;

    createParticles(
        e.x,
        e.y,
        7
    );

    score += 3;
    playSfx("enemy");
}


/* =====================================================
   DAMAGE PLAYER
===================================================== */

function damagePlayer(){

    /*
       KHIÊN
    */

    if(
        currentSkill === "🛡️ Khiên"
        || currentSkill === "🌈 Khiên Lửa"
        || currentSkill === "🛡️ Khiên Phản Đòn"
    ){

        createParticles(
            player.x,
            player.y,
            4
        );

        return;
    }


    hp--;

    playSfx("hurt");
    hpEl.textContent = hp;


    createParticles(
        player.x,
        player.y,
        8
    );


    if(hp <= 0){

        gameOver();
    }
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    if(!running){
        return;
    }


    running = false;


    cancelAnimationFrame(
        animationId
    );


    updateScore();


    showMessage(
        "💀 HẾT MÁU!"
    );

    playSfx("gameover");
    stopMusic();


    /*
       KHÔNG tự động chơi lại.
       Người chơi bấm “Chơi lại” để bắt đầu ván mới.
    */
}


/* =====================================================
   PLAYER
   CHỈ TRÁI / PHẢI
===================================================== */

function updatePlayer(dt){

    if(keys.left){

        player.x -=
            player.speed * dt;
    }


    if(keys.right){

        player.x +=
            player.speed * dt;
    }


    player.x =
        Math.max(

            player.width/2,

            Math.min(

                W -
                player.width/2,

                player.x
            )
        );
}


/* =====================================================
   ENEMY UPDATE
===================================================== */

function updateEnemies(dt){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e =
            enemies[i];

        // Đang chết: đứng lại và nhạt dần trước khi biến mất.
        if(e.dying){
            e.deathFade -= dt * 2.8;
            if(e.deathFade <= 0){
                enemies.splice(i,1);
            }
            continue;
        }


        /*
           ĐANG ĐÓNG BĂNG
        */

        if(e.frozen > 0){

            e.frozen -= dt;

        }else{

            e.y +=
                e.speed * dt * (currentSkill === "🕒 Làm Chậm Thời Gian" ? 0.32 : 1);
        }


        /*
           ĐỤNG PLAYER
        */

        if(
            enemyHitsPlayer(e)
        ){

            /*
               🌀 LỐC XOÁY:
               Quái bị hút chạm người chơi thì chết,
               không được gây mất máu — kể cả khi người chơi đang di chuyển.
            */
            if(
                currentSkill ===
                "🌀 Lốc Xoáy"
            ){
                killEnemy(i);
                continue;
            }

            if(
                currentSkill ===
                "🛡️ Khiên"
            ){

                killEnemy(i);

                continue;
            }


            enemies.splice(i,1);

            damagePlayer();


            if(!running){
                return;
            }


            continue;
        }


        /*
           RA KHỎI MÀN
        */

        if(
            e.y + e.size >= 395
        ){

            enemies.splice(i,1);
        }
    }
}


/* =====================================================
   BOM
   CHỈ GÂY DAMAGE PLAYER
===================================================== */

function updateBombs(dt){

    for(
        let i=bombs.length-1;
        i>=0;
        i--
    ){

        const b =
            bombs[i];


        b.y +=
            b.speed*dt;


        /*
           QUAN TRỌNG:

           KHÔNG KIỂM TRA BOM - QUÁI

           => BOM KHÔNG ẢNH HƯỞNG QUÁI
        */


        const distance =
            Math.hypot(

                b.x-player.x,

                b.y-player.y
            );


        /*
           CHỈ PLAYER
        */

        if(
            distance <
            b.radius+20
        ){

            createParticles(
                b.x,
                b.y,
                12
            );


            damagePlayer();


            bombs.splice(i,1);


            if(!running){
                return;
            }


            continue;
        }


        if(
            b.y + b.radius >= 395
        ){

            bombs.splice(i,1);
        }
    }
}


/* =====================================================
   FRUIT UPDATE
===================================================== */

function updateFruits(dt){

    for(
        let i=fruits.length-1;
        i>=0;
        i--
    ){

        const f =
            fruits[i];


        f.y +=
            f.speed*dt;


        /*
           ĂN TRÁI
        */

        if(

            Math.hypot(

                f.x-player.x,

                f.y-player.y

            ) < 35

        ){

            /*
               🌈
            */

            if(
                f.type ===
                "rainbow"
            ){
                playSfx("rainbow");

                const rainbowRoll = Math.random();

                if(rainbowRoll < 0.34){
                    currentSkill = "🌈 Khiên Lửa";
                    skillTime = 25;
                }else if(rainbowRoll < 0.67){
                    currentSkill = "🌈 Song Hỏa";
                    skillTime = 25;
                }else{
                    currentSkill = "🌈 Hồi 2 Tim";
                    if(typeof hp === "number"){
                        hp = Math.min(5, hp + 2);
                    }
                    skillTime = 3;
                }
            }


            /*
               ❤️
            */

            else if(
                f.type ===
                "heal"
            ){

                playSfx("heal");

                hp =
                    Math.min(
                        3,
                        hp+1
                    );

                hpTextUpdate();

                showMessage(
                    "❤️ +1 HP!"
                );
            }


            /*
               🍎
            */

            else{

                giveRandomSkill();
            }


            fruits.splice(i,1);

            continue;
        }


        if(
            f.y + 18 >= 395
        ){

            fruits.splice(i,1);
        }
    }
}


/* =====================================================
   HP
===================================================== */

function hpTextUpdate(){

    hpEl.textContent = hp;
}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(
        bullets.length >=
        MAX_BULLETS
    ){

        return;
    }


    bullets.push({

        x:player.x,

        y:player.y-22,

        speed:440,

        radius:5
    });
}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];


        b.y -=
            b.speed*dt;


        if(
            b.y < -30
        ){

            bullets.splice(i,1);

            continue;
        }


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const e =
                enemies[j];

            if(e.dying){
                continue;
            }


            if(

                Math.hypot(

                    b.x-e.x,

                    b.y-e.y

                )

                <

                b.radius+
                e.size/2

            ){

                e.hp--;


                createParticles(
                    e.x,
                    e.y,
                    3
                );


                bullets.splice(i,1);


                if(
                    e.hp<=0
                ){

                    killEnemy(j);
                }


                break;
            }
        }
    }
}


/* =====================================================
   SKILL ATTACK
===================================================== */

function useSkill(dt){

    if(
        currentSkill ===
        "Không"
    ){

        return;
    }


    /*
       🔥 PHUN LỬA
    */

    if(
        currentSkill ===
        "🔥 Phun lửa"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 120 &&

                player.y-e.y < 230

            ){

                killEnemy(i);
            }
        }
    }


    /*
       ⚡ ĐIỆN
    */

    if(
        currentSkill ===
        "⚡ Tia điện"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 95

            ){

                killEnemy(i);
            }
        }
    }


    /*
       ❄️ BĂNG

       Đầu tiên đóng băng.

       Sau đó đếm ngược.

       Cuối cùng tiêu diệt.
    */

    if(
        currentSkill ===
        "❄️ Tia băng"
    ){

        for(
            const e of enemies
        ){

            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 90 &&

                e.frozen <= 0 &&

                e.freezeKillTimer <= 0

            ){

                e.frozen = 1.2;

                e.freezeKillTimer = .65;
            }
        }


        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(
                e.freezeKillTimer > 0
            ){

                e.freezeKillTimer -= dt;


                if(
                    e.freezeKillTimer <= 0
                ){

                    killEnemy(i);
                }
            }
        }
    }


    /*
       🌈 SONG HỎA — 2 TIA LỬA
    */

    if(
        currentSkill ===
        "🌈 Song Hỏa"
    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e = enemies[i];
            const dy = player.y - e.y;

            if(
                dy > 0 &&
                dy < 420 &&
                (
                    Math.abs(e.x - (player.x - dy*.13)) < 24
                    ||
                    Math.abs(e.x - (player.x + dy*.13)) < 24
                )
            ){
                killEnemy(i);
            }
        }
    }


    /*
       🌀 LỐC XOÁY — hút quái gần người và quái bị hút sẽ chết
    */
    if(currentSkill === "🌀 Lốc Xoáy"){
        for(let i=enemies.length-1;i>=0;i--){
            const e=enemies[i];
            const d=Math.hypot(e.x-player.x,e.y-player.y);
            if(d<190 && !e.dying){
                const pull=Math.max(.04, Math.min(.18, (1-d/190)*.24))*dt*60;
                e.x += (player.x-e.x)*pull;
                e.y += (player.y-e.y)*pull;

                // Khi bị hút vào tâm lốc, quái sẽ chết.
                if(d<42) killEnemy(i);
            }
        }
    }

    /* ⚡⚡ SÉT LAN — đánh mục tiêu và lan sang quái gần */
    if(currentSkill === "⚡⚡ Sét Lan"){
        let hits=0;
        for(let i=enemies.length-1;i>=0 && hits<4;i--){
            const e=enemies[i];
            if(e.y<player.y && Math.hypot(e.x-player.x,e.y-player.y)<260){ killEnemy(i); hits++; }
        }
    }

    /* 🧊 ĐÓNG BĂNG TOÀN MÀN */
    if(currentSkill === "🧊 Đóng Băng Toàn Màn"){
        for(const e of enemies){ e.frozen=Math.max(e.frozen,skillTime>13?2.2:.35); }
    }

    /* 💥 SÓNG XUNG KÍCH */
    if(currentSkill === "💥 Sóng Xung Kích"){
        const radius=90+(15-skillTime)*18;
        for(let i=enemies.length-1;i>=0;i--){
            const e=enemies[i];
            if(Math.hypot(e.x-player.x,e.y-player.y)<radius) killEnemy(i);
        }
    }


    /* ☄️ MƯA THIÊN THẠCH — quét ngẫu nhiên từ trên xuống */
    if(currentSkill === "☄️ Mưa Thiên Thạch"){
        skillAux -= dt;
        if(skillAux<=0){
            skillAux=.12;
            const target=enemies.length ? Math.floor(Math.random()*enemies.length) : -1;
            if(target>=0) killEnemy(target);
        }
    }

    /* 🛡️ KHIÊN PHẢN ĐÒN — quái chạm người sẽ bị xóa bởi damagePlayer */

    /*
       🔆 LASER
    */

    if(

        currentSkill ===
        "🔆 Laser"

        ||

        currentSkill ===
        "🌈 Khiên Lửa"

    ){

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const e =
                enemies[i];


            if(

                e.y < player.y &&

                Math.abs(
                    e.x-player.x
                ) < 22

            ){

                killEnemy(i);
            }
        }
    }
}


/* =====================================================
   PARTICLES UPDATE
===================================================== */

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx*dt;

        p.y +=
            p.vy*dt;

        p.life -= dt;


        if(
            p.life <= 0
        ){

            particles.splice(i,1);
        }
    }
}



/* =====================================================
   DỌN RÁC - XÓA MỌI OBJECT RA KHỎI MÀN HÌNH
===================================================== */
function cleanupOffscreen(){
    // THANH XANH bắt đầu ở y=395. Vật thể rơi chạm thanh này thì xóa ngay.
    const groundY = 395;

    enemies = enemies.filter(e =>
        e.y + e.size < groundY &&
        e.x >= -e.size - 20 &&
        e.x <= W + e.size + 20
    );

    bombs = bombs.filter(b =>
        b.y + b.radius < groundY &&
        b.x >= -b.radius - 20 &&
        b.x <= W + b.radius + 20
    );

    fruits = fruits.filter(f =>
        f.y + 18 < groundY &&
        f.x >= -25 &&
        f.x <= W + 25
    );

    // Đạn bay lên: xóa khi ra khỏi mép trên hoặc hai mép ngang.
    bullets = bullets.filter(b =>
        b.y >= -b.radius - 20 &&
        b.x >= -b.radius - 20 &&
        b.x <= W + b.radius + 20
    );

    particles = particles.filter(p =>
        p.life > 0 &&
        p.x >= -40 && p.x <= W + 40 &&
        p.y >= -40 && p.y <= groundY + 10
    );
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    /*
       BACKGROUND
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#101b31");
    bg.addColorStop(.55, "#182a46");
    bg.addColorStop(1, "#10233a");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Ánh sáng nền tạo chiều sâu
    const glow = ctx.createRadialGradient(W/2, H*.38, 10, W/2, H*.38, 360);
    glow.addColorStop(0, "rgba(70,130,210,.10)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);


    /*
       GRID
    */

    ctx.strokeStyle =
        "#22324d";

    ctx.lineWidth = 1;


    for(
        let x=0;
        x<W;
        x+=60
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,H);

        ctx.stroke();
    }


    /*
       GROUND
    */

    const groundGradient = ctx.createLinearGradient(0, 395, 0, H);
    groundGradient.addColorStop(0, "#4f9a62");
    groundGradient.addColorStop(1, "#285b3b");
    ctx.fillStyle = groundGradient;
    ctx.fillRect(0, 395, W, 25);
    // Mọi vật thể rơi xuống chạm mép trên của thanh xanh (y=395) sẽ biến mất.


    /*
       PLAYER — KHỐI VUÔNG DẠ QUANG
    */

    if(player){

        ctx.save();

        const px = player.x;
        const py = player.y;
        const size = 34;

        // Bóng dưới nhân vật
        ctx.fillStyle = "rgba(0,0,0,.35)";
        ctx.beginPath();
        ctx.ellipse(px, py + 23, 24, 7, 0, 0, Math.PI*2);
        ctx.fill();

        // Glow neon nhiều lớp
        ctx.shadowColor = "#39f6ff";
        ctx.shadowBlur = 28;
        ctx.fillStyle = "rgba(35,235,255,.30)";
        ctx.beginPath();
        ctx.roundRect(px-size/2, py-size/2, size, size, 6);
        ctx.fill();

        ctx.shadowBlur = 18;
        ctx.fillStyle = "#18dce8";
        ctx.beginPath();
        ctx.roundRect(px-size/2, py-size/2, size, size, 6);
        ctx.fill();

        // Mặt khối vuông gradient
        ctx.shadowBlur = 0;
        const body = ctx.createLinearGradient(
            px-size/2,
            py-size/2,
            px+size/2,
            py+size/2
        );
        body.addColorStop(0, "#eaffff");
        body.addColorStop(.18, "#8dffff");
        body.addColorStop(.48, "#24d9e8");
        body.addColorStop(.78, "#087fbd");
        body.addColorStop(1, "#063b72");

        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.roundRect(px-size/2, py-size/2, size, size, 6);
        ctx.fill();

        // Viền dạ quang
        ctx.shadowColor = "#63ffff";
        ctx.shadowBlur = 12;
        ctx.strokeStyle = "#baffff";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Mặt kính vuông nhỏ
        const visor = ctx.createLinearGradient(px-11,py-9,px+11,py+7);
        visor.addColorStop(0, "#ffffff");
        visor.addColorStop(.25, "#8ffaff");
        visor.addColorStop(.7, "#126da4");
        visor.addColorStop(1, "#062c50");
        ctx.fillStyle = visor;
        ctx.beginPath();
        ctx.roundRect(px-11, py-8, 22, 16, 4);
        ctx.fill();

        // Hai mắt neon
        ctx.shadowColor = "#ffffff";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(px-5.5, py-1, 2.6, 0, Math.PI*2);
        ctx.arc(px+5.5, py-1, 2.6, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Lõi năng lượng ở giữa
        ctx.shadowColor = "#7fffff";
        ctx.shadowBlur = 14;
        ctx.fillStyle = "#dfffff";
        ctx.beginPath();
        ctx.arc(px, py+8, 3.5, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Highlight góc trên trái
        const shine = ctx.createLinearGradient(px-16,py-16,px-2,py-2);
        shine.addColorStop(0, "rgba(255,255,255,.85)");
        shine.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = shine;
        ctx.beginPath();
        ctx.roundRect(px-14, py-14, 11, 5, 2);
        ctx.fill();

        // Hai cạnh neon
        ctx.strokeStyle = "rgba(150,255,255,.9)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(px-size/2+3, py+size/2-5);
        ctx.lineTo(px-size/2+3, py+5);
        ctx.moveTo(px+size/2-3, py-size/2+5);
        ctx.lineTo(px+size/2-3, py-2);
        ctx.stroke();

        ctx.restore();
    }

    /*
       🛡️ KHIÊN — 3D
    */

    if(
        player &&
        currentSkill ===
        "🛡️ Khiên"
    ){

        ctx.save();

        const pulse =
            35 +
            Math.sin(performance.now()/150)*3;

        const shieldGlow = ctx.createRadialGradient(
            player.x,
            player.y,
            25,
            player.x,
            player.y,
            55
        );

        shieldGlow.addColorStop(
            0,
            "rgba(80,230,255,.24)"
        );

        shieldGlow.addColorStop(
            .65,
            "rgba(50,170,255,.12)"
        );

        shieldGlow.addColorStop(
            1,
            "rgba(30,130,255,0)"
        );

        ctx.fillStyle = shieldGlow;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 55, 0, Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "rgba(120,245,255,.35)";
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(player.x, player.y, pulse, 0, Math.PI*2);
        ctx.stroke();

        ctx.strokeStyle = "#d9fbff";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(player.x, player.y, pulse-3, 0, Math.PI*2);
        ctx.stroke();

        ctx.restore();
    }


    /*
       🌈 KHIÊN LỬA — 7 SẮC
    */

    if(
        player &&
        currentSkill ===
        "🌈 Khiên Lửa"
    ){

        ctx.save();

        const t =
            performance.now()/230;

        // Aura
        const aura = ctx.createRadialGradient(
            player.x,
            player.y,
            24,
            player.x,
            player.y,
            75
        );

        aura.addColorStop(
            0,
            "rgba(255,235,90,.22)"
        );

        aura.addColorStop(
            .42,
            "rgba(255,110,20,.22)"
        );

        aura.addColorStop(
            1,
            "rgba(255,30,0,0)"
        );

        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 75, 0, Math.PI*2);
        ctx.fill();

        // 3 vòng lửa
        const fireColors = [
            "#fff3a1",
            "#ff9f1c",
            "#ff3d16"
        ];

        for(let r=0; r<3; r++){

            ctx.strokeStyle = fireColors[r];
            ctx.lineWidth = 6-r;

            ctx.shadowBlur = 18;
            ctx.shadowColor = fireColors[r];

            ctx.beginPath();

            ctx.arc(
                player.x,
                player.y,
                39+r*5,
                t*(1.2+r*.25)+r,
                t*(1.2+r*.25)+r + Math.PI*1.72
            );

            ctx.stroke();
        }

        // Cục lửa quay quanh người
        for(let i=0; i<10; i++){

            const a =
                t*1.35 +
                i*Math.PI*2/10;

            const rr =
                48 +
                Math.sin(t*2+i)*3;

            const fx =
                player.x +
                Math.cos(a)*rr;

            const fy =
                player.y +
                Math.sin(a)*rr;

            const flame =
                4 +
                (i%3)*1.5;

            ctx.fillStyle =
                i%2
                    ? "#ff6a00"
                    : "#ffe66b";

            ctx.beginPath();
            ctx.arc(
                fx,
                fy,
                flame,
                0,
                Math.PI*2
            );
            ctx.fill();
        }

        ctx.shadowBlur = 0;
        ctx.restore();
    }


    /*
       ⚡ TIA ĐIỆN — ZIGZAG
    */

    if(
        player &&
        currentSkill ===
        "⚡ Tia điện"
    ){

        ctx.save();

        const flicker =
            Math.sin(performance.now()/45);

        ctx.shadowBlur = 24;
        ctx.shadowColor = "#b86cff";

        ctx.strokeStyle =
            "rgba(170,90,255,.45)";

        ctx.lineWidth = 14;

        ctx.beginPath();
        ctx.moveTo(player.x, player.y);

        for(let i=1; i<=9; i++){

            const yy =
                player.y -
                i*(player.y/9);

            const xx =
                player.x +
                Math.sin(i*2.4+flicker)*16;

            ctx.lineTo(xx, yy);
        }

        ctx.stroke();

        ctx.strokeStyle = "#f7eaff";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(player.x, player.y);

        for(let i=1; i<=9; i++){

            const yy =
                player.y -
                i*(player.y/9);

            const xx =
                player.x +
                Math.sin(i*2.4+flicker)*16;

            ctx.lineTo(xx, yy);
        }

        ctx.stroke();

        ctx.restore();
    }


    /*
       🔥 PHUN LỬA — TIA LỬA DẠ QUANG
       Không còn đốm lửa/cục lửa lớn: chỉ là tia sáng nhiều lớp
       kèm các tia lửa nhỏ phát sáng chạy dọc theo tia.
    */
    if(player && currentSkill === "🔥 Phun lửa"){

        ctx.save();

        const t = performance.now()/90;
        const endX = player.x + Math.sin(t)*18;

        const g = ctx.createLinearGradient(
            player.x, player.y, endX, 0
        );
        g.addColorStop(0, "#fffbd7");
        g.addColorStop(.18, "#ffe66d");
        g.addColorStop(.45, "#ff8a1c");
        g.addColorStop(.72, "#ff3b12");
        g.addColorStop(1, "rgba(255,30,0,0)");

        // Aura ngoài
        ctx.shadowBlur = 30;
        ctx.shadowColor = "#ff5a00";
        ctx.strokeStyle = "rgba(255,80,10,.20)";
        ctx.lineWidth = 24;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(endX, 0);
        ctx.stroke();

        // Tia lửa chính
        ctx.strokeStyle = g;
        ctx.lineWidth = 11;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(endX, 0);
        ctx.stroke();

        // Lõi trắng dạ quang
        ctx.strokeStyle = "#fffef0";
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(endX, 0);
        ctx.stroke();

        // Nhiều tia lửa nhỏ, không có đốm lửa lớn
        for(let i=0; i<24; i++){
            const p = (i/24 + (t*.055)%1) % 1;
            const baseX = player.x + (endX-player.x)*p;
            const baseY = player.y*(1-p);
            const side = Math.sin(i*2.7 + t*2.2) * (5 + 8*p);
            const sx = baseX + side;
            const sy = baseY - Math.cos(i*1.9 + t*1.7) * (3 + 6*p);
            const r = 1.5 + (i%3)*.55;

            const spark = ctx.createRadialGradient(sx, sy, 0, sx, sy, r*4);
            spark.addColorStop(0, "#ffffff");
            spark.addColorStop(.35, "#ffe66d");
            spark.addColorStop(.75, "#ff7a18");
            spark.addColorStop(1, "rgba(255,55,0,0)");

            ctx.fillStyle = spark;
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ff8a16";
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI*2);
            ctx.fill();
        }

        ctx.shadowBlur = 0;
        ctx.restore();
    }

    /*
       ❄️ BĂNG — TIA BĂNG 3D
    */
    if(player && currentSkill === "❄️ Tia băng"){

        ctx.save();

        const t = performance.now()/120;

        const g = ctx.createLinearGradient(
            player.x, player.y, player.x, 0
        );
        g.addColorStop(0, "#ffffff");
        g.addColorStop(.18, "#bffaff");
        g.addColorStop(.5, "#50dcff");
        g.addColorStop(1, "rgba(70,210,255,0)");

        ctx.shadowBlur = 28;
        ctx.shadowColor = "#48dfff";

        ctx.strokeStyle = "rgba(70,220,255,.22)";
        ctx.lineWidth = 28;
        ctx.beginPath();
        ctx.moveTo(player.x,player.y);
        ctx.lineTo(player.x+Math.sin(t)*9,0);
        ctx.stroke();

        ctx.strokeStyle = g;
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(player.x,player.y);
        ctx.lineTo(player.x+Math.sin(t)*9,0);
        ctx.stroke();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(player.x,player.y);
        ctx.lineTo(player.x+Math.sin(t)*9,0);
        ctx.stroke();

        ctx.restore();
    }

    /*
       🌈 SONG HỎA — 2 TIA LỬA 3D
    */

    if(player && currentSkill === "🌈 Song Hỏa"){

        ctx.save();

        const t = performance.now()/90;
        const beams = [-1, 1];

        for(const side of beams){
            const endX = player.x + side*72 + Math.sin(t)*10;

            ctx.shadowBlur = 30;
            ctx.shadowColor = "#ff4d00";
            ctx.strokeStyle = "rgba(255,65,0,.28)";
            ctx.lineWidth = 24;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(endX, 0);
            ctx.stroke();

            ctx.strokeStyle = "#ff8a16";
            ctx.lineWidth = 11;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(endX, 0);
            ctx.stroke();

            ctx.strokeStyle = "#fff7c7";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(endX, 0);
            ctx.stroke();
        }

        ctx.shadowBlur = 0;
        ctx.restore();
    }


    /*
       🔆 LASER — TIA 3 LỚP
    */

    if(
        player &&
        currentSkill ===
        "🔆 Laser"
    ){

        ctx.save();

        const laser =
            ctx.createLinearGradient(
                player.x-15,
                player.y,
                player.x+15,
                0
            );

        laser.addColorStop(
            0,
            "rgba(255,20,210,.12)"
        );

        laser.addColorStop(
            .45,
            "rgba(255,90,245,.82)"
        );

        laser.addColorStop(
            .55,
            "rgba(255,255,255,.98)"
        );

        laser.addColorStop(
            1,
            "rgba(255,20,210,.12)"
        );

        ctx.shadowBlur = 28;
        ctx.shadowColor = "#ff36df";

        ctx.strokeStyle =
            "rgba(255,45,220,.35)";
        ctx.lineWidth = 24;

        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x, 0);
        ctx.stroke();

        ctx.strokeStyle = laser;
        ctx.lineWidth = 9;

        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x, 0);
        ctx.stroke();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.5;

        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x, 0);
        ctx.stroke();

        ctx.restore();
    }


    /* 🌀 Lốc xoáy */
    if(player && currentSkill === "🌀 Lốc Xoáy"){
        ctx.save(); const t=performance.now()/180;
        ctx.shadowBlur=28; ctx.shadowColor="#b66cff"; ctx.strokeStyle="rgba(190,110,255,.8)"; ctx.lineWidth=5;
        for(let r=40;r<=185;r+=28){ ctx.beginPath(); ctx.arc(player.x,player.y,r,t+r*.01,t+Math.PI*1.45); ctx.stroke(); }
        ctx.restore();
    }
    /* ⚡⚡ Sét lan */
    if(player && currentSkill === "⚡⚡ Sét Lan"){
        ctx.save();
        const near = enemies.filter(e=>Math.hypot(e.x-player.x,e.y-player.y)<280).slice(0,7);
        ctx.shadowBlur=28; ctx.shadowColor="#9a7dff"; ctx.lineWidth=4; ctx.strokeStyle="#f7f1ff";
        for(const e of near){
            ctx.beginPath(); ctx.moveTo(player.x,player.y);
            const mx=(player.x+e.x)/2 + (Math.random()-.5)*35;
            const my=(player.y+e.y)/2 + (Math.random()-.5)*35;
            ctx.lineTo(mx,my); ctx.lineTo(e.x,e.y); ctx.stroke();
        }
        ctx.restore();
    }
    /* 🧊 Đóng băng */
    if(player && currentSkill === "🧊 Đóng Băng Toàn Màn"){
        ctx.save(); ctx.fillStyle="rgba(80,220,255,.10)"; ctx.fillRect(0,0,W,395); ctx.strokeStyle="rgba(180,250,255,.7)"; ctx.lineWidth=2; ctx.strokeRect(6,6,W-12,389); ctx.restore();
    }
    /* 💥 Sóng xung kích */
    if(player && currentSkill === "💥 Sóng Xung Kích"){
        ctx.save(); const radius=90+(15-skillTime)*18; ctx.shadowBlur=24; ctx.shadowColor="#ffef65"; ctx.strokeStyle="#fff7b0"; ctx.lineWidth=7; ctx.beginPath(); ctx.arc(player.x,player.y,radius,0,Math.PI*2); ctx.stroke(); ctx.restore();
    }
    /* 🕒 Làm chậm */
    if(player && currentSkill === "🕒 Làm Chậm Thời Gian"){
        ctx.save(); ctx.fillStyle="rgba(100,160,255,.08)"; ctx.fillRect(0,0,W,395); ctx.restore();
    }
    /* 👥 PHÂN THÂN — người chơi + đúng 1 phân thân */
    if(player && currentSkill === "👥 Phân Thân"){
        ctx.save();
        {
            const cx = player.x + 72;
            const cy = player.y;
            const size = 34;

            ctx.globalAlpha = .96;
            ctx.shadowColor = "#39f6ff";
            ctx.shadowBlur = 28;
            ctx.fillStyle = "rgba(35,235,255,.30)";
            ctx.beginPath();
            ctx.roundRect(cx-size/2, cy-size/2, size, size, 6);
            ctx.fill();

            ctx.shadowBlur = 16;
            const cloneBody = ctx.createLinearGradient(cx-size/2,cy-size/2,cx+size/2,cy+size/2);
            cloneBody.addColorStop(0,"#eaffff");
            cloneBody.addColorStop(.25,"#63f7ff");
            cloneBody.addColorStop(.7,"#16cfe0");
            cloneBody.addColorStop(1,"#087eaa");
            ctx.fillStyle = cloneBody;
            ctx.beginPath();
            ctx.roundRect(cx-size/2, cy-size/2, size, size, 6);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = "rgba(255,255,255,.9)";
            ctx.lineWidth = 2;
            ctx.strokeRect(cx-size/2+2, cy-size/2+2, size-4, size-4);

            // Highlight để nhìn giống hệt nhân vật chính.
            ctx.fillStyle = "rgba(255,255,255,.72)";
            ctx.beginPath();
            ctx.roundRect(cx-size/2+6, cy-size/2+5, 10, 5, 2);
            ctx.fill();
        }
        ctx.restore();
    }
    /* ☄️ Mưa thiên thạch */
    if(player && currentSkill === "☄️ Mưa Thiên Thạch"){
        ctx.save(); const t=performance.now()/90; ctx.shadowBlur=18; ctx.shadowColor="#ff7a18"; ctx.strokeStyle="#ffe66d"; ctx.lineWidth=4; for(let i=0;i<9;i++){ const x=(i*97+t*40)%W; const y=((i*71+t*120)%H); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-7,y+18); ctx.stroke(); } ctx.restore();
    }
    /* 🛡️ Khiên phản đòn */
    if(player && currentSkill === "🛡️ Khiên Phản Đòn"){
        ctx.save(); ctx.shadowBlur=25; ctx.shadowColor="#ff6b6b"; ctx.strokeStyle="#fff"; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(player.x,player.y,48+Math.sin(performance.now()/100)*3,0,Math.PI*2); ctx.stroke(); ctx.restore();
    }

    /*
       BULLETS
    */



    for(
        const b of bullets
    ){

        const bg = ctx.createLinearGradient(b.x-4, b.y-10, b.x+4, b.y+10);
        bg.addColorStop(0, "#fffbd0");
        bg.addColorStop(.45, "#ffe66b");
        bg.addColorStop(1, "#ff9f1c");
        ctx.fillStyle = bg;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ffe66b";
        ctx.beginPath();
        ctx.roundRect(b.x-4, b.y-10, 8, 20, 4);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(b.x, b.y-3, 2.2, 0, Math.PI*2);
        ctx.fill();
    }


    /*
       ENEMIES
    */

    for(
        const e of enemies
    ){

        let enemyColor;


        /*
           KHÔNG DÙNG MÀU ĐỎ
        */

        if(e.frozen > 0){
            enemyColor = "#66ddff";
        }else{
            const palette = [
                "#58d9ff", "#ff5d8f", "#a46cff",
                "#52df8a", "#ffc857", "#ff7a45"
            ];
            enemyColor = palette[Math.floor((e.x + e.size) / 35) % palette.length];
        }


        ctx.save();

        // Khi bị hạ, quái nhạt màu dần như đang tan biến.
        const fade = e.dying ? Math.max(0, e.deathFade) : 1;
        ctx.globalAlpha = fade;

        // Quái nhiều hình dáng: tròn, vuông bo góc, tam giác, sao, lục giác
        const eg = ctx.createRadialGradient(
            e.x-e.size*.18, e.y-e.size*.25, 2,
            e.x, e.y, e.size*.62
        );
        eg.addColorStop(0, "#ffffff");
        eg.addColorStop(.12, enemyColor);
        eg.addColorStop(1, enemyColor);
        ctx.shadowBlur = 14;
        ctx.shadowColor = enemyColor;
        ctx.fillStyle = eg;
        ctx.strokeStyle = "rgba(255,255,255,.55)";
        ctx.lineWidth = 2;

        ctx.beginPath();
        if(e.shape === 0){
            ctx.arc(e.x, e.y, e.size/2, 0, Math.PI*2);
        }else if(e.shape === 1){
            const r=e.size*.38;
            ctx.roundRect(e.x-r,e.y-r,r*2,r*2,7);
        }else if(e.shape === 2){
            const r=e.size*.52;
            for(let i=0;i<3;i++){
                const a=-Math.PI/2+i*Math.PI*2/3;
                const x=e.x+Math.cos(a)*r, y=e.y+Math.sin(a)*r;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.closePath();
        }else if(e.shape === 3){
            const r=e.size*.5, inner=r*.45;
            for(let i=0;i<10;i++){
                const a=-Math.PI/2+i*Math.PI/5;
                const rr=i%2===0?r:inner;
                const x=e.x+Math.cos(a)*rr, y=e.y+Math.sin(a)*rr;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.closePath();
        }else{
            const r=e.size*.48;
            for(let i=0;i<6;i++){
                const a=Math.PI/6+i*Math.PI/3;
                const x=e.x+Math.cos(a)*r, y=e.y+Math.sin(a)*r;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.closePath();
        }
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Highlight 3D
        ctx.fillStyle = "rgba(255,255,255,.38)";
        ctx.beginPath();
        ctx.ellipse(e.x-e.size*.18,e.y-e.size*.22,e.size*.16,e.size*.09,-.45,0,Math.PI*2);
        ctx.fill();

        // Mắt và miệng
        ctx.fillStyle = "#10131a";
        ctx.beginPath();
        ctx.arc(e.x-e.size*.18,e.y-e.size*.08,Math.max(2.5,e.size*.10),0,Math.PI*2);
        ctx.arc(e.x+e.size*.18,e.y-e.size*.08,Math.max(2.5,e.size*.10),0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = "#10131a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x,e.y+e.size*.08,e.size*.18,0.15,Math.PI-0.15);
        ctx.stroke();

        ctx.restore();


        /*
           BĂNG
        */

        if(
            e.frozen > 0
        ){

            ctx.strokeStyle =
                "#e8fbff";

            ctx.lineWidth = 4;


            ctx.strokeRect(

                e.x-
                e.size/2-5,

                e.y-
                e.size/2-5,

                e.size+10,

                e.size+10
            );
        }
    }


    /*
       BOM
    */

    for(
        const b of bombs
    ){

        ctx.fillStyle =
            "#242424";


        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#ffb52e";


        ctx.fillRect(

            b.x-2,

            b.y-
            b.radius-
            7,

            4,

            7
        );
    }


    /*
       FRUIT
    */

    for(
        const f of fruits
    ){

        ctx.textAlign =
            "center";

        ctx.font =
            "27px Arial";


        let icon = "🍎";


        if(
            f.type ===
            "rainbow"
        ){

            icon = "🌈";

        }else if(
            f.type ===
            "heal"
        ){

            icon = "❤️";
        }


        if(f.type === "rainbow") {
            const rt = performance.now()/180;
            const rg = ctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, 24);
            rg.addColorStop(0, "rgba(255,255,255,.95)");
            rg.addColorStop(.35, "rgba(255,210,80,.55)");
            rg.addColorStop(1, "rgba(255,80,220,0)");
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.arc(f.x, f.y, 24 + Math.sin(rt)*3, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 18;
            ctx.shadowColor = "#ff8cff";
        }

        ctx.fillText(
            icon,
            f.x,
            f.y+9
        );
        ctx.shadowBlur = 0;
    }


    /*
       PARTICLES
    */

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life/.65
            );


        const particleGradient =
            ctx.createRadialGradient(
                p.x,
                p.y,
                0,
                p.x,
                p.y,
                5
            );

        particleGradient.addColorStop(
            0,
            "#ffffff"
        );

        particleGradient.addColorStop(
            .45,
            "#ffd166"
        );

        particleGradient.addColorStop(
            1,
            "rgba(255,120,30,0)"
        );

        ctx.fillStyle =
            particleGradient;

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            4.5,
            0,
            Math.PI*2
        );
        ctx.fill();
    }


    ctx.globalAlpha = 1;


    /*
       HƯỚNG DẪN
    */

    ctx.fillStyle =
        "rgba(255,255,255,.8)";

    ctx.font =
        "15px Arial";

    ctx.textAlign =
        "left";


    ctx.fillText(
        "Né quái càng lâu càng nhiều điểm!",
        15,
        25
    );
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(now){

    if(!running){
        return;
    }


    /*
       CHỐNG DT QUÁ LỚN
    */

    const dt =
        Math.min(
            .033,
            Math.max(
                0,
                (now-lastTime)/1000
            )
        );


    lastTime = now;


    /*
       PLAYER
    */

    updatePlayer(dt);


    /*
       SCORE
    */

    score += dt;

    updateScore();


    /*
       TIMERS
    */

    enemyTimer -= dt;
    bombTimer -= dt;
    fruitTimer -= dt;
    rainbowTimer -= dt;
    shootTimer -= dt;


    /*
       SKILL TIMER
    */

    if(
        currentSkill !==
        "Không"
    ){

        skillTime -= dt;
        soundSkillCooldown -= dt;
        soundMoveCooldown -= dt;


        if(
            skillTime <= 0
        ){

            currentSkill =
                "Không";

            skillTime = 0;
            skillAux = 0;
        }
    }


    /*
       QUÁI
    */

    if(
        enemyTimer <= 0
    ){

        // Càng chơi lâu càng có nhiều quái xuất hiện cùng lúc.
        spawnEnemy();

        if(
            score >= 10 &&
            Math.random() < .60
        ){
            spawnEnemy();
        }

        if(
            score >= 30 &&
            Math.random() < .50
        ){
            spawnEnemy();
        }

        if(
            score >= 70 &&
            Math.random() < .35
        ){
            spawnEnemy();
        }

        enemyTimer =
            Math.max(
                .18,
                .48 -
                Math.min(
                    score/500,
                    .28
                )
            );
    }


    /*
       BOM
    */

    if(
        bombTimer <= 0
    ){

        spawnBomb();


        bombTimer =
            6 +
            Math.random()*5;
    }


    /*
       FRUIT
    */

    if(
        fruitTimer <= 0
    ){

        spawnFruit();


        /* 🍎 Táo vẫn rơi bình thường */
        fruitTimer =
            7 +
            Math.random()*6;
    }


    /*
       🌈 TRÁI 7 MÀU
       Cứ đúng khoảng 2 phút rơi 1 lần,
       không phụ thuộc tỉ lệ ngẫu nhiên.
    */
    if(
        rainbowTimer <= 0
    ){

        if(fruits.length < MAX_FRUITS){

            fruits.push({
                x:25 + Math.random()*(W-50),
                y:-25,
                speed:65,
                type:"rainbow"
            });

            rainbowTimer = 120;

        }else{

            /* Nếu đang đầy trái, thử lại sau 1 giây */
            rainbowTimer = 1;
        }
    }


    /*
       BẮN
       Đạn thường sẽ dừng khi đang dùng skill.
       Riêng 🔫 Bắn nhanh có hệ thống đạn riêng,
       nên skill vẫn bắn nhanh mà không bị xem là đạn thường.
    */
    if(
        currentSkill === "🔫 Bắn nhanh" &&
        shootTimer <= 0
    ){

        shoot();

        shootTimer = .10;

    }else if(
        currentSkill === "Không" &&
        shootTimer <= 0
    ){

        shoot();

        shootTimer = .42;
    }


    /*
       ÂM THANH SKILL
    */
    if(currentSkill !== "Không" && soundSkillCooldown <= 0){
        if(currentSkill === "🔥 Phun lửa") playSfx("fire");
        else if(currentSkill === "⚡ Tia điện" || currentSkill === "⚡⚡ Sét Lan") playSfx("electric");
        else if(currentSkill === "❄️ Tia băng" || currentSkill === "🧊 Đóng Băng Toàn Màn") playSfx("ice");
        else if(currentSkill === "🔆 Laser") playSfx("laser");
        else if(currentSkill === "🌀 Lốc Xoáy") playSfx("vortex");
        else if(currentSkill === "🛡️ Khiên" || currentSkill === "🌈 Khiên Lửa") playSfx("shield");

        soundSkillCooldown = 0.55;
    }

    /*
       SKILL
    */

    useSkill(dt);


    /*
       UPDATE
    */

    updateEnemies(dt);

    if(!running){
        return;
    }


    updateBombs(dt);

    if(!running){
        return;
    }


    updateFruits(dt);

    updateBullets(dt);

    updateParticles(dt);
    cleanupOffscreen();


    /*
       DỌN RÁC LẦN CUỐI TRƯỚC KHI VẼ
    */
    cleanupOffscreen();

    /*
       DRAW
    */

    draw();

    updateUI();


    /*
       FRAME
    */

    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    if(soundEnabled) unlockAudio();
    playSfx("start");

    cancelAnimationFrame(
        animationId
    );


    running = false;


    resetGame();


    running = true;


    lastTime =
        performance.now();


    animationId =
        requestAnimationFrame(
            gameLoop
        );
}

/* =====================================================
   MOBILE BUTTON
===================================================== */

function setupMoveButton(
    id,
    direction
){

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            keys[direction] = true;


            try{

                button.setPointerCapture(
                    e.pointerId
                );

            }catch(error){}
        }
    );


    button.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            keys[direction] = false;
        }
    );


    button.addEventListener(
        "lostpointercapture",
        function(){

            keys[direction] = false;
        }
    );
}


setupMoveButton(
    "left",
    "left"
);


setupMoveButton(
    "right",
    "right"
);

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "ArrowLeft"
        ){

            e.preventDefault();

            keys.left = true;
        }


        if(
            e.key === "ArrowRight"
        ){

            e.preventDefault();

            keys.right = true;
        }
    }
);


window.addEventListener(
    "keyup",
    function(e){

        if(
            e.key === "ArrowLeft" ||
            e.key === "a"
        ){

            keys.left = false;
        }


        if(
            e.key === "ArrowRight" ||
            e.key === "d"
        ){

            keys.right = false;
        }
    }
);

    );
});
